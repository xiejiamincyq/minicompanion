<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Arial, Helvetica, sans-serif" font-size="10">
  <title>DESIGN 5: RETRO TV — Devotchi Desktop Case Concept</title>

  <!-- Background -->
  <rect width="1200" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="600" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">DESIGN 5: RETRO TV — Devotchi Desktop Case Concept</text>
  <line x1="120" y1="42" x2="1080" y2="42" stroke="#999" stroke-width="0.5"/>

  <!-- ============================================================ -->
  <!-- MARKERS (dimension arrows) -->
  <!-- ============================================================ -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#CC0000"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#CC0000"/>
    </marker>
    <!-- Hatching for cross-section walls -->
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#404040" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- ============================================================ -->
  <!-- FRONT VIEW (top-left) -->
  <!-- ============================================================ -->
  <g transform="translate(40, 55)">
    <text x="225" y="10" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Front View</text>

    <!-- Antenna stubs -->
    <!-- Left antenna -->
    <rect x="155" y="22" width="6" height="25" rx="2" fill="#A0A0A0" stroke="#222" stroke-width="0.5"/>
    <!-- Right antenna -->
    <rect x="285" y="22" width="6" height="25" rx="2" fill="#A0A0A0" stroke="#222" stroke-width="0.5"/>
    <!-- Antenna dimension: 6mm dia, 25mm tall -->
    <line x1="130" y1="22" x2="130" y2="47" stroke="#CC0000" stroke-width="0.4"/>
    <line x1="127" y1="22" x2="133" y2="22" stroke="#CC0000" stroke-width="0.4"/>
    <line x1="127" y1="47" x2="133" y2="47" stroke="#CC0000" stroke-width="0.4"/>
    <line x1="130" y1="22" x2="130" y2="47" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <text x="118" y="37" text-anchor="end" font-size="9" fill="#CC0000">25mm</text>
    <!-- Antenna width label -->
    <text x="158" y="18" text-anchor="middle" font-size="9" fill="#CC0000">6mm</text>

    <!-- Main TV body: 165mm W x 110mm H, scaled ~2.5x for display -->
    <!-- Display scale: 1mm ~ 2.55px, so 165mm=420px, 110mm=280px -->
    <rect x="15" y="47" width="420" height="280" rx="22" fill="#E0E0E0" stroke="#222" stroke-width="0.5"/>

    <!-- Thick bezel frame -->
    <rect x="55" y="67" width="300" height="200" rx="12" fill="#C8C8C8" stroke="#222" stroke-width="0.5"/>

    <!-- Screen window: 41.8x31.6mm => ~107x81px -->
    <rect x="102" y="102" width="207" height="130" rx="8" fill="#B0D4F1" stroke="#222" stroke-width="0.5"/>

    <!-- LED hole below screen -->
    <circle cx="205" cy="258" r="4" fill="#333" stroke="#222" stroke-width="0.5"/>
    <text x="220" y="261" font-size="9" fill="#555">LED</text>

    <!-- Decorative bottom lip / speaker grille area -->
    <rect x="55" y="278" width="300" height="36" rx="6" fill="#D0D0D0" stroke="#222" stroke-width="0.5"/>
    <!-- Grille lines -->
    <line x1="95" y1="286" x2="310" y2="286" stroke="#999" stroke-width="0.5"/>
    <line x1="95" y1="292" x2="310" y2="292" stroke="#999" stroke-width="0.5"/>
    <line x1="95" y1="298" x2="310" y2="298" stroke="#999" stroke-width="0.5"/>
    <line x1="95" y1="304" x2="310" y2="304" stroke="#999" stroke-width="0.5"/>

    <!-- ===== Dimension lines ===== -->
    <!-- Overall width: 165mm -->
    <line x1="15" y1="345" x2="435" y2="345" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <line x1="15" y1="327" x2="15" y2="350" stroke="#CC0000" stroke-width="0.4"/>
    <line x1="435" y1="327" x2="435" y2="350" stroke="#CC0000" stroke-width="0.4"/>
    <text x="225" y="358" text-anchor="middle" font-size="10" fill="#CC0000">165mm</text>

    <!-- Overall height: 110mm -->
    <line x1="455" y1="47" x2="455" y2="327" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <line x1="435" y1="47" x2="462" y2="47" stroke="#CC0000" stroke-width="0.4"/>
    <line x1="435" y1="327" x2="462" y2="327" stroke="#CC0000" stroke-width="0.4"/>
    <text x="472" y="192" text-anchor="start" font-size="10" fill="#CC0000" transform="rotate(90 472 192)">110mm</text>

    <!-- Screen width: 41.8mm (~107px) -->
    <line x1="102" y1="80" x2="309" y2="80" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <text x="205" y="77" text-anchor="middle" font-size="9" fill="#CC0000">41.8mm</text>

    <!-- Screen height: 31.6mm (~81px) — right side of screen -->
    <line x1="320" y1="102" x2="320" y2="232" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <text x="334" y="170" text-anchor="start" font-size="9" fill="#CC0000">31.6mm</text>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT SIDE VIEW (top-right) -->
  <!-- ============================================================ -->
  <g transform="translate(620, 55)">
    <text x="160" y="10" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Right Side View</text>

    <!-- Side body: 65mm depth x 110mm height => ~166px x 280px -->
    <!-- Rounded front edge on left side -->
    <path d="M30,47 Q10,47 10,69 L10,305 Q10,327 30,327 L196,327 L196,47 Z"
          fill="#E0E0E0" stroke="#222" stroke-width="0.5"/>

    <!-- 3 knob-style buttons: 8mm dia => ~20px dia, evenly spaced -->
    <!-- Spacing: 3 buttons over 280px height, center region -->
    <circle cx="175" cy="130" r="10" fill="#C0C0C0" stroke="#222" stroke-width="0.5"/>
    <circle cx="175" cy="130" r="4" fill="#999" stroke="#222" stroke-width="0.3"/>

    <circle cx="175" cy="190" r="10" fill="#C0C0C0" stroke="#222" stroke-width="0.5"/>
    <circle cx="175" cy="190" r="4" fill="#999" stroke="#222" stroke-width="0.3"/>

    <circle cx="175" cy="250" r="10" fill="#C0C0C0" stroke="#222" stroke-width="0.5"/>
    <circle cx="175" cy="250" r="4" fill="#999" stroke="#222" stroke-width="0.3"/>

    <!-- Button label -->
    <text x="200" y="134" font-size="9" fill="#555">8mm knobs</text>

    <!-- Rounded front profile edge indicator -->
    <path d="M10,69 L10,305" stroke="#222" stroke-width="0.5" stroke-dasharray="3,2" fill="none"/>

    <!-- ===== Dimension lines ===== -->
    <!-- Depth: 65mm -->
    <line x1="10" y1="345" x2="196" y2="345" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <line x1="10" y1="327" x2="10" y2="350" stroke="#CC0000" stroke-width="0.4"/>
    <line x1="196" y1="327" x2="196" y2="350" stroke="#CC0000" stroke-width="0.4"/>
    <text x="103" y="358" text-anchor="middle" font-size="10" fill="#CC0000">65mm</text>

    <!-- Height: 110mm -->
    <line x1="220" y1="47" x2="220" y2="327" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <line x1="196" y1="47" x2="226" y2="47" stroke="#CC0000" stroke-width="0.4"/>
    <line x1="196" y1="327" x2="226" y2="327" stroke="#CC0000" stroke-width="0.4"/>
    <text x="236" y="192" text-anchor="start" font-size="10" fill="#CC0000" transform="rotate(90 236 192)">110mm</text>

    <!-- Button diameter -->
    <line x1="165" y1="105" x2="185" y2="105" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <text x="175" y="100" text-anchor="middle" font-size="9" fill="#CC0000">8mm</text>
  </g>

  <!-- ============================================================ -->
  <!-- CROSS-SECTION (bottom-left) -->
  <!-- ============================================================ -->
  <g transform="translate(40, 470)">
    <text x="225" y="10" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Cross-Section (Horizontal at Screen Height)</text>

    <!-- Scale: 65mm depth => ~420px, 165mm width shown as height => we show a top-down slice -->
    <!-- Depth runs left-right: 65mm = ~420px => 6.46px/mm -->
    <!-- Width runs top-bottom: 165mm but we only show a slice -->

    <!-- Outer shell outline -->
    <rect x="10" y="30" width="420" height="200" rx="16" fill="none" stroke="#222" stroke-width="0.5"/>

    <!-- Front wall (left side, rounded) — 3mm thick => ~19px -->
    <path d="M10,30 Q10,22 26,22 L26,238 Q10,238 10,230 L10,30 Z" fill="url(#hatch)" stroke="#606060" stroke-width="0.5"/>
    <rect x="10" y="30" width="19" height="200" rx="8" fill="url(#hatch)" stroke="#606060" stroke-width="0.5"/>

    <!-- Back wall (right side, flat) — 2mm thick => ~13px -->
    <rect x="417" y="30" width="13" height="200" fill="url(#hatch)" stroke="#606060" stroke-width="0.5"/>

    <!-- Internal cavity fill -->
    <rect x="29" y="30" width="388" height="200" fill="#F5F5F5" stroke="none"/>

    <!-- Screen pocket: 5mm deep => ~32px from front wall -->
    <rect x="29" y="55" width="32" height="150" fill="#DDE8F0" stroke="#222" stroke-width="0.4"/>
    <!-- Screen module in pocket -->
    <rect x="29" y="65" width="20" height="130" fill="#B0D4F1" stroke="#222" stroke-width="0.5"/>
    <text x="39" y="135" text-anchor="middle" font-size="8" fill="#336" transform="rotate(-90 39 135)">Screen</text>

    <!-- PCB on standoffs -->
    <rect x="130" y="50" width="4" height="160" fill="#90C695" stroke="#222" stroke-width="0.5"/>
    <!-- Standoffs (small rectangles) -->
    <rect x="61" y="60" width="69" height="6" fill="#AAA" stroke="#222" stroke-width="0.3"/>
    <rect x="61" y="194" width="69" height="6" fill="#AAA" stroke="#222" stroke-width="0.3"/>
    <text x="132" y="135" text-anchor="middle" font-size="8" fill="#264" transform="rotate(-90 132 135)">PCB</text>

    <!-- Speaker in rear cavity: 28mm => ~181px dia => too big, scale for the slice: ~90px shown -->
    <circle cx="310" cy="130" r="45" fill="#D4A84B" fill-opacity="0.4" stroke="#D4A84B" stroke-width="0.5"/>
    <circle cx="310" cy="130" r="20" fill="#D4A84B" fill-opacity="0.6" stroke="#D4A84B" stroke-width="0.5"/>
    <text x="310" y="134" text-anchor="middle" font-size="9" fill="#6B4F1A">Speaker</text>
    <text x="310" y="146" text-anchor="middle" font-size="8" fill="#6B4F1A">28mm</text>

    <!-- ===== Dimension lines ===== -->
    <!-- Total depth: 65mm -->
    <line x1="10" y1="252" x2="430" y2="252" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <line x1="10" y1="230" x2="10" y2="257" stroke="#CC0000" stroke-width="0.4"/>
    <line x1="430" y1="230" x2="430" y2="257" stroke="#CC0000" stroke-width="0.4"/>
    <text x="220" y="265" text-anchor="middle" font-size="10" fill="#CC0000">65mm total depth</text>

    <!-- Front wall: 3mm -->
    <line x1="10" y1="280" x2="29" y2="280" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <text x="20" y="292" text-anchor="middle" font-size="9" fill="#CC0000">3mm</text>

    <!-- Screen pocket: 5mm -->
    <line x1="29" y1="280" x2="61" y2="280" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <text x="45" y="292" text-anchor="middle" font-size="9" fill="#CC0000">5mm</text>

    <!-- Back wall: 2mm -->
    <line x1="417" y1="280" x2="430" y2="280" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <text x="424" y="292" text-anchor="middle" font-size="9" fill="#CC0000">2mm</text>

    <!-- Legend -->
    <rect x="15" y="310" width="12" height="8" fill="url(#hatch)" stroke="#606060" stroke-width="0.3"/>
    <text x="32" y="317" font-size="9" fill="#444">Shell wall</text>
    <rect x="95" y="310" width="12" height="8" fill="#B0D4F1" stroke="#222" stroke-width="0.3"/>
    <text x="112" y="317" font-size="9" fill="#444">Screen</text>
    <rect x="165" y="310" width="12" height="8" fill="#90C695" stroke="#222" stroke-width="0.3"/>
    <text x="182" y="317" font-size="9" fill="#444">PCB</text>
    <rect x="225" y="310" width="12" height="8" fill="#D4A84B" stroke="#222" stroke-width="0.3"/>
    <text x="242" y="317" font-size="9" fill="#444">Speaker</text>
  </g>

  <!-- ============================================================ -->
  <!-- BACK VIEW (bottom-right) -->
  <!-- ============================================================ -->
  <g transform="translate(560, 470)">
    <text x="210" y="10" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Back View</text>

    <!-- Main back panel: 165mm x 110mm => 420x280 but scaled to fit ~350x260 -->
    <!-- Scale: ~2.36px/mm -->
    <rect x="15" y="30" width="390" height="260" rx="6" fill="#D8D8D8" stroke="#222" stroke-width="0.5"/>

    <!-- Vent slot array: 7 horizontal slots -->
    <rect x="120" y="55" width="180" height="6" rx="3" fill="#888" stroke="#222" stroke-width="0.3"/>
    <rect x="120" y="70" width="180" height="6" rx="3" fill="#888" stroke="#222" stroke-width="0.3"/>
    <rect x="120" y="85" width="180" height="6" rx="3" fill="#888" stroke="#222" stroke-width="0.3"/>
    <rect x="120" y="100" width="180" height="6" rx="3" fill="#888" stroke="#222" stroke-width="0.3"/>
    <rect x="120" y="115" width="180" height="6" rx="3" fill="#888" stroke="#222" stroke-width="0.3"/>
    <rect x="120" y="130" width="180" height="6" rx="3" fill="#888" stroke="#222" stroke-width="0.3"/>
    <rect x="120" y="145" width="180" height="6" rx="3" fill="#888" stroke="#222" stroke-width="0.3"/>
    <text x="315" y="107" font-size="9" fill="#555">Vent slots</text>

    <!-- USB-C cutout: 9.5x3.5mm => ~22x8px, centered at bottom -->
    <rect x="199" y="252" width="22" height="8" rx="3" fill="#444" stroke="#222" stroke-width="0.5"/>
    <text x="210" y="248" text-anchor="middle" font-size="9" fill="#555">USB-C</text>
    <!-- USB-C dimension -->
    <line x1="199" y1="272" x2="221" y2="272" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <text x="210" y="283" text-anchor="middle" font-size="9" fill="#CC0000">9.5x3.5mm</text>

    <!-- 4x screw positions -->
    <circle cx="40" cy="55" r="5" fill="none" stroke="#222" stroke-width="0.5"/>
    <circle cx="40" cy="55" r="1.5" fill="#222"/>
    <circle cx="380" cy="55" r="5" fill="none" stroke="#222" stroke-width="0.5"/>
    <circle cx="380" cy="55" r="1.5" fill="#222"/>
    <circle cx="40" cy="265" r="5" fill="none" stroke="#222" stroke-width="0.5"/>
    <circle cx="40" cy="265" r="1.5" fill="#222"/>
    <circle cx="380" cy="265" r="5" fill="none" stroke="#222" stroke-width="0.5"/>
    <circle cx="380" cy="265" r="1.5" fill="#222"/>
    <text x="55" y="45" font-size="9" fill="#555">Screw (x4)</text>

    <!-- ===== Dimension lines ===== -->
    <!-- Overall width: 165mm -->
    <line x1="15" y1="308" x2="405" y2="308" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <line x1="15" y1="290" x2="15" y2="313" stroke="#CC0000" stroke-width="0.4"/>
    <line x1="405" y1="290" x2="405" y2="313" stroke="#CC0000" stroke-width="0.4"/>
    <text x="210" y="322" text-anchor="middle" font-size="10" fill="#CC0000">165mm</text>

    <!-- Overall height: 110mm -->
    <line x1="425" y1="30" x2="425" y2="290" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrR)" marker-end="url(#arr)"/>
    <line x1="405" y1="30" x2="432" y2="30" stroke="#CC0000" stroke-width="0.4"/>
    <line x1="405" y1="290" x2="432" y2="290" stroke="#CC0000" stroke-width="0.4"/>
    <text x="440" y="165" text-anchor="start" font-size="10" fill="#CC0000" transform="rotate(90 440 165)">110mm</text>
  </g>

  <!-- Footer -->
  <line x1="120" y1="870" x2="1080" y2="870" stroke="#999" stroke-width="0.5"/>
  <text x="600" y="888" text-anchor="middle" font-size="9" fill="#888">Devotchi Desktop Case — Design 5: Retro TV — All dimensions in mm — Not to scale</text>
</svg>