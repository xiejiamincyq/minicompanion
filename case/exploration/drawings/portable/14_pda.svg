<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#CC0000" stroke="none"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#CC0000" stroke="none"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="white"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Design 14: PDA — 75×55×16mm Portrait (Palm Pilot Style)</text>

  <!-- ==================== FRONT VIEW (top-left) ==================== -->
  <text x="200" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Front View</text>

  <!-- Shell outline 75 tall × 55 wide, scale ~3.5x -->
  <rect x="104" y="75" width="192" height="263" rx="10" ry="10" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Screen upper 70%: active area 40.80×30.60 scaled, positioned upper -->
  <rect x="128" y="90" width="143" height="143" rx="3" ry="3" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>

  <!-- 4 round app buttons in 2×2 grid -->
  <circle cx="160" cy="270" r="12" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
  <circle cx="200" cy="270" r="12" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
  <circle cx="240" cy="270" r="12" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
  <circle cx="280" cy="270" r="12" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>

  <!-- Rocker pad below buttons -->
  <rect x="175" y="295" width="50" height="20" rx="10" ry="10" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
  <line x1="200" y1="298" x2="200" y2="312" stroke="black" stroke-width="0.5"/>

  <!-- Stylus slot on right edge -->
  <rect x="293" y="100" width="5" height="80" rx="2" ry="2" fill="#A0A0A0" stroke="black" stroke-width="0.5"/>
  <text x="310" y="145" font-family="sans-serif" font-size="9" fill="#333">Stylus slot</text>

  <!-- Labels -->
  <text x="200" y="165" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Screen</text>
  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">App buttons</text>
  <text x="200" y="322" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Rocker</text>

  <!-- Dimension: width 55mm -->
  <line x1="104" y1="355" x2="296" y2="355" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="200" y="368" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">55mm</text>

  <!-- Dimension: height 75mm -->
  <line x1="85" y1="75" x2="85" y2="338" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="75" y="210" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000" transform="rotate(-90 75 210)">75mm</text>

  <!-- ==================== SIDE PROFILE (top-center) ==================== -->
  <text x="600" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Side Profile</text>

  <!-- 16mm thick × 75mm tall, scale ~3.5x -->
  <rect x="572" y="75" width="56" height="263" rx="5" ry="5" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Screen surface line -->
  <line x1="572" y1="90" x2="572" y2="233" stroke="#4488AA" stroke-width="1"/>
  <text x="560" y="160" text-anchor="end" font-family="sans-serif" font-size="9" fill="#333">Screen</text>

  <!-- Stylus slot groove on right side -->
  <rect x="625" y="100" width="4" height="80" rx="1" ry="1" fill="#888" stroke="black" stroke-width="0.5"/>
  <text x="640" y="145" font-family="sans-serif" font-size="9" fill="#333">Stylus groove</text>

  <!-- USB-C at bottom -->
  <rect x="585" y="333" width="30" height="5" rx="2" ry="2" fill="#666" stroke="black" stroke-width="0.5"/>
  <text x="600" y="352" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">USB-C</text>

  <!-- Dimension: thickness 16mm -->
  <line x1="555" y1="75" x2="555" y2="338" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="545" y="210" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000" transform="rotate(-90 545 210)">75mm</text>

  <line x1="572" y1="355" x2="628" y2="355" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="600" y="368" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">16mm</text>

  <!-- ==================== BACK VIEW (top-right) ==================== -->
  <text x="1000" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Back View</text>

  <!-- Shell outline -->
  <rect x="904" y="75" width="192" height="263" rx="10" ry="10" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Battery door -->
  <rect x="930" y="140" width="140" height="100" rx="3" ry="3" fill="#D8D8D8" stroke="black" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="1000" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Battery door</text>

  <!-- Infrared window at top -->
  <rect x="975" y="82" width="50" height="10" rx="3" ry="3" fill="#8B0000" stroke="black" stroke-width="0.5"/>
  <text x="1000" y="105" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">IR window</text>

  <!-- Speaker grille -->
  <line x1="970" y1="270" x2="1030" y2="270" stroke="#999" stroke-width="0.5"/>
  <line x1="970" y1="275" x2="1030" y2="275" stroke="#999" stroke-width="0.5"/>
  <line x1="970" y1="280" x2="1030" y2="280" stroke="#999" stroke-width="0.5"/>
  <line x1="970" y1="285" x2="1030" y2="285" stroke="#999" stroke-width="0.5"/>
  <text x="1000" y="300" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Speaker</text>

  <!-- Flat back label -->
  <text x="1000" y="325" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">Flat back panel</text>

  <!-- ==================== TOP-DOWN VIEW (bottom-left) ==================== -->
  <text x="200" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Top-Down View</text>

  <!-- Top of PDA: 55mm wide × 16mm deep -->
  <rect x="104" y="480" width="192" height="56" rx="5" ry="5" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- IR window insert -->
  <rect x="175" y="482" width="50" height="8" rx="3" ry="3" fill="#8B0000" stroke="black" stroke-width="0.5"/>
  <text x="200" y="505" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">IR window (dark red)</text>

  <!-- Stylus slot on right -->
  <rect x="293" y="488" width="5" height="40" rx="1" ry="1" fill="#A0A0A0" stroke="black" stroke-width="0.5"/>
  <text x="310" y="510" font-family="sans-serif" font-size="9" fill="#333">Stylus</text>

  <!-- Screen visible through top edge hint -->
  <line x1="128" y1="495" x2="271" y2="495" stroke="#4488AA" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="200" y="525" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4488AA">Screen plane (hidden)</text>

  <!-- Dimensions -->
  <line x1="104" y1="555" x2="296" y2="555" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="200" y="568" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">55mm</text>

  <line x1="85" y1="480" x2="85" y2="536" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="75" y="510" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000" transform="rotate(-90 75 510)">16mm</text>

  <!-- ==================== CROSS-SECTION (bottom-center) ==================== -->
  <text x="600" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Cross-Section (Z-Stack)</text>

  <!-- Outer shell cross-section -->
  <rect x="510" y="480" width="180" height="210" rx="5" ry="5" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  <!-- Inner cavity -->
  <rect x="518" y="488" width="164" height="194" rx="3" ry="3" fill="white" stroke="black" stroke-width="0.5"/>

  <!-- Display module — top layer -->
  <rect x="525" y="493" width="150" height="35" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="600" y="514" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Display (2.0mm)</text>

  <!-- Air gap -->
  <rect x="525" y="528" width="150" height="10" fill="#F8F8F8" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="600" y="537" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">Gap (0.5mm)</text>

  <!-- PCB -->
  <rect x="525" y="538" width="150" height="28" fill="#90C695" stroke="black" stroke-width="0.5"/>
  <text x="600" y="556" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">PCB (1.6mm)</text>

  <!-- Components clearance -->
  <rect x="525" y="566" width="150" height="30" fill="#F0F0F0" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="600" y="584" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">Components (3mm)</text>

  <!-- Battery -->
  <rect x="525" y="596" width="150" height="70" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
  <text x="600" y="635" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Battery (5mm)</text>

  <!-- Bottom shell wall hint -->
  <rect x="525" y="666" width="150" height="12" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  <text x="600" y="676" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">Shell (1.5mm)</text>

  <!-- Z-stack dimension -->
  <line x1="710" y1="480" x2="710" y2="690" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="730" y="588" font-family="sans-serif" font-size="9" fill="#CC0000">15.1mm</text>
  <text x="730" y="600" font-family="sans-serif" font-size="9" fill="#CC0000">Z-stack</text>

  <!-- Shell total -->
  <line x1="490" y1="480" x2="490" y2="690" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="480" y="588" text-anchor="end" font-family="sans-serif" font-size="9" fill="#CC0000">16mm total</text>

  <!-- ==================== DETAIL CLOSEUP (bottom-right) ==================== -->
  <text x="1000" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Detail — Stylus Slot + IR Window</text>

  <!-- Stylus slot detail (enlarged) -->
  <text x="950" y="490" font-family="sans-serif" font-size="10" fill="#333">Stylus Slot Cross-Section:</text>

  <!-- Shell edge with slot -->
  <rect x="900" y="505" width="30" height="120" rx="2" ry="2" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  <!-- Slot channel -->
  <rect x="925" y="515" width="8" height="100" rx="2" ry="2" fill="white" stroke="black" stroke-width="0.5"/>
  <!-- Stylus in slot -->
  <rect x="927" y="520" width="4" height="90" rx="2" ry="2" fill="#888" stroke="black" stroke-width="0.5"/>

  <text x="950" y="570" font-family="sans-serif" font-size="9" fill="#333">Stylus</text>
  <text x="950" y="582" font-family="sans-serif" font-size="9" fill="#333">(∅3mm)</text>

  <!-- Slot width dimension -->
  <line x1="925" y1="640" x2="933" y2="640" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="929" y="655" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#CC0000">4mm</text>

  <!-- IR Window detail -->
  <text x="1060" y="490" font-family="sans-serif" font-size="10" fill="#333">IR Window Detail:</text>

  <!-- IR window housing -->
  <rect x="1020" y="505" width="120" height="40" rx="5" ry="5" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
  <!-- Dark red IR-transparent plastic -->
  <rect x="1035" y="512" width="90" height="26" rx="3" ry="3" fill="#8B0000" stroke="black" stroke-width="0.5"/>
  <text x="1080" y="530" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white">IR-transparent</text>

  <!-- IR LED behind window -->
  <circle cx="1065" cy="570" r="4" fill="#FF4444" stroke="black" stroke-width="0.5"/>
  <text x="1085" y="573" font-family="sans-serif" font-size="9" fill="#333">IR LED</text>
  <circle cx="1095" cy="570" r="4" fill="#FF4444" stroke="black" stroke-width="0.5"/>
  <text x="1115" y="573" font-family="sans-serif" font-size="9" fill="#333">IR Recv</text>

  <!-- Connection lines -->
  <line x1="1065" y1="538" x2="1065" y2="566" stroke="#999" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="1095" y1="538" x2="1095" y2="566" stroke="#999" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- IR window dimension -->
  <line x1="1035" y1="555" x2="1125" y2="555" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="1080" y="552" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#CC0000">12mm window</text>

  <!-- Note -->
  <text x="1000" y="620" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">IR window uses dark red polycarbonate</text>
  <text x="1000" y="635" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">for 940nm transparency</text>
</svg>