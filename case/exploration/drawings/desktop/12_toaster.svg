<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="sans-serif" font-size="10">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#CC0000" stroke="none"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#CC0000" stroke="none"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="white"/>

  <!-- Title -->
  <text x="600" y="28" text-anchor="middle" font-size="14" font-weight="bold">Design 12: Toaster — 120×70×90mm Desktop Devotchi Case</text>

  <!-- Grid labels -->
  <text x="200" y="55" text-anchor="middle" font-size="11" font-weight="bold">Front View</text>
  <text x="600" y="55" text-anchor="middle" font-size="11" font-weight="bold">Side Profile</text>
  <text x="1000" y="55" text-anchor="middle" font-size="11" font-weight="bold">Back View</text>
  <text x="200" y="475" text-anchor="middle" font-size="11" font-weight="bold">Top-Down View</text>
  <text x="600" y="475" text-anchor="middle" font-size="11" font-weight="bold">Cross-Section</text>
  <text x="1000" y="475" text-anchor="middle" font-size="11" font-weight="bold">Detail: Lever &amp; Spring</text>

  <!-- ==================== FRONT VIEW (top-left) ==================== -->
  <g transform="translate(200,250)">
    <!-- Toaster body - rounded rectangle -->
    <rect x="-90" y="-120" width="180" height="160" rx="18" ry="18" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Top slot opening -->
    <rect x="-60" y="-125" width="120" height="10" rx="3" fill="#888" stroke="black" stroke-width="0.5"/>
    <!-- Screen popping up from slot -->
    <rect x="-50" y="-190" width="100" height="62" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-155" text-anchor="middle" font-size="9" fill="#336">5.0" Screen</text>
    <!-- Screen carriage rails visible -->
    <line x1="-50" y1="-128" x2="-50" y2="-190" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>
    <line x1="50" y1="-128" x2="50" y2="-190" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>
    <!-- 3 toast-control buttons -->
    <rect x="-55" y="-10" width="22" height="12" rx="3" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <rect x="-11" y="-10" width="22" height="12" rx="3" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <rect x="33" y="-10" width="22" height="12" rx="3" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <text x="-44" y="18" text-anchor="middle" font-size="9">BTN1</text>
    <text x="0" y="18" text-anchor="middle" font-size="9">BTN2</text>
    <text x="44" y="18" text-anchor="middle" font-size="9">BTN3</text>
    <!-- Base foot -->
    <rect x="-85" y="40" width="170" height="8" rx="2" fill="#999" stroke="black" stroke-width="0.5"/>

    <!-- Dimensions -->
    <line x1="-90" y1="65" x2="90" y2="65" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="75" text-anchor="middle" font-size="9" fill="#CC0000">120mm</text>
    <line x1="110" y1="-190" x2="110" y2="48" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="125" y="-65" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(90,125,-65)">~155mm extended</text>
  </g>

  <!-- ==================== SIDE PROFILE (top-center) ==================== -->
  <g transform="translate(600,250)">
    <!-- Toaster body side -->
    <rect x="-55" y="-120" width="110" height="160" rx="18" ry="18" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Screen popped up -->
    <rect x="-35" y="-190" width="70" height="62" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <!-- Carriage rails -->
    <line x1="-30" y1="-128" x2="-30" y2="-190" stroke="#666" stroke-width="0.5"/>
    <line x1="30" y1="-128" x2="30" y2="-190" stroke="#666" stroke-width="0.5"/>
    <!-- Spring mechanism (dashed - internal) -->
    <path d="M-20,-125 L-15,-115 L-25,-105 L-15,-95 L-25,-85 L-15,-75 L-20,-70" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>
    <path d="M20,-125 L25,-115 L15,-105 L25,-95 L15,-85 L25,-75 L20,-70" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>
    <!-- Push-down lever on right side -->
    <rect x="52" y="-40" width="12" height="45" rx="3" fill="#999" stroke="black" stroke-width="0.5"/>
    <circle cx="58" cy="-40" r="5" fill="#888" stroke="black" stroke-width="0.5"/>
    <text x="80" y="-15" font-size="9">Lever</text>
    <!-- Base -->
    <rect x="-50" y="40" width="100" height="8" rx="2" fill="#999" stroke="black" stroke-width="0.5"/>

    <!-- Dimensions -->
    <line x1="-55" y1="65" x2="55" y2="65" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="75" text-anchor="middle" font-size="9" fill="#CC0000">70mm</text>
    <line x1="-80" y1="-120" x2="-80" y2="40" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-95" y="-35" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(-90,-95,-35)">90mm body</text>
  </g>

  <!-- ==================== BACK VIEW (top-right) ==================== -->
  <g transform="translate(1000,250)">
    <!-- Toaster body back -->
    <rect x="-90" y="-120" width="180" height="160" rx="18" ry="18" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Rounded back texture lines -->
    <line x1="-70" y1="-100" x2="-70" y2="20" stroke="#CCC" stroke-width="0.3"/>
    <line x1="70" y1="-100" x2="70" y2="20" stroke="#CCC" stroke-width="0.3"/>
    <!-- USB-C port at bottom -->
    <rect x="-7" y="28" width="14" height="5" rx="2" fill="#333" stroke="black" stroke-width="0.5"/>
    <text x="0" y="47" text-anchor="middle" font-size="9">USB-C (8.94×3.26mm)</text>
    <!-- Ventilation slots -->
    <rect x="-30" y="-80" width="60" height="2" rx="1" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <rect x="-30" y="-72" width="60" height="2" rx="1" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <rect x="-30" y="-64" width="60" height="2" rx="1" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <text x="0" y="-85" text-anchor="middle" font-size="9">Vent slots</text>
    <!-- Base -->
    <rect x="-85" y="40" width="170" height="8" rx="2" fill="#999" stroke="black" stroke-width="0.5"/>
  </g>

  <!-- ==================== TOP-DOWN VIEW (bottom-left) ==================== -->
  <g transform="translate(200,670)">
    <!-- Toaster top outline -->
    <rect x="-90" y="-100" width="180" height="110" rx="18" ry="18" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Bread slot opening -->
    <rect x="-65" y="-75" width="130" height="55" rx="5" fill="#666" stroke="black" stroke-width="0.5"/>
    <!-- Screen carriage visible in slot -->
    <rect x="-50" y="-60" width="100" height="40" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-36" text-anchor="middle" font-size="9" fill="#336">Screen carriage</text>
    <!-- Lever slot on side -->
    <rect x="85" y="-30" width="10" height="30" rx="2" fill="#999" stroke="black" stroke-width="0.5"/>
    <text x="85" y="15" text-anchor="middle" font-size="9">Lever</text>

    <!-- Dimensions -->
    <line x1="-90" y1="30" x2="90" y2="30" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="42" text-anchor="middle" font-size="9" fill="#CC0000">120mm</text>
    <line x1="-110" y1="-100" x2="-110" y2="10" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-125" y="-40" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(-90,-125,-40)">70mm</text>
  </g>

  <!-- ==================== CROSS-SECTION (bottom-center) ==================== -->
  <g transform="translate(600,670)">
    <!-- Cut shell outline -->
    <rect x="-90" y="-150" width="180" height="180" rx="12" ry="12" fill="none" stroke="black" stroke-width="0.5"/>
    <!-- Left wall hatched -->
    <rect x="-90" y="-150" width="8" height="180" rx="0" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Right wall hatched -->
    <rect x="82" y="-150" width="8" height="180" rx="0" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Bottom wall hatched -->
    <rect x="-90" y="22" width="180" height="8" rx="0" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Top opening -->
    <line x1="-60" y1="-150" x2="60" y2="-150" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>

    <!-- PCB in base -->
    <rect x="-70" y="0" width="140" height="5" fill="#90C695" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-5" text-anchor="middle" font-size="9" fill="#336">PCB 110×65mm</text>

    <!-- Spring mechanism left -->
    <path d="M-50,-140 L-45,-130 L-55,-120 L-45,-110 L-55,-100 L-45,-90 L-50,-80" fill="none" stroke="#666" stroke-width="0.8"/>
    <!-- Spring mechanism right -->
    <path d="M50,-140 L55,-130 L45,-120 L55,-110 L45,-100 L55,-90 L50,-80" fill="none" stroke="#666" stroke-width="0.8"/>

    <!-- Screen on carriage (extended position) -->
    <rect x="-45" y="-180" width="90" height="45" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-155" text-anchor="middle" font-size="8" fill="#336">Screen on carriage</text>
    <!-- Carriage rails -->
    <rect x="-48" y="-180" width="3" height="95" fill="#999" stroke="black" stroke-width="0.3"/>
    <rect x="45" y="-180" width="3" height="95" fill="#999" stroke="black" stroke-width="0.3"/>

    <!-- Speaker in base -->
    <ellipse cx="0" cy="15" rx="18" ry="4" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
    <text x="0" y="27" text-anchor="middle" font-size="8">Speaker 28mm</text>

    <!-- Section cut indicator -->
    <text x="-95" y="-150" font-size="9" font-weight="bold">A</text>
    <text x="88" y="-150" font-size="9" font-weight="bold">A</text>

    <!-- Dimension: body height -->
    <line x1="105" y1="-150" x2="105" y2="30" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="120" y="-55" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(90,120,-55)">90mm</text>
  </g>

  <!-- ==================== DETAIL: Lever &amp; Spring (bottom-right) ==================== -->
  <g transform="translate(1000,670)">
    <!-- Zoomed lever mechanism -->
    <rect x="-120" y="-140" width="240" height="280" rx="4" fill="#F8F8F8" stroke="black" stroke-width="0.3"/>
    <text x="0" y="-120" text-anchor="middle" font-size="10" font-weight="bold">Push-Down Lever Detail</text>

    <!-- Shell wall section -->
    <rect x="60" y="-100" width="10" height="200" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>

    <!-- Lever arm -->
    <rect x="65" y="-30" width="15" height="55" rx="4" fill="#999" stroke="black" stroke-width="0.5"/>
    <circle cx="72" cy="-30" r="8" fill="#888" stroke="black" stroke-width="0.5"/>
    <text x="95" y="-25" font-size="9">Lever knob</text>

    <!-- Lever pivot -->
    <circle cx="62" cy="0" r="3" fill="#666" stroke="black" stroke-width="0.5"/>
    <text x="95" y="4" font-size="9">Pivot</text>

    <!-- Internal linkage -->
    <line x1="60" y1="0" x2="20" y2="0" stroke="black" stroke-width="0.8"/>
    <line x1="20" y1="0" x2="20" y2="-80" stroke="black" stroke-width="0.8"/>

    <!-- Carriage -->
    <rect x="-40" y="-100" width="55" height="35" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="-12" y="-80" text-anchor="middle" font-size="8">Screen</text>

    <!-- Carriage rail -->
    <rect x="-45" y="-100" width="4" height="150" fill="#AAA" stroke="black" stroke-width="0.3"/>
    <rect x="15" y="-100" width="4" height="150" fill="#AAA" stroke="black" stroke-width="0.3"/>

    <!-- Spring -->
    <path d="M-30,-65 L-25,-55 L-35,-45 L-25,-35 L-35,-25 L-25,-15 L-35,-5 L-25,5 L-35,15 L-25,25 L-30,35" fill="none" stroke="#666" stroke-width="1"/>
    <text x="-60" y="-15" font-size="9">Spring</text>

    <!-- Latch notch -->
    <rect x="18" y="30" width="6" height="8" fill="#666" stroke="black" stroke-width="0.5"/>
    <text x="45" y="38" font-size="9">Latch</text>

    <!-- Arrow showing push direction -->
    <line x1="72" y1="40" x2="72" y2="70" stroke="#CC0000" stroke-width="0.8" marker-end="url(#arrow-end)"/>
    <text x="72" y="82" text-anchor="middle" font-size="9" fill="#CC0000">Push down</text>

    <!-- Arrow showing screen pop-up -->
    <line x1="-12" y1="-105" x2="-12" y2="-130" stroke="#CC0000" stroke-width="0.8" marker-end="url(#arrow-end)"/>
    <text x="-12" y="-135" text-anchor="middle" font-size="9" fill="#CC0000">Screen pops up</text>

    <!-- Wall thickness callout -->
    <line x1="60" y1="80" x2="70" y2="80" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="65" y="95" text-anchor="middle" font-size="8" fill="#CC0000">2.0mm wall</text>
  </g>
</svg>