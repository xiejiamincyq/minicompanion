<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="sans-serif" font-size="10">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#CC0000" stroke="none"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#CC0000" stroke="none"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="white"/>

  <!-- Title -->
  <text x="600" y="28" text-anchor="middle" font-size="14" font-weight="bold">Design 13: Terrarium — 100×80×120mm Cube on 110×90×15mm Base</text>

  <!-- Grid labels -->
  <text x="200" y="55" text-anchor="middle" font-size="11" font-weight="bold">Front View</text>
  <text x="600" y="55" text-anchor="middle" font-size="11" font-weight="bold">Side View</text>
  <text x="1000" y="55" text-anchor="middle" font-size="11" font-weight="bold">Back View</text>
  <text x="200" y="475" text-anchor="middle" font-size="11" font-weight="bold">Top-Down View</text>
  <text x="600" y="475" text-anchor="middle" font-size="11" font-weight="bold">Cross-Section</text>
  <text x="1000" y="475" text-anchor="middle" font-size="11" font-weight="bold">Detail: Base Joint &amp; Buttons</text>

  <!-- ==================== FRONT VIEW (top-left) ==================== -->
  <g transform="translate(200,265)">
    <!-- Wooden base -->
    <rect x="-82" y="55" width="164" height="22" rx="3" fill="#B8834E" stroke="black" stroke-width="0.5"/>
    <text x="0" y="70" text-anchor="middle" font-size="8" fill="white">Wooden Base</text>
    <!-- Button caps on base front -->
    <circle cx="-40" cy="50" r="5" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <circle cx="0" cy="50" r="5" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <circle cx="40" cy="50" r="5" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <text x="0" y="42" text-anchor="middle" font-size="8">6mm buttons ×3</text>

    <!-- Clear cube — dashed for transparency -->
    <rect x="-75" y="-120" width="150" height="175" rx="2" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="4,2"/>
    <!-- Faint fill to suggest glass -->
    <rect x="-75" y="-120" width="150" height="175" rx="2" fill="#D6EAF8" fill-opacity="0.15" stroke="none"/>

    <!-- Screen inside on bracket -->
    <rect x="-52" y="-55" width="104" height="65" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-20" text-anchor="middle" font-size="9" fill="#336">5.0" Screen</text>
    <!-- Bracket arm -->
    <line x1="-52" y1="10" x2="-52" y2="55" stroke="#666" stroke-width="1"/>
    <line x1="52" y1="10" x2="52" y2="55" stroke="#666" stroke-width="1"/>

    <!-- Decorative space hint -->
    <text x="55" y="-90" font-size="8" fill="#888">Decorative</text>
    <text x="55" y="-80" font-size="8" fill="#888">space</text>

    <!-- Dimensions -->
    <line x1="-75" y1="95" x2="75" y2="95" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="107" text-anchor="middle" font-size="9" fill="#CC0000">100mm cube</text>
    <line x1="95" y1="-120" x2="95" y2="55" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="110" y="-25" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(90,110,-25)">120mm cube</text>
    <line x1="-82" y1="92" x2="82" y2="92" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" stroke-dasharray="2,2"/>
    <text x="0" y="88" text-anchor="middle" font-size="8" fill="#CC0000">110mm base</text>
  </g>

  <!-- ==================== SIDE VIEW (top-center) ==================== -->
  <g transform="translate(600,265)">
    <!-- Wooden base side -->
    <rect x="-67" y="55" width="134" height="22" rx="3" fill="#B8834E" stroke="black" stroke-width="0.5"/>
    <!-- Clear cube side -->
    <rect x="-60" y="-120" width="120" height="175" rx="2" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="4,2"/>
    <rect x="-60" y="-120" width="120" height="175" rx="2" fill="#D6EAF8" fill-opacity="0.15" stroke="none"/>
    <!-- Screen inside -->
    <rect x="-3" y="-55" width="6" height="65" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="20" y="-20" font-size="8">Screen</text>
    <!-- Bracket -->
    <line x1="0" y1="10" x2="0" y2="55" stroke="#666" stroke-width="1"/>

    <!-- Dimensions -->
    <line x1="-60" y1="92" x2="60" y2="92" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="104" text-anchor="middle" font-size="9" fill="#CC0000">80mm</text>
    <line x1="-85" y1="-120" x2="-85" y2="77" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-98" y="-15" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(-90,-98,-15)">135mm total</text>
    <!-- Base height -->
    <line x1="78" y1="55" x2="78" y2="77" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="95" y="70" font-size="8" fill="#CC0000">15mm</text>
  </g>

  <!-- ==================== BACK VIEW (top-right) ==================== -->
  <g transform="translate(1000,265)">
    <!-- Wooden base back -->
    <rect x="-82" y="55" width="164" height="22" rx="3" fill="#B8834E" stroke="black" stroke-width="0.5"/>
    <!-- USB-C on base back -->
    <rect x="-7" y="58" width="14" height="5" rx="2" fill="#333" stroke="black" stroke-width="0.5"/>
    <text x="0" y="54" text-anchor="middle" font-size="9">USB-C</text>
    <!-- Clear cube back -->
    <rect x="-75" y="-120" width="150" height="175" rx="2" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="4,2"/>
    <rect x="-75" y="-120" width="150" height="175" rx="2" fill="#D6EAF8" fill-opacity="0.15" stroke="none"/>
    <!-- Screen back (visible through glass) -->
    <rect x="-52" y="-55" width="104" height="65" rx="2" fill="#999" fill-opacity="0.3" stroke="black" stroke-width="0.3" stroke-dasharray="3,2"/>
    <text x="0" y="-20" text-anchor="middle" font-size="8" fill="#888">Screen (behind)</text>
  </g>

  <!-- ==================== TOP-DOWN VIEW (bottom-left) ==================== -->
  <g transform="translate(200,680)">
    <!-- Base outline -->
    <rect x="-82" y="-68" width="164" height="136" rx="3" fill="#B8834E" fill-opacity="0.3" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>
    <!-- Cube outline -->
    <rect x="-75" y="-60" width="150" height="120" rx="2" fill="#D6EAF8" fill-opacity="0.2" stroke="black" stroke-width="0.5" stroke-dasharray="4,2"/>
    <!-- Screen visible inside -->
    <rect x="-52" y="-32" width="104" height="65" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="5" text-anchor="middle" font-size="9" fill="#336">Screen</text>
    <!-- Decorative areas -->
    <text x="0" y="-45" text-anchor="middle" font-size="8" fill="#888">Open decorative space</text>
    <text x="0" y="50" text-anchor="middle" font-size="8" fill="#888">around screen</text>

    <!-- Dimensions -->
    <line x1="-75" y1="82" x2="75" y2="82" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="94" text-anchor="middle" font-size="9" fill="#CC0000">100mm</text>
    <line x1="95" y1="-60" x2="95" y2="60" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="108" y="5" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(90,108,5)">80mm</text>
  </g>

  <!-- ==================== CROSS-SECTION (bottom-center) ==================== -->
  <g transform="translate(600,680)">
    <!-- Base cross section -->
    <rect x="-82" y="55" width="164" height="22" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Base interior -->
    <rect x="-74" y="57" width="148" height="18" fill="#B8834E" fill-opacity="0.4" stroke="none"/>

    <!-- Speaker in base -->
    <ellipse cx="0" cy="65" rx="22" ry="5" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
    <text x="0" y="72" text-anchor="middle" font-size="7" fill="white">Speaker 28mm</text>

    <!-- PCB in base -->
    <rect x="-60" y="57" width="120" height="4" fill="#90C695" stroke="black" stroke-width="0.5"/>
    <text x="-60" y="54" font-size="8">PCB</text>

    <!-- Cube walls -->
    <rect x="-75" y="-120" width="4" height="175" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <rect x="71" y="-120" width="4" height="175" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Cube top -->
    <rect x="-75" y="-120" width="150" height="4" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>

    <!-- Screen on bracket -->
    <rect x="-48" y="-50" width="96" height="58" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-18" text-anchor="middle" font-size="8">Screen module</text>
    <!-- L-bracket -->
    <path d="M-48,8 L-48,55 M48,8 L48,55" stroke="#666" stroke-width="1.5" fill="none"/>
    <rect x="-50" y="8" width="4" height="47" fill="#999" stroke="black" stroke-width="0.3"/>
    <rect x="46" y="8" width="4" height="47" fill="#999" stroke="black" stroke-width="0.3"/>
    <text x="-65" y="30" font-size="8">Bracket</text>

    <!-- Section markers -->
    <text x="-82" y="-125" font-size="9" font-weight="bold">A</text>
    <text x="75" y="-125" font-size="9" font-weight="bold">A</text>

    <!-- Wall callout -->
    <line x1="-75" y1="-130" x2="-71" y2="-130" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-73" y="-135" text-anchor="middle" font-size="7" fill="#CC0000">2mm</text>
  </g>

  <!-- ==================== DETAIL: Base Joint &amp; Buttons (bottom-right) ==================== -->
  <g transform="translate(1000,680)">
    <rect x="-130" y="-150" width="260" height="300" rx="4" fill="#F8F8F8" stroke="black" stroke-width="0.3"/>
    <text x="0" y="-130" text-anchor="middle" font-size="10" font-weight="bold">Base-to-Cube Joint Detail</text>

    <!-- Base top surface -->
    <rect x="-100" y="20" width="200" height="18" fill="#B8834E" stroke="black" stroke-width="0.5"/>
    <text x="0" y="33" text-anchor="middle" font-size="8" fill="white">Wooden base top</text>

    <!-- Lip/channel for cube -->
    <rect x="-70" y="10" width="140" height="12" fill="#B8834E" stroke="black" stroke-width="0.5"/>
    <!-- Cube wall sitting in channel -->
    <rect x="-68" y="-60" width="4" height="72" fill="#D6EAF8" fill-opacity="0.4" stroke="black" stroke-width="0.5"/>
    <rect x="64" y="-60" width="4" height="72" fill="#D6EAF8" fill-opacity="0.4" stroke="black" stroke-width="0.5"/>

    <!-- Lift-off arrows -->
    <line x1="-30" y1="-40" x2="-30" y2="-70" stroke="#CC0000" stroke-width="0.8" marker-end="url(#arrow-end)"/>
    <line x1="30" y1="-40" x2="30" y2="-70" stroke="#CC0000" stroke-width="0.8" marker-end="url(#arrow-end)"/>
    <text x="0" y="-75" text-anchor="middle" font-size="9" fill="#CC0000">Lift off</text>

    <!-- Channel dimension -->
    <line x1="-70" y1="48" x2="70" y2="48" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="60" text-anchor="middle" font-size="8" fill="#CC0000">Registration channel</text>

    <!-- Button detail below -->
    <text x="0" y="80" text-anchor="middle" font-size="9" font-weight="bold">Button Cap Detail</text>
    <!-- Base front edge -->
    <rect x="-50" y="90" width="100" height="12" fill="#B8834E" stroke="black" stroke-width="0.5"/>
    <!-- Button hole -->
    <circle cx="0" cy="96" r="5" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Button cap -->
    <circle cx="0" cy="96" r="4" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <!-- Tactile switch -->
    <rect x="-3" y="102" width="6" height="6" fill="#666" stroke="black" stroke-width="0.3"/>
    <text x="20" y="108" font-size="8">6mm tactile</text>
    <text x="20" y="117" font-size="8">switch</text>

    <!-- Cap proud dimension -->
    <line x1="-15" y1="90" x2="-15" y2="96" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-28" y="95" font-size="7" fill="#CC0000">Cap</text>
  </g>
</svg>