<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="sans-serif" font-size="10">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#CC0000" stroke="none"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#CC0000" stroke="none"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="white"/>

  <!-- Title -->
  <text x="600" y="28" text-anchor="middle" font-size="14" font-weight="bold">Design 14: Rotary Phone — 140×110×50mm Desktop Devotchi Case</text>

  <!-- Grid labels -->
  <text x="200" y="55" text-anchor="middle" font-size="11" font-weight="bold">Front View</text>
  <text x="600" y="55" text-anchor="middle" font-size="11" font-weight="bold">Side Profile</text>
  <text x="1000" y="55" text-anchor="middle" font-size="11" font-weight="bold">Back View</text>
  <text x="200" y="475" text-anchor="middle" font-size="11" font-weight="bold">Top-Down View</text>
  <text x="600" y="475" text-anchor="middle" font-size="11" font-weight="bold">Cross-Section</text>
  <text x="1000" y="475" text-anchor="middle" font-size="11" font-weight="bold">Detail: Rotary Dial Ring</text>

  <!-- ==================== FRONT VIEW (top-left) ==================== -->
  <g transform="translate(200,260)">
    <!-- Phone body -->
    <rect x="-105" y="-50" width="210" height="80" rx="20" ry="15" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Handset cradle on top -->
    <rect x="-70" y="-75" width="140" height="25" rx="8" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
    <!-- Handset in cradle -->
    <rect x="-55" y="-82" width="110" height="12" rx="6" fill="#999" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-85" text-anchor="middle" font-size="8">Handset (decorative)</text>

    <!-- Dial area with screen -->
    <circle cx="0" cy="-5" r="42" fill="#DDD" stroke="black" stroke-width="0.5"/>
    <!-- Dial ring -->
    <circle cx="0" cy="-5" r="42" fill="none" stroke="black" stroke-width="1"/>
    <circle cx="0" cy="-5" r="32" fill="none" stroke="black" stroke-width="0.5"/>
    <!-- Screen in center -->
    <rect x="-28" y="-25" width="56" height="38" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-3" text-anchor="middle" font-size="8" fill="#336">5.0" Screen</text>

    <!-- Finger holes on dial ring (visible ones) -->
    <circle cx="30" cy="-30" r="5" fill="#AAA" stroke="black" stroke-width="0.3"/>
    <circle cx="38" cy="-10" r="5" fill="#AAA" stroke="black" stroke-width="0.3"/>
    <circle cx="35" cy="12" r="5" fill="#AAA" stroke="black" stroke-width="0.3"/>
    <circle cx="-30" cy="-30" r="5" fill="#AAA" stroke="black" stroke-width="0.3"/>
    <circle cx="-38" cy="-10" r="5" fill="#AAA" stroke="black" stroke-width="0.3"/>
    <circle cx="-35" cy="12" r="5" fill="#AAA" stroke="black" stroke-width="0.3"/>
    <circle cx="20" cy="28" r="5" fill="#AAA" stroke="black" stroke-width="0.3"/>
    <circle cx="-20" cy="28" r="5" fill="#AAA" stroke="black" stroke-width="0.3"/>
    <circle cx="0" cy="33" r="5" fill="#AAA" stroke="black" stroke-width="0.3"/>

    <!-- Feet -->
    <rect x="-90" y="30" width="20" height="5" rx="2" fill="#999" stroke="black" stroke-width="0.3"/>
    <rect x="70" y="30" width="20" height="5" rx="2" fill="#999" stroke="black" stroke-width="0.3"/>

    <!-- Dimensions -->
    <line x1="-105" y1="50" x2="105" y2="50" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="62" text-anchor="middle" font-size="9" fill="#CC0000">140mm</text>
  </g>

  <!-- ==================== SIDE PROFILE (top-center) ==================== -->
  <g transform="translate(600,260)">
    <!-- Phone body side -->
    <rect x="-82" y="-50" width="164" height="80" rx="12" ry="10" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Handset cradle -->
    <path d="M-60,-50 Q-60,-70 -40,-72 L40,-72 Q60,-70 60,-50" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
    <!-- Handset profile -->
    <path d="M-50,-72 Q-50,-82 -35,-82 L35,-82 Q50,-82 50,-72" fill="#999" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-86" text-anchor="middle" font-size="8">Handset</text>

    <!-- Body height -->
    <line x1="95" y1="-82" x2="95" y2="30" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="108" y="-22" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(90,108,-22)">~65mm w/ handset</text>

    <!-- Body only height -->
    <line x1="-100" y1="-50" x2="-100" y2="30" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-113" y="-8" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(-90,-113,-8)">50mm body</text>

    <!-- Width -->
    <line x1="-82" y1="45" x2="82" y2="45" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="57" text-anchor="middle" font-size="9" fill="#CC0000">110mm</text>
  </g>

  <!-- ==================== BACK VIEW (top-right) ==================== -->
  <g transform="translate(1000,260)">
    <!-- Phone body back -->
    <rect x="-105" y="-50" width="210" height="80" rx="20" ry="15" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Cradle back -->
    <rect x="-70" y="-75" width="140" height="25" rx="8" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
    <!-- Handset back -->
    <rect x="-55" y="-82" width="110" height="12" rx="6" fill="#999" stroke="black" stroke-width="0.5"/>

    <!-- USB-C port -->
    <rect x="-7" y="18" width="14" height="5" rx="2" fill="#333" stroke="black" stroke-width="0.5"/>
    <text x="0" y="35" text-anchor="middle" font-size="9">USB-C</text>

    <!-- Cord decoration -->
    <path d="M0,23 C5,35 -5,42 0,52 C5,62 -5,70 0,80" fill="none" stroke="#666" stroke-width="1.5"/>
    <text x="15" y="60" font-size="8" fill="#888">Cord decor</text>

    <!-- Vent slots -->
    <rect x="-35" y="-20" width="70" height="2" rx="1" fill="#CCC" stroke="black" stroke-width="0.3"/>
    <rect x="-35" y="-12" width="70" height="2" rx="1" fill="#CCC" stroke="black" stroke-width="0.3"/>
    <rect x="-35" y="-4" width="70" height="2" rx="1" fill="#CCC" stroke="black" stroke-width="0.3"/>
  </g>

  <!-- ==================== TOP-DOWN VIEW (bottom-left) ==================== -->
  <g transform="translate(200,680)">
    <!-- Phone body top -->
    <rect x="-105" y="-82" width="210" height="164" rx="20" ry="20" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Handset on cradle -->
    <rect x="-55" y="-75" width="110" height="18" rx="9" fill="#999" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-63" text-anchor="middle" font-size="8">Handset</text>
    <!-- Cradle posts -->
    <rect x="-60" y="-62" width="8" height="6" rx="2" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <rect x="52" y="-62" width="8" height="6" rx="2" fill="#BBB" stroke="black" stroke-width="0.3"/>

    <!-- Rotary dial -->
    <circle cx="0" cy="15" r="50" fill="#DDD" stroke="black" stroke-width="0.8"/>
    <circle cx="0" cy="15" r="38" fill="none" stroke="black" stroke-width="0.5"/>
    <!-- Screen in center -->
    <rect x="-28" y="-5" width="56" height="38" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="18" text-anchor="middle" font-size="8" fill="#336">Screen</text>
    <!-- Finger holes -->
    <circle cx="35" cy="-10" r="6" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <circle cx="42" cy="10" r="6" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <circle cx="38" cy="32" r="6" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <circle cx="22" cy="48" r="6" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <circle cx="0" cy="53" r="6" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <circle cx="-22" cy="48" r="6" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <circle cx="-38" cy="32" r="6" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <circle cx="-42" cy="10" r="6" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <circle cx="-35" cy="-10" r="6" fill="#BBB" stroke="black" stroke-width="0.3"/>

    <!-- Dimensions -->
    <line x1="-105" y1="95" x2="105" y2="95" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="107" text-anchor="middle" font-size="9" fill="#CC0000">140mm</text>
  </g>

  <!-- ==================== CROSS-SECTION (bottom-center) ==================== -->
  <g transform="translate(600,680)">
    <!-- Shell outline -->
    <rect x="-105" y="-50" width="210" height="80" rx="15" ry="10" fill="none" stroke="black" stroke-width="0.5"/>
    <!-- Walls hatched -->
    <rect x="-105" y="-50" width="8" height="80" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <rect x="97" y="-50" width="8" height="80" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <rect x="-105" y="22" width="210" height="8" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <rect x="-105" y="-50" width="210" height="6" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>

    <!-- PCB -->
    <rect x="-80" y="10" width="160" height="4" fill="#90C695" stroke="black" stroke-width="0.5"/>
    <text x="0" y="8" text-anchor="middle" font-size="8">PCB 110×65mm</text>

    <!-- Screen pocket -->
    <rect x="-40" y="-40" width="80" height="48" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-12" text-anchor="middle" font-size="8">Screen module</text>

    <!-- Dial bearing -->
    <circle cx="-60" cy="-15" r="8" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="-60" cy="-15" r="3" fill="#666" stroke="black" stroke-width="0.3"/>
    <text x="-60" y="-28" text-anchor="middle" font-size="7">Dial bearing</text>

    <circle cx="60" cy="-15" r="8" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="60" cy="-15" r="3" fill="#666" stroke="black" stroke-width="0.3"/>

    <!-- Speaker -->
    <ellipse cx="0" cy="18" rx="18" ry="3" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
    <text x="30" y="20" font-size="7">Speaker</text>

    <!-- Section markers -->
    <text x="-110" y="-50" font-size="9" font-weight="bold">A</text>
    <text x="103" y="-50" font-size="9" font-weight="bold">A</text>

    <!-- Height dimension -->
    <line x1="120" y1="-50" x2="120" y2="30" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="133" y="-5" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(90,133,-5)">50mm</text>

    <!-- Wall thickness -->
    <line x1="-105" y1="-60" x2="-97" y2="-60" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-101" y="-65" text-anchor="middle" font-size="7" fill="#CC0000">2mm</text>
  </g>

  <!-- ==================== DETAIL: Rotary Dial Ring (bottom-right) ==================== -->
  <g transform="translate(1000,680)">
    <rect x="-130" y="-150" width="260" height="300" rx="4" fill="#F8F8F8" stroke="black" stroke-width="0.3"/>
    <text x="0" y="-130" text-anchor="middle" font-size="10" font-weight="bold">Rotary Dial Ring Detail</text>

    <!-- Dial ring zoomed -->
    <circle cx="0" cy="0" r="100" fill="#DDD" stroke="black" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="75" fill="#E8E8E8" stroke="black" stroke-width="0.5"/>
    <!-- Inner screen area -->
    <rect x="-45" y="-30" width="90" height="58" rx="3" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="3" text-anchor="middle" font-size="9" fill="#336">Screen</text>

    <!-- Finger holes on ring -->
    <circle cx="70" cy="-55" r="10" fill="#BBB" stroke="black" stroke-width="0.5"/>
    <circle cx="88" cy="-5" r="10" fill="#BBB" stroke="black" stroke-width="0.5"/>
    <circle cx="78" cy="45" r="10" fill="#BBB" stroke="black" stroke-width="0.5"/>
    <circle cx="45" cy="78" r="10" fill="#BBB" stroke="black" stroke-width="0.5"/>
    <circle cx="0" cy="88" r="10" fill="#BBB" stroke="black" stroke-width="0.5"/>
    <circle cx="-45" cy="78" r="10" fill="#BBB" stroke="black" stroke-width="0.5"/>
    <circle cx="-78" cy="45" r="10" fill="#BBB" stroke="black" stroke-width="0.5"/>
    <circle cx="-88" cy="-5" r="10" fill="#BBB" stroke="black" stroke-width="0.5"/>
    <circle cx="-70" cy="-55" r="10" fill="#BBB" stroke="black" stroke-width="0.5"/>

    <!-- Spring return mechanism -->
    <path d="M90,-25 Q105,-25 105,-5 Q105,15 90,15" fill="none" stroke="#666" stroke-width="0.8"/>
    <text x="115" y="-5" font-size="8">Return spring</text>

    <!-- Finger stop -->
    <rect x="55" y="-80" width="4" height="15" rx="1" fill="#888" stroke="black" stroke-width="0.5"/>
    <text x="72" y="-72" font-size="8">Finger stop</text>

    <!-- Rotation arrow -->
    <path d="M-50,-95 A100,100 0 0,1 50,-95" fill="none" stroke="#CC0000" stroke-width="0.8" marker-end="url(#arrow-end)"/>
    <text x="0" y="-105" text-anchor="middle" font-size="9" fill="#CC0000">Dial rotation</text>

    <!-- Hole size callout -->
    <line x1="-55" y1="78" x2="-35" y2="78" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-45" y="95" text-anchor="middle" font-size="8" fill="#CC0000">~12mm holes</text>
  </g>
</svg>