<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#CC0000"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#CC0000"/>
    </marker>
    <pattern id="hatch1" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="white"/>

  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Design 1: Classic Egg — Tamagotchi-Inspired Oval Enclosure (70mm x 55mm x 15.1mm)</text>

  <!-- ============ VIEW 1: FRONT VIEW (top-left) ============ -->
  <text x="300" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Front View</text>

  <!-- Egg outline -->
  <ellipse cx="300" cy="290" rx="132" ry="168" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Lanyard hole at top -->
  <circle cx="300" cy="130" r="8" fill="white" stroke="black" stroke-width="0.5"/>
  <text x="320" y="128" font-family="sans-serif" font-size="9" fill="#333">Lanyard hole</text>

  <!-- Screen window bezel -->
  <rect x="237" y="190" width="126" height="94" rx="4" ry="4" fill="none" stroke="black" stroke-width="0.5"/>
  <!-- Active display area -->
  <rect x="244" y="197" width="112" height="80" rx="2" ry="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="300" y="242" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Active Area</text>
  <text x="300" y="254" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">40.80 x 30.60mm</text>

  <!-- 3 buttons below screen -->
  <rect x="250" y="330" width="30" height="15" rx="2" ry="2" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <rect x="285" y="330" width="30" height="15" rx="2" ry="2" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <rect x="320" y="330" width="30" height="15" rx="2" ry="2" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <text x="265" y="360" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">BTN1</text>
  <text x="300" y="360" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">BTN2</text>
  <text x="335" y="360" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">BTN3</text>

  <!-- Wake button (smaller, side of front) -->
  <rect x="160" y="265" width="11" height="22" rx="2" ry="2" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <text x="148" y="280" text-anchor="end" font-family="sans-serif" font-size="8" fill="#333">Wake</text>

  <!-- Dimension: overall width 55mm -->
  <line x1="168" y1="475" x2="432" y2="475" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="168" y1="460" x2="168" y2="480" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="432" y1="460" x2="432" y2="480" stroke="#CC0000" stroke-width="0.5"/>
  <text x="300" y="490" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CC0000">55.0mm</text>

  <!-- Dimension: overall height 70mm -->
  <line x1="470" y1="122" x2="470" y2="458" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="460" y1="122" x2="480" y2="122" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="460" y1="458" x2="480" y2="458" stroke="#CC0000" stroke-width="0.5"/>
  <text x="495" y="295" text-anchor="start" font-family="sans-serif" font-size="10" fill="#CC0000">70.0mm</text>

  <!-- Dimension: button spacing 14mm -->
  <line x1="265" y1="378" x2="300" y2="378" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="282" y="390" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#CC0000">14mm</text>

  <!-- ============ VIEW 2: SIDE PROFILE (top-right) ============ -->
  <text x="900" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Side View (Profile)</text>

  <!-- Egg side profile - teardrop/oval from side, 15.1mm deep -->
  <path d="M880,130 C880,130 920,125 920,130 Q940,200 940,290 Q940,430 910,458 Q900,465 890,458 Q860,430 860,290 Q860,200 880,130 Z" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Screen visible from side (edge) -->
  <line x1="860" y1="190" x2="860" y2="284" stroke="#4488CC" stroke-width="1.5"/>
  <text x="848" y="240" text-anchor="end" font-family="sans-serif" font-size="8" fill="#4488CC">Screen</text>

  <!-- Button bumps on front face -->
  <rect x="856" y="330" width="4" height="10" rx="1" fill="#C8C8C8" stroke="black" stroke-width="0.3"/>
  <text x="848" y="338" text-anchor="end" font-family="sans-serif" font-size="8" fill="#333">Buttons</text>

  <!-- USB-C at bottom -->
  <rect x="888" y="456" width="9" height="4" rx="1" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="910" y="470" font-family="sans-serif" font-size="8" fill="#333">USB-C</text>

  <!-- Dimension: depth 15.1mm -->
  <line x1="858" y1="500" x2="942" y2="500" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="858" y1="490" x2="858" y2="510" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="942" y1="490" x2="942" y2="510" stroke="#CC0000" stroke-width="0.5"/>
  <text x="900" y="518" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CC0000">15.1mm</text>

  <!-- Dimension: height 70mm -->
  <line x1="970" y1="122" x2="970" y2="458" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="960" y1="122" x2="980" y2="122" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="960" y1="458" x2="980" y2="458" stroke="#CC0000" stroke-width="0.5"/>
  <text x="990" y="295" text-anchor="start" font-family="sans-serif" font-size="10" fill="#CC0000">70.0mm</text>

  <!-- Lanyard hole from side -->
  <ellipse cx="900" cy="130" rx="2" ry="6" fill="white" stroke="black" stroke-width="0.5"/>

  <!-- Curved profile callout -->
  <text x="810" y="390" font-family="sans-serif" font-size="9" fill="#555">Curved egg</text>
  <text x="810" y="402" font-family="sans-serif" font-size="9" fill="#555">silhouette</text>

  <!-- ============ VIEW 3: CROSS-SECTION (bottom-left) ============ -->
  <text x="300" y="540" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Cross-Section (Vertical Cut A-A)</text>

  <!-- Outer shell outline with hatching -->
  <!-- Left wall -->
  <rect x="180" y="570" width="7" height="320" rx="3" fill="url(#hatch1)" stroke="black" stroke-width="0.5"/>
  <!-- Right wall -->
  <rect x="413" y="570" width="7" height="320" rx="3" fill="url(#hatch1)" stroke="black" stroke-width="0.5"/>
  <!-- Top wall (curved) -->
  <path d="M180,590 Q180,565 300,560 Q420,565 420,590 L413,590 Q413,575 300,570 Q187,575 187,590 Z" fill="url(#hatch1)" stroke="black" stroke-width="0.5"/>
  <!-- Bottom wall -->
  <path d="M180,870 Q180,895 300,900 Q420,895 420,870 L413,870 Q413,885 300,890 Q187,885 187,870 Z" fill="url(#hatch1)" stroke="black" stroke-width="0.5"/>

  <!-- Z-stack layers from front to back (top to bottom in cross section view) -->
  <!-- This is a vertical cross-section showing depth layers -->

  <!-- Front wall 1.5mm -->
  <rect x="195" y="580" width="210" height="18" fill="url(#hatch1)" stroke="black" stroke-width="0.5"/>
  <text x="425" y="592" font-family="sans-serif" font-size="9" fill="#606060">Front wall 1.5mm</text>

  <!-- Gap 0.3mm -->
  <rect x="195" y="598" width="210" height="4" fill="white" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>

  <!-- Display module 2.0mm -->
  <rect x="195" y="602" width="210" height="26" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="300" y="619" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Display Module (2.0mm)</text>
  <text x="425" y="618" font-family="sans-serif" font-size="9" fill="#4488CC">51.80 x 36.20mm</text>

  <!-- Gap/foam 1.0mm -->
  <rect x="195" y="628" width="210" height="12" fill="#F5F5F5" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>
  <text x="300" y="637" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">Gap 1.0mm</text>

  <!-- PCB 1.6mm -->
  <rect x="195" y="640" width="210" height="20" fill="#90C695" stroke="black" stroke-width="0.5"/>
  <text x="300" y="654" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">PCB (1.6mm)</text>
  <text x="425" y="653" font-family="sans-serif" font-size="9" fill="#5A8C5E">45.0 x 40.0mm</text>

  <!-- ESP32 on PCB (component bump) -->
  <rect x="210" y="660" width="48" height="12" fill="#7AB37E" stroke="black" stroke-width="0.3"/>
  <text x="234" y="669" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#333">ESP32</text>

  <!-- Gap 1.5mm -->
  <rect x="195" y="672" width="210" height="18" fill="#F5F5F5" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>
  <text x="300" y="684" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">Gap 1.5mm</text>

  <!-- Battery 5.0mm -->
  <rect x="210" y="690" width="180" height="60" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
  <text x="300" y="724" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">LiPo Battery (5.0mm)</text>
  <text x="425" y="723" font-family="sans-serif" font-size="9" fill="#B8922F">30 x 35mm</text>

  <!-- Gap 0.5mm -->
  <rect x="195" y="750" width="210" height="6" fill="#F5F5F5" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>

  <!-- Back wall 1.5mm -->
  <rect x="195" y="756" width="210" height="18" fill="url(#hatch1)" stroke="black" stroke-width="0.5"/>
  <text x="425" y="768" font-family="sans-serif" font-size="9" fill="#606060">Back wall 1.5mm</text>

  <!-- Total Z-stack dimension -->
  <line x1="165" y1="580" x2="165" y2="774" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="155" y1="580" x2="175" y2="580" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="155" y1="774" x2="175" y2="774" stroke="#CC0000" stroke-width="0.5"/>
  <text x="140" y="680" text-anchor="end" font-family="sans-serif" font-size="10" fill="#CC0000">15.1mm</text>
  <text x="140" y="695" text-anchor="end" font-family="sans-serif" font-size="9" fill="#CC0000">total</text>

  <!-- ============ VIEW 4: BACK VIEW (bottom-right) ============ -->
  <text x="900" y="540" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Back View</text>

  <!-- Egg outline -->
  <ellipse cx="900" cy="730" rx="132" ry="168" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Battery door outline -->
  <rect x="845" y="650" width="110" height="90" rx="8" ry="8" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="900" y="700" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555">Battery Door</text>

  <!-- Snap-fit tab locations -->
  <rect x="843" y="675" width="4" height="12" fill="#999" stroke="black" stroke-width="0.3"/>
  <rect x="953" y="675" width="4" height="12" fill="#999" stroke="black" stroke-width="0.3"/>
  <rect x="843" y="715" width="4" height="12" fill="#999" stroke="black" stroke-width="0.3"/>
  <rect x="953" y="715" width="4" height="12" fill="#999" stroke="black" stroke-width="0.3"/>
  <text x="970" y="680" font-family="sans-serif" font-size="8" fill="#555">Snap-fit</text>
  <text x="970" y="691" font-family="sans-serif" font-size="8" fill="#555">tabs (x4)</text>

  <!-- USB-C cutout at bottom -->
  <rect x="882" y="890" width="36" height="10" rx="3" fill="white" stroke="black" stroke-width="0.5"/>
  <text x="900" y="886" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">USB-C cutout</text>
  <text x="900" y="875" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#CC0000">9.34 x 3.66mm</text>

  <!-- Lanyard hole at top -->
  <circle cx="900" cy="570" r="8" fill="white" stroke="black" stroke-width="0.5"/>

  <!-- Screw boss locations (hidden) -->
  <circle cx="870" cy="640" r="4" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>
  <circle cx="930" cy="640" r="4" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>
  <circle cx="870" cy="780" r="4" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>
  <circle cx="930" cy="780" r="4" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>
  <text x="948" y="638" font-family="sans-serif" font-size="7" fill="#888">Screw bosses</text>

  <!-- Vibration motor location (hidden) -->
  <circle cx="860" cy="810" r="14" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>
  <text x="860" y="813" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#888">Vibe</text>
  <text x="860" y="822" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#888">motor</text>
</svg>