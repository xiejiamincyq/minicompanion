<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#CC0000" stroke="none"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#CC0000" stroke="none"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="white"/>

  <!-- Title -->
  <text x="600" y="28" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Design 21: Trophy — 60×60mm Base, 130mm Tall Desktop Case</text>

  <!-- Grid labels -->
  <text x="200" y="58" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">FRONT VIEW</text>
  <text x="600" y="58" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">SIDE PROFILE</text>
  <text x="1000" y="58" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">BACK VIEW</text>
  <text x="200" y="478" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">TOP-DOWN VIEW</text>
  <text x="600" y="478" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">CROSS-SECTION</text>
  <text x="1000" y="478" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">DETAIL — Nameplate + Star Top</text>

  <!-- Grid dividers -->
  <line x1="400" y1="40" x2="400" y2="450" stroke="#CCC" stroke-width="0.5"/>
  <line x1="800" y1="40" x2="800" y2="450" stroke="#CCC" stroke-width="0.5"/>
  <line x1="400" y1="460" x2="400" y2="890" stroke="#CCC" stroke-width="0.5"/>
  <line x1="800" y1="460" x2="800" y2="890" stroke="#CCC" stroke-width="0.5"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#CCC" stroke-width="0.5"/>

  <!-- ============ FRONT VIEW (top-left) ============ -->
  <g transform="translate(200,270)">
    <!-- Base pedestal -->
    <rect x="-50" y="100" width="100" height="25" rx="3" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Base step -->
    <rect x="-40" y="85" width="80" height="18" rx="2" fill="#D8D8D8" stroke="black" stroke-width="0.5"/>

    <!-- Nameplate recess on base front -->
    <rect x="-30" y="105" width="60" height="14" rx="1" fill="#C8C0B0" stroke="black" stroke-width="0.5"/>
    <text x="0" y="115" font-family="sans-serif" font-size="7" text-anchor="middle" fill="#666">DEVOTCHI</text>

    <!-- Tapered column -->
    <polygon points="-18,85 -12,-55 12,-55 18,85" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

    <!-- Screen head at top (tilted forward) -->
    <g transform="rotate(-15, 0, -70)">
      <rect x="-55" y="-105" width="110" height="70" rx="3" fill="#D8D8D8" stroke="black" stroke-width="0.5"/>
      <rect x="-48" y="-98" width="96" height="56" rx="1" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
      <text x="0" y="-68" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#336">5.0" SSD1963</text>
    </g>

    <!-- Star decoration above -->
    <polygon points="0,-155 8,-135 28,-135 12,-122 18,-102 0,-113 -18,-102 -12,-122 -28,-135 -8,-135"
             fill="#D4A84B" stroke="black" stroke-width="0.5"/>

    <!-- Dimension: base 60mm -->
    <line x1="-50" y1="140" x2="50" y2="140" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="-50" y1="133" x2="-50" y2="147" stroke="#CC0000" stroke-width="0.5"/>
    <line x1="50" y1="133" x2="50" y2="147" stroke="#CC0000" stroke-width="0.5"/>
    <text x="0" y="155" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#CC0000">60mm base</text>

    <!-- Dimension: height 130mm -->
    <line x1="80" y1="-155" x2="80" y2="125" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="73" y1="-155" x2="87" y2="-155" stroke="#CC0000" stroke-width="0.5"/>
    <line x1="73" y1="125" x2="87" y2="125" stroke="#CC0000" stroke-width="0.5"/>
    <text x="95" y="-10" font-family="sans-serif" font-size="9" fill="#CC0000">130mm</text>
  </g>

  <!-- ============ SIDE PROFILE (top-center) ============ -->
  <g transform="translate(600,270)">
    <!-- Base pedestal side -->
    <rect x="-40" y="100" width="80" height="25" rx="3" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <rect x="-32" y="85" width="64" height="18" rx="2" fill="#D8D8D8" stroke="black" stroke-width="0.5"/>

    <!-- Column side -->
    <polygon points="-14,85 -10,-55 10,-55 14,85" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

    <!-- Screen head side (showing tilt) -->
    <g transform="rotate(-15, 0, -70)">
      <rect x="-25" y="-105" width="50" height="70" rx="3" fill="#D8D8D8" stroke="black" stroke-width="0.5"/>
      <!-- Screen edge -->
      <line x1="-23" y1="-100" x2="-23" y2="-52" stroke="#4488CC" stroke-width="1.5"/>
    </g>

    <!-- Tilt angle annotation -->
    <line x1="0" y1="-55" x2="0" y2="-110" stroke="#CCC" stroke-width="0.5" stroke-dasharray="3,3"/>
    <path d="M0,-90 Q5,-95 8,-102" fill="none" stroke="#CC0000" stroke-width="0.5"/>
    <text x="15" y="-95" font-family="sans-serif" font-size="9" fill="#CC0000">15° tilt</text>

    <!-- Star side -->
    <polygon points="0,-155 6,-140 0,-130 -6,-140" fill="#D4A84B" stroke="black" stroke-width="0.5"/>

    <!-- Depth dimension -->
    <line x1="-40" y1="140" x2="40" y2="140" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="-40" y1="133" x2="-40" y2="147" stroke="#CC0000" stroke-width="0.5"/>
    <line x1="40" y1="133" x2="40" y2="147" stroke="#CC0000" stroke-width="0.5"/>
    <text x="0" y="155" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#CC0000">60mm depth</text>

    <text x="-35" y="-70" font-family="sans-serif" font-size="8" fill="#888">Screen</text>
    <text x="30" y="0" font-family="sans-serif" font-size="8" fill="#888">Column</text>
  </g>

  <!-- ============ BACK VIEW (top-right) ============ -->
  <g transform="translate(1000,270)">
    <!-- Base back -->
    <rect x="-50" y="100" width="100" height="25" rx="3" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <rect x="-40" y="85" width="80" height="18" rx="2" fill="#D8D8D8" stroke="black" stroke-width="0.5"/>

    <!-- USB-C on base back -->
    <rect x="-8" y="108" width="16" height="5" rx="2" fill="#555" stroke="black" stroke-width="0.5"/>
    <text x="0" y="132" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#555">USB-C 8.94×3.26mm</text>

    <!-- Column back -->
    <polygon points="-18,85 -12,-55 12,-55 18,85" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

    <!-- Screen head back (tilted away) -->
    <g transform="rotate(-15, 0, -70)">
      <rect x="-55" y="-105" width="110" height="70" rx="3" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
      <text x="0" y="-68" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#888">Screen back</text>
      <!-- Screen hidden dashed -->
      <rect x="-48" y="-98" width="96" height="56" rx="1" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="4,3"/>
    </g>

    <!-- Star from behind -->
    <polygon points="0,-155 8,-135 28,-135 12,-122 18,-102 0,-113 -18,-102 -12,-122 -28,-135 -8,-135"
             fill="#D4A84B" stroke="black" stroke-width="0.5" opacity="0.7"/>

    <!-- Wire routing hole in base -->
    <circle cx="0" cy="95" r="4" fill="#888" stroke="black" stroke-width="0.5"/>
    <text x="15" y="95" font-family="sans-serif" font-size="8" fill="#555">Wire hole</text>
  </g>

  <!-- ============ TOP-DOWN VIEW (bottom-left) ============ -->
  <g transform="translate(200,680)">
    <!-- Looking down on star/cup decoration -->
    <!-- Star from above -->
    <polygon points="0,-60 12,-30 45,-30 18,-10 28,20 0,5 -28,20 -18,-10 -45,-30 -12,-30"
             fill="#D4A84B" stroke="black" stroke-width="0.5"/>

    <!-- Screen head outline (dashed, below star) -->
    <rect x="-45" y="-40" width="90" height="55" rx="3" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="4,3"/>
    <text x="0" y="-15" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#888">Screen head</text>

    <!-- Column (dashed, below) -->
    <circle cx="0" cy="25" r="12" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>
    <text x="0" y="28" font-family="sans-serif" font-size="7" text-anchor="middle" fill="#888">Col</text>

    <!-- Base outline (dashed, far below) -->
    <rect x="-38" y="30" width="76" height="50" rx="3" fill="none" stroke="#BBB" stroke-width="0.5" stroke-dasharray="4,3"/>
    <text x="0" y="60" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#BBB">Base (below)</text>

    <!-- Star dimension -->
    <line x1="-50" y1="95" x2="50" y2="95" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="108" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#CC0000">~50mm star span</text>
  </g>

  <!-- ============ CROSS-SECTION (bottom-center) ============ -->
  <g transform="translate(600,680)">
    <!-- Vertical cut through center -->
    <!-- Base outer -->
    <rect x="-50" y="75" width="100" height="25" rx="3" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Base inner cavity -->
    <rect x="-44" y="79" width="88" height="17" fill="white" stroke="black" stroke-width="0.5"/>

    <!-- Speaker in base -->
    <ellipse cx="0" cy="87" rx="18" ry="4" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
    <text x="30" y="90" font-family="sans-serif" font-size="8" fill="#8B7030">Speaker 28mm</text>

    <!-- Base step -->
    <rect x="-40" y="60" width="80" height="18" rx="2" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <rect x="-34" y="64" width="68" height="10" fill="white" stroke="black" stroke-width="0.5"/>

    <!-- Column outer -->
    <polygon points="-18,60 -12,-50 12,-50 18,60" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Column inner (hollow for wires) -->
    <polygon points="-10,58 -6,-48 6,-48 10,58" fill="white" stroke="black" stroke-width="0.5"/>

    <!-- Wire routing indication -->
    <line x1="0" y1="64" x2="0" y2="-45" stroke="#CC4444" stroke-width="0.5" stroke-dasharray="4,2"/>
    <text x="-25" y="10" font-family="sans-serif" font-size="8" fill="#CC4444">Wires</text>

    <!-- Screen head -->
    <g transform="rotate(-15, 0, -65)">
      <!-- Head shell -->
      <rect x="-50" y="-100" width="100" height="65" rx="3" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
      <!-- Head cavity -->
      <rect x="-44" y="-94" width="88" height="53" fill="white" stroke="black" stroke-width="0.5"/>
      <!-- Screen -->
      <rect x="-42" y="-90" width="84" height="5" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
      <text x="0" y="-82" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#336">Screen</text>
      <!-- PCB in head -->
      <rect x="-40" y="-75" width="80" height="3" fill="#90C695" stroke="black" stroke-width="0.5"/>
      <text x="0" y="-62" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#4A7A4E">PCB</text>
    </g>

    <!-- Star on top -->
    <polygon points="0,-140 5,-128 15,-128 7,-120 10,-110 0,-116 -10,-110 -7,-120 -15,-128 -5,-128"
             fill="#D4A84B" stroke="black" stroke-width="0.5"/>

    <!-- Wall dimension -->
    <line x1="-50" y1="105" x2="-44" y2="105" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-60" y="115" font-family="sans-serif" font-size="8" fill="#CC0000">2mm</text>

    <text x="0" y="120" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#555">Vertical cut through center</text>
  </g>

  <!-- ============ DETAIL — Nameplate + Star Top (bottom-right) ============ -->
  <g transform="translate(1000,680)">
    <!-- Nameplate recess detail (enlarged) -->
    <text x="-60" y="-130" font-family="sans-serif" font-size="10" font-weight="bold" fill="#555">Nameplate Recess:</text>

    <!-- Base front face section -->
    <rect x="-100" y="-115" width="130" height="60" rx="3" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

    <!-- Nameplate recess -->
    <rect x="-80" y="-100" width="90" height="30" rx="2" fill="#C8C0B0" stroke="black" stroke-width="0.5"/>
    <!-- Engraved text -->
    <text x="-35" y="-82" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#8B7860">DEVOTCHI</text>
    <text x="-35" y="-72" font-family="sans-serif" font-size="7" text-anchor="middle" fill="#A09080">Your AI Companion</text>

    <!-- Recess depth -->
    <line x1="-100" y1="-100" x2="-100" y2="-92" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-118" y="-94" font-family="sans-serif" font-size="8" fill="#CC0000">1mm</text>
    <text x="-118" y="-84" font-family="sans-serif" font-size="8" fill="#CC0000">recess</text>

    <!-- Nameplate size -->
    <line x1="-80" y1="-62" x2="10" y2="-62" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-35" y="-52" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#CC0000">40×15mm plate</text>

    <!-- Star/cup decoration detail -->
    <text x="70" y="-130" font-family="sans-serif" font-size="10" font-weight="bold" fill="#555">Star Top:</text>

    <!-- Enlarged star -->
    <polygon points="70,-90 82,-60 110,-60 88,-40 96,-12 70,-28 44,-12 52,-40 30,-60 58,-60"
             fill="#D4A84B" stroke="black" stroke-width="0.5"/>

    <!-- Mounting post -->
    <rect x="66" y="-12" width="8" height="20" rx="1" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <text x="82" y="2" font-family="sans-serif" font-size="8" fill="#555">Press-fit post</text>

    <!-- Star dimension -->
    <line x1="30" y1="-95" x2="110" y2="-95" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="70" y="-100" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#CC0000">~35mm span</text>

    <!-- Material note -->
    <text x="70" y="25" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#8B7030">Gold-finish plastic or metal</text>
  </g>
</svg>