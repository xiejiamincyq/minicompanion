<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#CC0000" stroke="none"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#CC0000" stroke="none"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.8"/>
    </pattern>
    <pattern id="grooves" patternUnits="userSpaceOnUse" width="4" height="4">
      <circle cx="2" cy="2" r="1.8" fill="none" stroke="#555" stroke-width="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="white"/>

  <!-- Title -->
  <text x="600" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Design 08: Vinyl Record Player — 140×140×40mm Square</text>

  <!-- Grid lines -->
  <line x1="400" y1="0" x2="400" y2="900" stroke="#E8E8E8" stroke-width="0.3"/>
  <line x1="800" y1="0" x2="800" y2="900" stroke="#E8E8E8" stroke-width="0.3"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#E8E8E8" stroke-width="0.3"/>

  <!-- VIEW 1: Front view (top-left) -->
  <text x="200" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Front View</text>
  <!-- Main body -->
  <rect x="80" y="120" width="240" height="70" rx="4" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
  <!-- Platter ring visible from front -->
  <ellipse cx="180" cy="140" rx="90" ry="15" fill="#333" stroke="black" stroke-width="0.5"/>
  <!-- Screen visible through platter center -->
  <rect x="140" y="125" width="80" height="25" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="180" y="141" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#4477AA">screen</text>
  <!-- Tonearm on right side -->
  <line x1="280" y1="115" x2="260" y2="145" stroke="#888" stroke-width="2"/>
  <circle cx="280" cy="112" r="4" fill="#999" stroke="black" stroke-width="0.3"/>
  <text x="298" y="130" font-family="sans-serif" font-size="8">tonearm</text>
  <!-- 3 transport buttons on front edge -->
  <circle cx="150" cy="180" r="5" fill="#555" stroke="black" stroke-width="0.5"/>
  <circle cx="180" cy="180" r="5" fill="#555" stroke="black" stroke-width="0.5"/>
  <circle cx="210" cy="180" r="5" fill="#555" stroke="black" stroke-width="0.5"/>
  <text x="180" y="198" text-anchor="middle" font-family="sans-serif" font-size="8">3× tactile 6mm</text>
  <!-- Width dimension -->
  <line x1="80" y1="210" x2="320" y2="210" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="200" y="208" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">140mm</text>
  <!-- Height dimension -->
  <line x1="335" y1="120" x2="335" y2="190" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="355" y="158" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000" transform="rotate(-90,355,158)">40mm</text>

  <!-- VIEW 2: Side profile (top-center) -->
  <text x="600" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Side Profile</text>
  <!-- Low profile body -->
  <path d="M480,160 L720,160 L720,200 L480,200 Z" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
  <!-- Screen angled up 20° from rear -->
  <path d="M530,110 L650,130 L650,160 L510,160 Z" fill="#333" stroke="black" stroke-width="0.5"/>
  <line x1="535" y1="115" x2="645" y2="133" stroke="#B0D4F1" stroke-width="1"/>
  <text x="590" y="148" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#4477AA">screen 20° angle</text>
  <!-- 20° angle arc -->
  <path d="M650,160 Q645,148 650,130" fill="none" stroke="#CC0000" stroke-width="0.5"/>
  <text x="665" y="145" font-family="sans-serif" font-size="8" fill="#CC0000">20°</text>
  <!-- Platter edge from side -->
  <line x1="490" y1="155" x2="710" y2="155" stroke="#555" stroke-width="0.5" stroke-dasharray="3,2"/>
  <!-- Depth dimension -->
  <line x1="480" y1="218" x2="720" y2="218" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="600" y="216" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">140mm</text>
  <!-- Height dimension -->
  <line x1="735" y1="110" x2="735" y2="200" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="755" y="158" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000" transform="rotate(-90,755,158)">40mm</text>

  <!-- VIEW 3: Back view (top-right) -->
  <text x="1000" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Back View</text>
  <!-- Back panel -->
  <rect x="880" y="120" width="240" height="70" rx="4" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
  <!-- USB-C center -->
  <rect x="988" y="155" width="24" height="8" rx="3" fill="#666" stroke="black" stroke-width="0.5"/>
  <text x="1000" y="178" text-anchor="middle" font-family="sans-serif" font-size="8">USB-C 8.94×3.26mm</text>
  <!-- Vent holes -->
  <circle cx="920" cy="145" r="2" fill="#444" stroke="black" stroke-width="0.2"/>
  <circle cx="930" cy="145" r="2" fill="#444" stroke="black" stroke-width="0.2"/>
  <circle cx="940" cy="145" r="2" fill="#444" stroke="black" stroke-width="0.2"/>
  <circle cx="950" cy="145" r="2" fill="#444" stroke="black" stroke-width="0.2"/>
  <circle cx="1050" cy="145" r="2" fill="#444" stroke="black" stroke-width="0.2"/>
  <circle cx="1060" cy="145" r="2" fill="#444" stroke="black" stroke-width="0.2"/>
  <circle cx="1070" cy="145" r="2" fill="#444" stroke="black" stroke-width="0.2"/>
  <circle cx="1080" cy="145" r="2" fill="#444" stroke="black" stroke-width="0.2"/>
  <text x="935" y="160" text-anchor="middle" font-family="sans-serif" font-size="7">vents</text>
  <text x="1065" y="160" text-anchor="middle" font-family="sans-serif" font-size="7">vents</text>
  <!-- Hidden internal (PCB) -->
  <rect x="895" y="130" width="210" height="45" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="4,3"/>
  <text x="1000" y="155" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#888">PCB (hidden)</text>

  <!-- VIEW 4: Top-down view (bottom-left) -->
  <text x="200" y="478" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Top-Down View</text>
  <!-- Square base -->
  <rect x="80" y="510" width="240" height="240" rx="5" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
  <!-- Platter circle with grooves -->
  <circle cx="200" cy="630" r="105" fill="#222" stroke="black" stroke-width="0.5"/>
  <circle cx="200" cy="630" r="95" fill="none" stroke="#444" stroke-width="0.3"/>
  <circle cx="200" cy="630" r="85" fill="none" stroke="#444" stroke-width="0.3"/>
  <circle cx="200" cy="630" r="75" fill="none" stroke="#444" stroke-width="0.3"/>
  <circle cx="200" cy="630" r="65" fill="none" stroke="#444" stroke-width="0.3"/>
  <circle cx="200" cy="630" r="55" fill="none" stroke="#444" stroke-width="0.3"/>
  <!-- Screen centered in platter -->
  <rect x="146" y="595" width="108" height="70" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="200" y="634" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4477AA">5.0" screen</text>
  <text x="200" y="646" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#4477AA">108×64.8mm</text>
  <!-- Center spindle -->
  <circle cx="200" cy="630" r="5" fill="#888" stroke="black" stroke-width="0.3"/>
  <!-- Tonearm -->
  <circle cx="310" cy="530" r="6" fill="#999" stroke="black" stroke-width="0.5"/>
  <line x1="310" y1="530" x2="260" y2="610" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="260" cy="610" r="3" fill="#666" stroke="black" stroke-width="0.3"/>
  <text x="320" y="548" font-family="sans-serif" font-size="8">tonearm pivot</text>
  <!-- Front buttons -->
  <circle cx="160" cy="740" r="5" fill="#555" stroke="black" stroke-width="0.5"/>
  <circle cx="200" cy="740" r="5" fill="#555" stroke="black" stroke-width="0.5"/>
  <circle cx="240" cy="740" r="5" fill="#555" stroke="black" stroke-width="0.5"/>
  <!-- Dimension -->
  <line x1="80" y1="770" x2="320" y2="770" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="200" y="768" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">140mm</text>

  <!-- VIEW 5: Cross-section (bottom-center) -->
  <text x="600" y="478" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Cross-Section (Through Center)</text>
  <!-- Outer shell -->
  <rect x="460" y="530" width="280" height="80" rx="4" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  <!-- Interior cavity -->
  <rect x="464" y="534" width="272" height="72" fill="white" stroke="black" stroke-width="0.3"/>
  <!-- Screen angled in pocket -->
  <g transform="rotate(-20,580,555)">
    <rect x="530" y="540" width="100" height="8" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  </g>
  <text x="600" y="548" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#4477AA">screen 4.5mm thick</text>
  <!-- Screen module bracket -->
  <line x1="510" y1="558" x2="670" y2="558" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>
  <!-- PCB flat below -->
  <rect x="475" y="572" width="250" height="4" fill="#90C695" stroke="black" stroke-width="0.5"/>
  <text x="600" y="570" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#2E7D32">PCB 110×65×1.6mm</text>
  <!-- Speaker below PCB -->
  <ellipse cx="540" cy="596" rx="25" ry="6" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
  <text x="540" y="599" text-anchor="middle" font-family="sans-serif" font-size="7">speaker 28mm</text>
  <!-- Wall thickness -->
  <line x1="458" y1="560" x2="466" y2="560" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="448" y="558" text-anchor="end" font-family="sans-serif" font-size="8" fill="#CC0000">2mm</text>
  <!-- Platter rim -->
  <rect x="464" y="534" width="8" height="25" fill="#333" stroke="black" stroke-width="0.3"/>
  <rect x="728" y="534" width="8" height="25" fill="#333" stroke="black" stroke-width="0.3"/>
  <text x="474" y="530" font-family="sans-serif" font-size="7">platter rim</text>
  <!-- Height dimension -->
  <line x1="755" y1="530" x2="755" y2="610" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="775" y="575" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000" transform="rotate(-90,775,575)">40mm</text>
  <!-- Screen angle -->
  <text x="485" y="545" font-family="sans-serif" font-size="8" fill="#CC0000">20°</text>

  <!-- VIEW 6: Detail closeup (bottom-right) -->
  <text x="1000" y="478" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Detail — Tonearm + Grooves</text>
  <!-- Enlarged platter section with grooves -->
  <rect x="840" y="510" width="320" height="200" rx="3" fill="#222" stroke="black" stroke-width="0.5"/>
  <!-- Groove pattern -->
  <circle cx="950" cy="610" r="90" fill="none" stroke="#444" stroke-width="0.4"/>
  <circle cx="950" cy="610" r="82" fill="none" stroke="#444" stroke-width="0.4"/>
  <circle cx="950" cy="610" r="74" fill="none" stroke="#444" stroke-width="0.4"/>
  <circle cx="950" cy="610" r="66" fill="none" stroke="#444" stroke-width="0.4"/>
  <circle cx="950" cy="610" r="58" fill="none" stroke="#444" stroke-width="0.4"/>
  <circle cx="950" cy="610" r="50" fill="none" stroke="#444" stroke-width="0.4"/>
  <circle cx="950" cy="610" r="42" fill="none" stroke="#444" stroke-width="0.4"/>
  <circle cx="950" cy="610" r="34" fill="none" stroke="#444" stroke-width="0.4"/>
  <!-- Label area -->
  <circle cx="950" cy="610" r="25" fill="#CC6633" stroke="black" stroke-width="0.3"/>
  <text x="950" y="614" text-anchor="middle" font-family="sans-serif" font-size="8" fill="white">label area</text>
  <!-- Tonearm pivot detail -->
  <circle cx="1100" cy="530" r="10" fill="#999" stroke="black" stroke-width="0.5"/>
  <text x="1100" y="520" text-anchor="middle" font-family="sans-serif" font-size="8">pivot bearing</text>
  <!-- Tonearm body -->
  <line x1="1100" y1="530" x2="1000" y2="610" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <!-- Tonearm head/cartridge -->
  <rect x="990" y="605" width="15" height="8" rx="1" fill="#777" stroke="black" stroke-width="0.3" transform="rotate(-35,997,609)"/>
  <text x="985" y="628" font-family="sans-serif" font-size="7">cartridge</text>
  <!-- Groove spacing dimension -->
  <line x1="1040" y1="620" x2="1040" y2="640" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="1060" y="634" font-family="sans-serif" font-size="8" fill="#CC0000">~8mm groove pitch</text>
  <!-- Tonearm length callout -->
  <line x1="1000" y1="650" x2="1100" y2="650" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="1050" y="665" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#CC0000">~50mm arm</text>
  <!-- Decorative groove detail text -->
  <text x="1000" y="740" text-anchor="middle" font-family="sans-serif" font-size="9">Concentric grooves are decorative</text>
  <text x="1000" y="755" text-anchor="middle" font-family="sans-serif" font-size="9">— machined into platter surface</text>
</svg>