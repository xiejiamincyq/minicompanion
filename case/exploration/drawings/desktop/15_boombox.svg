<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="sans-serif" font-size="10">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#CC0000" stroke="none"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#CC0000" stroke="none"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="white"/>

  <!-- Title -->
  <text x="600" y="28" text-anchor="middle" font-size="14" font-weight="bold">Design 15: Boombox — 180×50×100mm Landscape Desktop Devotchi Case</text>

  <!-- Grid labels -->
  <text x="200" y="55" text-anchor="middle" font-size="11" font-weight="bold">Front View</text>
  <text x="600" y="55" text-anchor="middle" font-size="11" font-weight="bold">Side Profile</text>
  <text x="1000" y="55" text-anchor="middle" font-size="11" font-weight="bold">Back View</text>
  <text x="200" y="475" text-anchor="middle" font-size="11" font-weight="bold">Top-Down View</text>
  <text x="600" y="475" text-anchor="middle" font-size="11" font-weight="bold">Cross-Section (Horizontal)</text>
  <text x="1000" y="475" text-anchor="middle" font-size="11" font-weight="bold">Detail: Handle &amp; Slider</text>

  <!-- ==================== FRONT VIEW (top-left) ==================== -->
  <g transform="translate(200,255)">
    <!-- Boombox body -->
    <rect x="-135" y="-75" width="270" height="150" rx="8" ry="8" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

    <!-- Carry handle on top -->
    <path d="M-50,-75 Q-50,-100 0,-100 Q50,-100 50,-75" fill="none" stroke="#888" stroke-width="3"/>
    <path d="M-50,-75 Q-50,-100 0,-100 Q50,-100 50,-75" fill="none" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-105" text-anchor="middle" font-size="8">Carry handle</text>

    <!-- Left speaker grille -->
    <circle cx="-80" cy="5" r="38" fill="#CCC" stroke="black" stroke-width="0.5"/>
    <circle cx="-80" cy="5" r="32" fill="none" stroke="#AAA" stroke-width="0.3"/>
    <circle cx="-80" cy="5" r="25" fill="none" stroke="#AAA" stroke-width="0.3"/>
    <circle cx="-80" cy="5" r="18" fill="none" stroke="#AAA" stroke-width="0.3"/>
    <circle cx="-80" cy="5" r="10" fill="#D4A84B" stroke="black" stroke-width="0.3"/>
    <text x="-80" y="52" text-anchor="middle" font-size="8">Speaker L</text>

    <!-- Right speaker grille -->
    <circle cx="80" cy="5" r="38" fill="#CCC" stroke="black" stroke-width="0.5"/>
    <circle cx="80" cy="5" r="32" fill="none" stroke="#AAA" stroke-width="0.3"/>
    <circle cx="80" cy="5" r="25" fill="none" stroke="#AAA" stroke-width="0.3"/>
    <circle cx="80" cy="5" r="18" fill="none" stroke="#AAA" stroke-width="0.3"/>
    <circle cx="80" cy="5" r="10" fill="#D4A84B" stroke="black" stroke-width="0.3"/>
    <text x="80" y="52" text-anchor="middle" font-size="8">Speaker R</text>

    <!-- Screen centered between speakers -->
    <rect x="-35" y="-15" width="70" height="48" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="14" text-anchor="middle" font-size="8" fill="#336">5.0" Screen</text>

    <!-- EQ display area above screen -->
    <rect x="-30" y="-55" width="60" height="30" rx="2" fill="#333" stroke="black" stroke-width="0.5"/>
    <!-- EQ bars -->
    <rect x="-22" y="-48" width="5" height="18" fill="#4CAF50" stroke="none"/>
    <rect x="-14" y="-42" width="5" height="12" fill="#4CAF50" stroke="none"/>
    <rect x="-6" y="-50" width="5" height="20" fill="#4CAF50" stroke="none"/>
    <rect x="2" y="-45" width="5" height="15" fill="#4CAF50" stroke="none"/>
    <rect x="10" y="-38" width="5" height="8" fill="#4CAF50" stroke="none"/>
    <rect x="18" y="-46" width="5" height="16" fill="#4CAF50" stroke="none"/>
    <text x="0" y="-58" text-anchor="middle" font-size="8">EQ Display</text>

    <!-- 3 buttons below screen -->
    <circle cx="-15" cy="50" r="5" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <circle cx="0" cy="50" r="5" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <circle cx="15" cy="50" r="5" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>

    <!-- Dimensions -->
    <line x1="-135" y1="90" x2="135" y2="90" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="102" text-anchor="middle" font-size="9" fill="#CC0000">180mm</text>
    <line x1="150" y1="-75" x2="150" y2="75" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="163" y="5" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(90,163,5)">100mm</text>
  </g>

  <!-- ==================== SIDE PROFILE (top-center) ==================== -->
  <g transform="translate(600,255)">
    <!-- Boombox body side - boxy -->
    <rect x="-37" y="-75" width="74" height="150" rx="5" ry="5" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Handle on top -->
    <path d="M-15,-75 Q-15,-95 0,-95 Q15,-95 15,-75" fill="none" stroke="#888" stroke-width="3"/>
    <path d="M-15,-75 Q-15,-95 0,-95 Q15,-95 15,-75" fill="none" stroke="black" stroke-width="0.5"/>

    <!-- Speaker grille visible -->
    <circle cx="0" cy="5" r="35" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="3,2"/>

    <!-- Depth dimension -->
    <line x1="-37" y1="90" x2="37" y2="90" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="102" text-anchor="middle" font-size="9" fill="#CC0000">50mm</text>
    <!-- Height -->
    <line x1="55" y1="-75" x2="55" y2="75" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="68" y="5" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(90,68,5)">100mm</text>
  </g>

  <!-- ==================== BACK VIEW (top-right) ==================== -->
  <g transform="translate(1000,255)">
    <!-- Boombox body back -->
    <rect x="-135" y="-75" width="270" height="150" rx="8" ry="8" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Handle -->
    <path d="M-50,-75 Q-50,-100 0,-100 Q50,-100 50,-75" fill="none" stroke="#888" stroke-width="3"/>
    <path d="M-50,-75 Q-50,-100 0,-100 Q50,-100 50,-75" fill="none" stroke="black" stroke-width="0.5"/>

    <!-- USB-C -->
    <rect x="-7" y="58" width="14" height="5" rx="2" fill="#333" stroke="black" stroke-width="0.5"/>
    <text x="0" y="72" text-anchor="middle" font-size="9">USB-C</text>

    <!-- Battery compartment decoration -->
    <rect x="-55" y="-10" width="110" height="50" rx="3" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
    <text x="0" y="20" text-anchor="middle" font-size="8">Battery Compartment (decor)</text>
    <!-- Screw decorations -->
    <circle cx="-45" cy="0" r="3" fill="#AAA" stroke="black" stroke-width="0.3"/>
    <circle cx="45" cy="0" r="3" fill="#AAA" stroke="black" stroke-width="0.3"/>
    <circle cx="-45" cy="30" r="3" fill="#AAA" stroke="black" stroke-width="0.3"/>
    <circle cx="45" cy="30" r="3" fill="#AAA" stroke="black" stroke-width="0.3"/>

    <!-- Vent slots -->
    <rect x="-30" y="-55" width="60" height="2" rx="1" fill="#CCC" stroke="black" stroke-width="0.3"/>
    <rect x="-30" y="-48" width="60" height="2" rx="1" fill="#CCC" stroke="black" stroke-width="0.3"/>
    <rect x="-30" y="-41" width="60" height="2" rx="1" fill="#CCC" stroke="black" stroke-width="0.3"/>
  </g>

  <!-- ==================== TOP-DOWN VIEW (bottom-left) ==================== -->
  <g transform="translate(200,680)">
    <!-- Boombox top -->
    <rect x="-135" y="-37" width="270" height="74" rx="8" ry="5" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Handle -->
    <rect x="-45" y="-12" width="90" height="8" rx="4" fill="#888" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-2" text-anchor="middle" font-size="8" fill="white">Handle</text>

    <!-- Slider buttons on top -->
    <rect x="-120" y="5" width="25" height="8" rx="2" fill="#BBB" stroke="black" stroke-width="0.5"/>
    <rect x="-85" y="5" width="25" height="8" rx="2" fill="#BBB" stroke="black" stroke-width="0.5"/>
    <rect x="60" y="5" width="25" height="8" rx="2" fill="#BBB" stroke="black" stroke-width="0.5"/>
    <text x="-108" y="24" text-anchor="middle" font-size="8">Slider 1</text>
    <text x="-73" y="24" text-anchor="middle" font-size="8">Slider 2</text>
    <text x="73" y="24" text-anchor="middle" font-size="8">Slider 3</text>

    <!-- Dimensions -->
    <line x1="-135" y1="48" x2="135" y2="48" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="60" text-anchor="middle" font-size="9" fill="#CC0000">180mm</text>
    <line x1="150" y1="-37" x2="150" y2="37" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="163" y="5" text-anchor="middle" font-size="9" fill="#CC0000" transform="rotate(90,163,5)">50mm</text>
  </g>

  <!-- ==================== CROSS-SECTION Horizontal (bottom-center) ==================== -->
  <g transform="translate(600,680)">
    <!-- Shell outline - horizontal cut -->
    <rect x="-135" y="-37" width="270" height="74" rx="6" fill="none" stroke="black" stroke-width="0.5"/>
    <!-- Walls -->
    <rect x="-135" y="-37" width="6" height="74" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <rect x="129" y="-37" width="6" height="74" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <rect x="-135" y="-37" width="270" height="6" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <rect x="-135" y="31" width="270" height="6" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>

    <!-- Left speaker -->
    <circle cx="-80" cy="0" r="22" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
    <text x="-80" y="4" text-anchor="middle" font-size="7" fill="white">28mm Speaker</text>

    <!-- Screen centered -->
    <rect x="-35" y="-20" width="70" height="40" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="4" text-anchor="middle" font-size="8" fill="#336">Screen</text>

    <!-- PCB layout -->
    <rect x="-50" y="-28" width="100" height="4" fill="#90C695" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-30" text-anchor="middle" font-size="7">PCB</text>

    <!-- Right speaker (decorative — only 1 real speaker) -->
    <circle cx="80" cy="0" r="22" fill="#DDD" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>
    <text x="80" y="4" text-anchor="middle" font-size="7">Passive</text>

    <!-- Section markers -->
    <text x="-140" y="-37" font-size="9" font-weight="bold">B</text>
    <text x="133" y="-37" font-size="9" font-weight="bold">B</text>

    <!-- Wall callout -->
    <line x1="-135" y1="-48" x2="-129" y2="-48" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-132" y="-53" text-anchor="middle" font-size="7" fill="#CC0000">2mm</text>
  </g>

  <!-- ==================== DETAIL: Handle &amp; Slider (bottom-right) ==================== -->
  <g transform="translate(1000,680)">
    <rect x="-130" y="-150" width="260" height="300" rx="4" fill="#F8F8F8" stroke="black" stroke-width="0.3"/>

    <!-- Handle hinge detail -->
    <text x="0" y="-130" text-anchor="middle" font-size="10" font-weight="bold">Carry Handle Hinge</text>

    <!-- Shell top edge -->
    <rect x="-80" y="-70" width="160" height="8" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Hinge post left -->
    <rect x="-65" y="-85" width="10" height="15" rx="2" fill="#999" stroke="black" stroke-width="0.5"/>
    <circle cx="-60" cy="-78" r="4" fill="#777" stroke="black" stroke-width="0.5"/>
    <!-- Hinge post right -->
    <rect x="55" y="-85" width="10" height="15" rx="2" fill="#999" stroke="black" stroke-width="0.5"/>
    <circle cx="60" cy="-78" r="4" fill="#777" stroke="black" stroke-width="0.5"/>
    <!-- Handle bar -->
    <path d="M-60,-78 Q-60,-110 0,-110 Q60,-110 60,-78" fill="none" stroke="#888" stroke-width="4"/>
    <path d="M-60,-78 Q-60,-110 0,-110 Q60,-110 60,-78" fill="none" stroke="black" stroke-width="0.5"/>

    <text x="-75" y="-78" font-size="8">Pivot</text>
    <!-- Rotation arrow -->
    <path d="M-45,-95 A20,20 0 0,1 -30,-78" fill="none" stroke="#CC0000" stroke-width="0.8" marker-end="url(#arrow-end)"/>
    <text x="-55" y="-100" font-size="8" fill="#CC0000">Folds flat</text>

    <!-- Slider button mechanism -->
    <text x="0" y="-10" text-anchor="middle" font-size="10" font-weight="bold">Slider Button Mechanism</text>

    <!-- Shell top surface -->
    <rect x="-80" y="10" width="160" height="8" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Slider track -->
    <rect x="-50" y="5" width="100" height="5" rx="1" fill="#BBB" stroke="black" stroke-width="0.3"/>
    <!-- Slider knob -->
    <rect x="-10" y="0" width="20" height="12" rx="3" fill="#999" stroke="black" stroke-width="0.5"/>
    <text x="0" y="8" text-anchor="middle" font-size="7" fill="white">Knob</text>

    <!-- Slider travel arrows -->
    <line x1="-40" y1="25" x2="40" y2="25" stroke="#CC0000" stroke-width="0.8" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="37" text-anchor="middle" font-size="8" fill="#CC0000">Slider travel</text>

    <!-- Internal linkage -->
    <rect x="-5" y="18" width="10" height="20" fill="#CCC" stroke="black" stroke-width="0.3"/>
    <text x="20" y="30" font-size="8">Wiper arm</text>

    <!-- Tactile switch below (for digital feel) -->
    <rect x="-60" y="55" width="12" height="8" rx="1" fill="#666" stroke="black" stroke-width="0.5"/>
    <text x="-54" y="50" text-anchor="middle" font-size="8">Alt: tactile btn</text>
    <rect x="-63" y="63" width="18" height="4" fill="#90C695" stroke="black" stroke-width="0.3"/>
    <text x="-54" y="77" text-anchor="middle" font-size="7">PCB mount</text>

    <!-- Track dimension -->
    <line x1="-50" y1="90" x2="50" y2="90" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="102" text-anchor="middle" font-size="8" fill="#CC0000">~25mm travel</text>
  </g>
</svg>