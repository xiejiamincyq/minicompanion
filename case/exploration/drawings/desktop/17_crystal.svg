<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#CC0000" stroke="none"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#CC0000" stroke="none"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="white"/>

  <!-- Title -->
  <text x="600" y="28" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Design 17: Crystal — 80×60×100mm Faceted Gem Desktop Case</text>

  <!-- Grid labels -->
  <text x="200" y="58" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">FRONT VIEW</text>
  <text x="600" y="58" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">SIDE PROFILE</text>
  <text x="1000" y="58" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">BACK VIEW</text>
  <text x="200" y="478" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">TOP-DOWN VIEW</text>
  <text x="600" y="478" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">CROSS-SECTION</text>
  <text x="1000" y="478" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">DETAIL — Screen Facet Mount</text>

  <!-- Grid dividers -->
  <line x1="400" y1="40" x2="400" y2="450" stroke="#CCC" stroke-width="0.5"/>
  <line x1="800" y1="40" x2="800" y2="450" stroke="#CCC" stroke-width="0.5"/>
  <line x1="400" y1="460" x2="400" y2="890" stroke="#CCC" stroke-width="0.5"/>
  <line x1="800" y1="460" x2="800" y2="890" stroke="#CCC" stroke-width="0.5"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#CCC" stroke-width="0.5"/>

  <!-- ============ FRONT VIEW (top-left) ============ -->
  <g transform="translate(200,250)">
    <!-- Crystal body — irregular faceted polyhedron -->
    <polygon points="0,-150 50,-170 80,-100 70,-20 40,50 -10,80 -50,80 -70,50 -80,-10 -60,-100 -30,-160"
             fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Facet lines -->
    <line x1="0" y1="-150" x2="20" y2="-40" stroke="black" stroke-width="0.5"/>
    <line x1="50" y1="-170" x2="20" y2="-40" stroke="black" stroke-width="0.5"/>
    <line x1="80" y1="-100" x2="20" y2="-40" stroke="black" stroke-width="0.5"/>
    <line x1="-30" y1="-160" x2="-20" y2="-50" stroke="black" stroke-width="0.5"/>
    <line x1="-60" y1="-100" x2="-20" y2="-50" stroke="black" stroke-width="0.5"/>
    <line x1="-80" y1="-10" x2="-20" y2="-50" stroke="black" stroke-width="0.5"/>
    <line x1="20" y1="-40" x2="-20" y2="-50" stroke="black" stroke-width="0.5"/>
    <line x1="70" y1="-20" x2="20" y2="-40" stroke="black" stroke-width="0.5"/>
    <line x1="-70" y1="50" x2="-20" y2="-50" stroke="black" stroke-width="0.5"/>
    <line x1="40" y1="50" x2="20" y2="-40" stroke="black" stroke-width="0.5"/>

    <!-- Screen on largest flat facet (angled ~20°) -->
    <g transform="rotate(-20, -5, -20)">
      <rect x="-55" y="-65" width="100" height="62" rx="1" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
      <text x="-5" y="-30" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#336">5.0" SSD1963</text>
    </g>

    <!-- Base with 3 buttons -->
    <rect x="-65" y="70" width="120" height="15" rx="2" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
    <circle cx="-30" cy="78" r="4" fill="#888" stroke="black" stroke-width="0.5"/>
    <circle cx="0" cy="78" r="4" fill="#888" stroke="black" stroke-width="0.5"/>
    <circle cx="30" cy="78" r="4" fill="#888" stroke="black" stroke-width="0.5"/>
    <text x="0" y="100" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#555">3× 6mm buttons</text>

    <!-- Dimension: width 80mm -->
    <line x1="-80" y1="-185" x2="80" y2="-185" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="-80" y1="-175" x2="-80" y2="-195" stroke="#CC0000" stroke-width="0.5"/>
    <line x1="80" y1="-175" x2="80" y2="-195" stroke="#CC0000" stroke-width="0.5"/>
    <text x="0" y="-190" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#CC0000">80mm</text>

    <!-- Dimension: height 100mm -->
    <line x1="100" y1="-170" x2="100" y2="85" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="90" y1="-170" x2="110" y2="-170" stroke="#CC0000" stroke-width="0.5"/>
    <line x1="90" y1="85" x2="110" y2="85" stroke="#CC0000" stroke-width="0.5"/>
    <text x="115" y="-40" font-family="sans-serif" font-size="9" text-anchor="start" fill="#CC0000">100mm</text>
  </g>

  <!-- ============ SIDE PROFILE (top-center) ============ -->
  <g transform="translate(600,250)">
    <!-- Crystal side profile — faceted angular geometry -->
    <polygon points="0,-160 30,-130 40,-60 35,10 20,60 0,80 -20,80 -35,50 -40,-20 -30,-90 -15,-150"
             fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Facet edges -->
    <line x1="0" y1="-160" x2="10" y2="-50" stroke="black" stroke-width="0.5"/>
    <line x1="30" y1="-130" x2="10" y2="-50" stroke="black" stroke-width="0.5"/>
    <line x1="40" y1="-60" x2="10" y2="-50" stroke="black" stroke-width="0.5"/>
    <line x1="-15" y1="-150" x2="-10" y2="-60" stroke="black" stroke-width="0.5"/>
    <line x1="-30" y1="-90" x2="-10" y2="-60" stroke="black" stroke-width="0.5"/>
    <line x1="35" y1="10" x2="10" y2="-50" stroke="black" stroke-width="0.5"/>
    <line x1="-40" y1="-20" x2="-10" y2="-60" stroke="black" stroke-width="0.5"/>
    <line x1="10" y1="-50" x2="-10" y2="-60" stroke="black" stroke-width="0.5"/>

    <!-- Screen edge visible from side (thin line) -->
    <line x1="30" y1="-120" x2="38" y2="-55" stroke="#4488CC" stroke-width="1.5"/>
    <text x="55" y="-85" font-family="sans-serif" font-size="9" fill="#336">Screen edge</text>

    <!-- Base -->
    <rect x="-30" y="70" width="55" height="15" rx="2" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>

    <!-- Dimension: depth 60mm -->
    <line x1="-40" y1="105" x2="40" y2="105" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="-40" y1="95" x2="-40" y2="115" stroke="#CC0000" stroke-width="0.5"/>
    <line x1="40" y1="95" x2="40" y2="115" stroke="#CC0000" stroke-width="0.5"/>
    <text x="0" y="120" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#CC0000">60mm</text>

    <!-- Angle annotation -->
    <path d="M25,-125 Q40,-110 38,-90" fill="none" stroke="#CC0000" stroke-width="0.5"/>
    <text x="50" y="-105" font-family="sans-serif" font-size="9" fill="#CC0000">~20°</text>
  </g>

  <!-- ============ BACK VIEW (top-right) ============ -->
  <g transform="translate(1000,250)">
    <!-- Crystal back — more facets visible -->
    <polygon points="0,-150 45,-165 75,-95 65,-15 35,55 -5,80 -45,80 -65,45 -75,-15 -55,-100 -25,-158"
             fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Back facet lines -->
    <line x1="0" y1="-150" x2="15" y2="-30" stroke="black" stroke-width="0.5"/>
    <line x1="45" y1="-165" x2="15" y2="-30" stroke="black" stroke-width="0.5"/>
    <line x1="75" y1="-95" x2="15" y2="-30" stroke="black" stroke-width="0.5"/>
    <line x1="65" y1="-15" x2="15" y2="-30" stroke="black" stroke-width="0.5"/>
    <line x1="-25" y1="-158" x2="-15" y2="-40" stroke="black" stroke-width="0.5"/>
    <line x1="-55" y1="-100" x2="-15" y2="-40" stroke="black" stroke-width="0.5"/>
    <line x1="-75" y1="-15" x2="-15" y2="-40" stroke="black" stroke-width="0.5"/>
    <line x1="-65" y1="45" x2="-15" y2="-40" stroke="black" stroke-width="0.5"/>
    <line x1="35" y1="55" x2="15" y2="-30" stroke="black" stroke-width="0.5"/>
    <line x1="15" y1="-30" x2="-15" y2="-40" stroke="black" stroke-width="0.5"/>

    <!-- USB-C on lower back facet -->
    <rect x="-7" y="35" width="14" height="5" rx="2" fill="#555" stroke="black" stroke-width="0.5"/>
    <text x="25" y="40" font-family="sans-serif" font-size="9" fill="#555">USB-C</text>
    <text x="25" y="50" font-family="sans-serif" font-size="8" fill="#777">8.94×3.26mm</text>

    <!-- Screen dashed (hidden) -->
    <rect x="-48" y="-75" width="85" height="55" rx="1" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="4,3"/>
    <text x="-5" y="-45" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#888">Screen (hidden)</text>
  </g>

  <!-- ============ TOP-DOWN VIEW (bottom-left) ============ -->
  <g transform="translate(200,680)">
    <!-- Top view — looking down on crystal point -->
    <polygon points="0,-80 40,-60 55,-20 40,25 10,50 -15,50 -45,20 -55,-15 -40,-55 -15,-75"
             fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Central point -->
    <circle cx="0" cy="-5" r="2" fill="#999" stroke="black" stroke-width="0.5"/>
    <!-- Facet ridges from center -->
    <line x1="0" y1="-5" x2="0" y2="-80" stroke="black" stroke-width="0.5"/>
    <line x1="0" y1="-5" x2="40" y2="-60" stroke="black" stroke-width="0.5"/>
    <line x1="0" y1="-5" x2="55" y2="-20" stroke="black" stroke-width="0.5"/>
    <line x1="0" y1="-5" x2="40" y2="25" stroke="black" stroke-width="0.5"/>
    <line x1="0" y1="-5" x2="10" y2="50" stroke="black" stroke-width="0.5"/>
    <line x1="0" y1="-5" x2="-15" y2="50" stroke="black" stroke-width="0.5"/>
    <line x1="0" y1="-5" x2="-45" y2="20" stroke="black" stroke-width="0.5"/>
    <line x1="0" y1="-5" x2="-55" y2="-15" stroke="black" stroke-width="0.5"/>
    <line x1="0" y1="-5" x2="-40" y2="-55" stroke="black" stroke-width="0.5"/>
    <line x1="0" y1="-5" x2="-15" y2="-75" stroke="black" stroke-width="0.5"/>

    <!-- Screen facet (dashed, below) -->
    <rect x="-30" y="15" width="50" height="30" rx="1" fill="none" stroke="#4488CC" stroke-width="0.5" stroke-dasharray="4,3"/>
    <text x="-5" y="35" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#4488CC">Screen facet</text>

    <!-- Dimension -->
    <line x1="-60" y1="70" x2="60" y2="70" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="83" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#CC0000">80mm</text>

    <line x1="75" y1="-80" x2="75" y2="55" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="85" y="-10" font-family="sans-serif" font-size="9" fill="#CC0000">60mm</text>
  </g>

  <!-- ============ CROSS-SECTION (bottom-center) ============ -->
  <g transform="translate(600,680)">
    <!-- Crystal outer shell cross-section -->
    <polygon points="0,-160 55,-120 65,-40 50,30 20,70 -15,80 -50,30 -60,-35 -50,-115 -20,-155"
             fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Inner cavity -->
    <polygon points="0,-140 40,-105 50,-35 38,20 12,55 -10,60 -38,22 -45,-30 -38,-100 -12,-135"
             fill="white" stroke="black" stroke-width="0.5"/>

    <!-- PCB -->
    <rect x="-38" y="15" width="76" height="4" fill="#90C695" stroke="black" stroke-width="0.5"/>
    <text x="50" y="20" font-family="sans-serif" font-size="8" fill="#4A7A4E">PCB</text>

    <!-- Screen in facet pocket (angled) -->
    <g transform="rotate(-20, 0, -50)">
      <rect x="-42" y="-75" width="84" height="5" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
      <text x="52" y="-70" font-family="sans-serif" font-size="8" fill="#336">Screen</text>
    </g>

    <!-- LED glow area -->
    <ellipse cx="0" cy="-120" rx="20" ry="10" fill="#FFFFCC" fill-opacity="0.5" stroke="#D4A84B" stroke-width="0.5" stroke-dasharray="3,2"/>
    <text x="30" y="-118" font-family="sans-serif" font-size="8" fill="#D4A84B">LED glow</text>

    <!-- Speaker area -->
    <ellipse cx="0" cy="45" rx="18" ry="6" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
    <text x="28" y="48" font-family="sans-serif" font-size="8" fill="#8B7030">Speaker</text>

    <!-- Wall thickness dimension -->
    <line x1="50" y1="-40" x2="65" y2="-40" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="72" y="-37" font-family="sans-serif" font-size="8" fill="#CC0000">2mm wall</text>

    <text x="0" y="100" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#555">Vertical cut through center</text>
  </g>

  <!-- ============ DETAIL — Screen Facet Mount (bottom-right) ============ -->
  <g transform="translate(1000,680)">
    <!-- Enlarged facet pocket detail -->
    <!-- Outer facet surface (angled ~20°) -->
    <g transform="rotate(-20, 0, -20)">
      <!-- Shell wall -->
      <rect x="-100" y="-50" width="200" height="12" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
      <!-- Pocket recess -->
      <rect x="-65" y="-50" width="130" height="8" fill="#D8D8D8" stroke="black" stroke-width="0.5"/>
      <!-- Screen module in pocket -->
      <rect x="-62" y="-50" width="124" height="5" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
      <text x="0" y="-53" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#336">5.0" Screen Module</text>

      <!-- Retaining clips -->
      <rect x="-68" y="-50" width="6" height="8" rx="1" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
      <rect x="62" y="-50" width="6" height="8" rx="1" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    </g>

    <!-- Labels -->
    <line x1="-120" y1="-85" x2="-75" y2="-55" stroke="#555" stroke-width="0.5"/>
    <text x="-130" y="-88" font-family="sans-serif" font-size="9" text-anchor="end" fill="#555">Retaining clip</text>

    <line x1="120" y1="-85" x2="80" y2="-50" stroke="#555" stroke-width="0.5"/>
    <text x="125" y="-88" font-family="sans-serif" font-size="9" fill="#555">Retaining clip</text>

    <line x1="0" y1="20" x2="0" y2="0" stroke="#555" stroke-width="0.5"/>
    <text x="0" y="32" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#555">Shell wall (2mm)</text>

    <!-- Pocket depth dimension -->
    <line x1="-110" y1="-45" x2="-110" y2="-30" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-130" y="-35" font-family="sans-serif" font-size="8" fill="#CC0000">4.5mm</text>
    <text x="-130" y="-25" font-family="sans-serif" font-size="8" fill="#CC0000">pocket</text>

    <!-- Screen module dims -->
    <line x1="-80" y1="55" x2="80" y2="55" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="68" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#CC0000">120×75mm module</text>

    <!-- Angle -->
    <path d="M-120,10 Q-110,-20 -95,-40" fill="none" stroke="#CC0000" stroke-width="0.5"/>
    <text x="-140" y="-5" font-family="sans-serif" font-size="9" fill="#CC0000">20°</text>

    <text x="0" y="95" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#555">Screen sits in angled facet pocket</text>
    <text x="0" y="108" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#555">with snap-fit retaining clips</text>
  </g>
</svg>