<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="sans-serif" font-size="10px">
  <rect width="1200" height="900" fill="white"/>
  <text x="600" y="30" text-anchor="middle" font-size="16px" font-weight="bold">Design 20: Compass — 60mm dia × 18mm</text>

  <!-- Grid labels -->
  <text x="200" y="60" text-anchor="middle" font-size="11px" font-weight="bold">FRONT VIEW (lid open)</text>
  <text x="600" y="60" text-anchor="middle" font-size="11px" font-weight="bold">SIDE VIEW</text>
  <text x="1000" y="60" text-anchor="middle" font-size="11px" font-weight="bold">BACK VIEW</text>
  <text x="200" y="470" text-anchor="middle" font-size="11px" font-weight="bold">TOP-DOWN VIEW (closed)</text>
  <text x="600" y="470" text-anchor="middle" font-size="11px" font-weight="bold">CROSS-SECTION A–A</text>
  <text x="1000" y="470" text-anchor="middle" font-size="11px" font-weight="bold">DETAIL: LID HINGE</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowR" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="#CC0000"/>
    </marker>
    <marker id="arrowL" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto">
      <path d="M6,0 L0,2 L6,4" fill="#CC0000"/>
    </marker>
    <marker id="arrowD" markerWidth="4" markerHeight="6" refX="2" refY="6" orient="auto">
      <path d="M0,0 L2,6 L4,0" fill="#CC0000"/>
    </marker>
    <marker id="arrowU" markerWidth="4" markerHeight="6" refX="2" refY="0" orient="auto">
      <path d="M0,6 L2,0 L4,6" fill="#CC0000"/>
    </marker>
    <pattern id="hatch20" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- ==================== FRONT VIEW — lid open (top-left) ==================== -->
  <g transform="translate(200,260)">
    <!-- Main body — brass colored circle -->
    <circle cx="0" cy="0" r="90" fill="#D4A84B" fill-opacity="0.3" stroke="#D4A84B" stroke-width="1"/>
    <!-- Bezel ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="black" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#B8922E" stroke-width="2"/>

    <!-- Screen area -->
    <circle cx="0" cy="0" r="65" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-10" text-anchor="middle" font-size="9px" fill="#336">320×240 TFT</text>
    <text x="0" y="3" text-anchor="middle" font-size="9px" fill="#336">(circular mask)</text>

    <!-- Compass rose markers on bezel -->
    <text x="0" y="-72" text-anchor="middle" font-size="9px" font-weight="bold">N</text>
    <text x="0" y="78" text-anchor="middle" font-size="9px" font-weight="bold">S</text>
    <text x="77" y="3" text-anchor="middle" font-size="9px" font-weight="bold">E</text>
    <text x="-77" y="3" text-anchor="middle" font-size="9px" font-weight="bold">W</text>
    <!-- Tick marks -->
    <line x1="0" y1="-82" x2="0" y2="-87" stroke="black" stroke-width="0.5"/>
    <line x1="0" y1="82" x2="0" y2="87" stroke="black" stroke-width="0.5"/>
    <line x1="82" y1="0" x2="87" y2="0" stroke="black" stroke-width="0.5"/>
    <line x1="-82" y1="0" x2="-87" y2="0" stroke="black" stroke-width="0.5"/>
    <!-- Diagonal ticks -->
    <line x1="58" y1="-58" x2="61" y2="-61" stroke="black" stroke-width="0.5"/>
    <line x1="58" y1="58" x2="61" y2="61" stroke="black" stroke-width="0.5"/>
    <line x1="-58" y1="-58" x2="-61" y2="-61" stroke="black" stroke-width="0.5"/>
    <line x1="-58" y1="58" x2="-61" y2="61" stroke="black" stroke-width="0.5"/>

    <!-- Bezel ring buttons (4 positions) -->
    <circle cx="64" cy="-64" r="6" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
    <text x="64" y="-62" text-anchor="middle" font-size="6px">A</text>
    <circle cx="64" cy="64" r="6" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
    <text x="64" y="66" text-anchor="middle" font-size="6px">B</text>
    <circle cx="-64" cy="64" r="6" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
    <text x="-64" y="66" text-anchor="middle" font-size="6px">C</text>
    <circle cx="-64" cy="-64" r="6" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
    <text x="-64" y="-62" text-anchor="middle" font-size="6px">D</text>

    <!-- Hinge point at top -->
    <rect x="-8" y="-95" width="16" height="8" rx="2" fill="#B8922E" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-100" text-anchor="middle" font-size="8px">Hinge</text>

    <!-- Diameter dimension -->
    <line x1="-90" y1="110" x2="90" y2="110" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
    <text x="0" y="123" text-anchor="middle" font-size="9px" fill="#CC0000">60mm</text>
  </g>

  <!-- ==================== SIDE VIEW (top-center) ==================== -->
  <g transform="translate(600,260)">
    <!-- Base body — 18mm tall, 60mm wide from side -->
    <path d="M-90,-12 Q-92,-15 -90,-18 L-88,-24 Q-85,-27 -80,-27 L80,-27 Q85,-27 88,-24 L90,-18 Q92,-15 90,-12 L90,12 Q92,15 90,18 L88,24 Q85,27 80,27 L-80,27 Q-85,27 -88,24 L-90,18 Q-92,15 -90,12 Z" fill="#D4A84B" fill-opacity="0.3" stroke="black" stroke-width="0.5"/>
    <!-- Lid (open — tilted back) -->
    <path d="M-80,-27 L-85,-55 Q-82,-85 0,-90 Q82,-85 85,-55 L80,-27" fill="#D4A84B" fill-opacity="0.2" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-60" text-anchor="middle" font-size="9px">Lid (open ~135°)</text>
    <!-- Hinge pivot -->
    <circle cx="-80" cy="-27" r="3" fill="#B8922E" stroke="black" stroke-width="0.5"/>
    <circle cx="80" cy="-27" r="3" fill="#B8922E" stroke="black" stroke-width="0.5"/>
    <!-- Screen edge -->
    <line x1="-75" y1="-24" x2="75" y2="-24" stroke="#B0D4F1" stroke-width="2"/>
    <!-- USB-C at bottom -->
    <rect x="-6" y="24" width="12" height="5" rx="1" fill="#333" stroke="black" stroke-width="0.5"/>
    <text x="20" y="30" font-size="8px">USB-C</text>

    <!-- Height dimension -->
    <line x1="105" y1="-27" x2="105" y2="27" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrowU)" marker-end="url(#arrowD)"/>
    <text x="120" y="3" text-anchor="middle" font-size="9px" fill="#CC0000">18mm</text>
    <!-- Width dimension -->
    <line x1="-90" y1="45" x2="90" y2="45" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
    <text x="0" y="57" text-anchor="middle" font-size="9px" fill="#CC0000">60mm</text>
  </g>

  <!-- ==================== BACK VIEW (top-right) ==================== -->
  <g transform="translate(1000,260)">
    <!-- Back of compass body -->
    <circle cx="0" cy="0" r="90" fill="#D4A84B" fill-opacity="0.3" stroke="black" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="82" fill="#D4A84B" fill-opacity="0.15" stroke="black" stroke-width="0.5"/>
    <!-- Decorative engraving pattern -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#B8922E" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#B8922E" stroke-width="0.5"/>
    <!-- Compass rose engraving on back -->
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#B8922E" stroke-width="0.5"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#B8922E" stroke-width="0.5"/>
    <line x1="-38" y1="-38" x2="38" y2="38" stroke="#B8922E" stroke-width="0.3"/>
    <line x1="38" y1="-38" x2="-38" y2="38" stroke="#B8922E" stroke-width="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-size="10px" fill="#8B7020">DEVOTCHI</text>
    <!-- Battery outline dashed -->
    <circle cx="0" cy="0" r="50" fill="#D4A84B" fill-opacity="0.15" stroke="black" stroke-width="0.5" stroke-dasharray="4,3"/>
    <text x="0" y="-15" text-anchor="middle" font-size="8px" fill="#8B7020">Battery (round LiPo)</text>
    <text x="0" y="20" text-anchor="middle" font-size="8px" fill="#8B7020">500mAh</text>
    <!-- Hinge -->
    <rect x="-8" y="-95" width="16" height="8" rx="2" fill="#B8922E" stroke="black" stroke-width="0.5"/>
  </g>

  <!-- ==================== TOP-DOWN VIEW — closed (bottom-left) ==================== -->
  <g transform="translate(200,670)">
    <!-- Lid closed — circular from above -->
    <circle cx="0" cy="0" r="90" fill="#D4A84B" fill-opacity="0.3" stroke="black" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#B8922E" stroke-width="1"/>
    <!-- Lid surface detail — compass rose -->
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#B8922E" stroke-width="0.5"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#B8922E" stroke-width="0.5"/>
    <!-- Cardinal arrows -->
    <polygon points="0,-65 -8,-45 0,-50 8,-45" fill="#B8922E" fill-opacity="0.5" stroke="#B8922E" stroke-width="0.3"/>
    <text x="0" y="-70" text-anchor="middle" font-size="8px" fill="#8B7020">N</text>
    <!-- Hinge visible at top -->
    <rect x="-10" y="-93" width="20" height="6" rx="2" fill="#B8922E" stroke="black" stroke-width="0.5"/>
    <!-- Latch at bottom -->
    <rect x="-6" y="87" width="12" height="6" rx="1" fill="#B8922E" stroke="black" stroke-width="0.5"/>
    <text x="0" y="102" text-anchor="middle" font-size="8px">Latch/clasp</text>
    <!-- Bezel buttons visible (dashed — under lid) -->
    <circle cx="64" cy="-64" r="5" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
    <circle cx="64" cy="64" r="5" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
    <circle cx="-64" cy="64" r="5" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
    <circle cx="-64" cy="-64" r="5" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>

    <!-- Diameter dimension -->
    <line x1="-90" y1="110" x2="90" y2="110" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
    <text x="0" y="123" text-anchor="middle" font-size="9px" fill="#CC0000">∅60mm</text>
  </g>

  <!-- ==================== CROSS-SECTION A–A (bottom-center) ==================== -->
  <g transform="translate(600,670)">
    <!-- Outer shell cross section — semicircle top and bottom -->
    <!-- Bottom half shell -->
    <path d="M-90,0 Q-90,27 -80,27 L80,27 Q90,27 90,0 L90,-5 L-90,-5 Z" fill="none" stroke="black" stroke-width="0.5"/>
    <!-- Bottom wall hatch -->
    <path d="M-90,0 Q-90,27 -80,27 L80,27 Q90,27 90,0 L88,0 Q88,24 -78,24 L78,24 Q88,24 88,0 Z" fill="url(#hatch20)" stroke="black" stroke-width="0.5"/>
    <path d="M-90,-5 L90,-5 L90,0 L-90,0 Z" fill="url(#hatch20)" stroke="black" stroke-width="0.5"/>

    <!-- Top lid shell (open position, just showing closed for cross-section) -->
    <path d="M-90,-5 L-90,-27 Q-90,-30 -80,-30 L80,-30 Q90,-30 90,-27 L90,-5" fill="none" stroke="black" stroke-width="0.5"/>
    <path d="M-90,-27 Q-90,-30 -80,-30 L80,-30 Q90,-30 90,-27 L90,-24 Q88,-27 80,-27 L-80,-27 Q-88,-27 -90,-24 Z" fill="url(#hatch20)" stroke="black" stroke-width="0.5"/>
    <path d="M-90,-8 L90,-8 L90,-5 L-90,-5 Z" fill="url(#hatch20)" stroke="black" stroke-width="0.5"/>

    <!-- PCB -->
    <rect x="-75" y="-2" width="150" height="4" fill="#90C695" stroke="black" stroke-width="0.5"/>
    <text x="0" y="1" text-anchor="middle" font-size="7px" fill="#2A5E2A">PCB</text>
    <!-- Screen above PCB -->
    <rect x="-55" y="-22" width="110" height="15" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-12" text-anchor="middle" font-size="8px" fill="#336">TFT LCD</text>
    <!-- Battery below PCB -->
    <ellipse cx="0" cy="14" rx="60" ry="8" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
    <text x="0" y="17" text-anchor="middle" font-size="7px" fill="white">Round LiPo Battery</text>

    <!-- Hinge at edges -->
    <circle cx="-90" cy="-5" r="4" fill="#B8922E" stroke="black" stroke-width="0.5"/>
    <circle cx="90" cy="-5" r="4" fill="#B8922E" stroke="black" stroke-width="0.5"/>
    <text x="-90" y="-14" text-anchor="middle" font-size="8px">Hinge</text>

    <!-- Height dimension -->
    <line x1="105" y1="-30" x2="105" y2="27" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrowU)" marker-end="url(#arrowD)"/>
    <text x="120" y="0" text-anchor="middle" font-size="9px" fill="#CC0000">18mm</text>
    <!-- Shell thickness -->
    <line x1="-100" y1="-8" x2="-100" y2="-5" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrowU)" marker-end="url(#arrowD)"/>
    <text x="-120" y="-5" font-size="8px" fill="#CC0000">1.5mm</text>
  </g>

  <!-- ==================== DETAIL: LID HINGE (bottom-right) ==================== -->
  <g transform="translate(1000,670)">
    <!-- Side-by-side: CLOSED (left) and OPEN (right) -->
    <text x="-70" y="-95" text-anchor="middle" font-size="9px" font-weight="bold">CLOSED</text>
    <text x="70" y="-95" text-anchor="middle" font-size="9px" font-weight="bold">OPEN</text>

    <!-- CLOSED state -->
    <g transform="translate(-70,0)">
      <!-- Body bottom half -->
      <rect x="-45" y="0" width="90" height="30" rx="3" fill="#D4A84B" fill-opacity="0.3" stroke="black" stroke-width="0.5"/>
      <!-- Lid top half (closed) -->
      <rect x="-45" y="-30" width="90" height="30" rx="3" fill="#D4A84B" fill-opacity="0.2" stroke="black" stroke-width="0.5"/>
      <!-- Hinge barrel -->
      <circle cx="-45" cy="0" r="6" fill="#B8922E" stroke="black" stroke-width="0.5"/>
      <circle cx="-45" cy="0" r="2" fill="#8B7020" stroke="black" stroke-width="0.3"/>
      <!-- Hinge pin detail -->
      <text x="-45" y="15" text-anchor="middle" font-size="7px">Hinge pin</text>
      <!-- Latch at right -->
      <rect x="40" y="-5" width="8" height="10" rx="1" fill="#B8922E" stroke="black" stroke-width="0.5"/>
      <text x="55" y="3" font-size="7px">Latch</text>
      <!-- Screen hidden -->
      <rect x="-35" y="-25" width="65" height="20" rx="2" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>
      <text x="-2" y="-12" text-anchor="middle" font-size="7px" fill="#336">Screen</text>
      <!-- Dimension -->
      <line x1="60" y1="-30" x2="60" y2="30" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrowU)" marker-end="url(#arrowD)"/>
      <text x="73" y="3" font-size="8px" fill="#CC0000">18mm</text>
    </g>

    <!-- OPEN state -->
    <g transform="translate(70,0)">
      <!-- Body bottom half -->
      <rect x="-45" y="0" width="90" height="30" rx="3" fill="#D4A84B" fill-opacity="0.3" stroke="black" stroke-width="0.5"/>
      <!-- Lid open (~135°) -->
      <path d="M-45,0 L-80,-55 Q-40,-80 40,-55 L45,0" fill="#D4A84B" fill-opacity="0.15" stroke="black" stroke-width="0.5"/>
      <!-- Screen now visible -->
      <rect x="-35" y="-25" width="65" height="20" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
      <text x="-2" y="-12" text-anchor="middle" font-size="7px" fill="#336">Screen visible</text>
      <!-- Hinge barrel -->
      <circle cx="-45" cy="0" r="6" fill="#B8922E" stroke="black" stroke-width="0.5"/>
      <circle cx="-45" cy="0" r="2" fill="#8B7020" stroke="black" stroke-width="0.3"/>
      <!-- Rotation arc -->
      <path d="M-45,-10 Q-65,-30 -70,-50" fill="none" stroke="#CC0000" stroke-width="0.5" stroke-dasharray="3,2"/>
      <text x="-75" y="-30" font-size="8px" fill="#CC0000">~135°</text>
      <!-- Spring detent -->
      <path d="M-42,-2 L-38,-6 L-34,-2" fill="none" stroke="black" stroke-width="0.5"/>
      <text x="-30" y="-8" font-size="7px">Spring detent</text>
      <!-- Latch released -->
      <rect x="40" y="-5" width="8" height="10" rx="1" fill="none" stroke="#B8922E" stroke-width="0.5" stroke-dasharray="2,2"/>
    </g>
  </g>
</svg>