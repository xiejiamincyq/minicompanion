<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#CC0000"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#CC0000"/>
    </marker>
    <pattern id="hatch3" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="white"/>

  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Design 3: Pebble — Rounded Rectangle (62mm x 50mm x 16mm, R10mm corners)</text>

  <!-- ============ VIEW 1: FRONT VIEW (top-left) ============ -->
  <text x="300" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Front View</text>

  <!-- Main body - super rounded rectangle -->
  <rect x="145" y="95" width="310" height="385" rx="62" ry="62" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Screen bezel -->
  <rect x="190" y="145" width="220" height="165" rx="8" ry="8" fill="none" stroke="black" stroke-width="0.5"/>
  <!-- Active display -->
  <rect x="200" y="155" width="200" height="145" rx="4" ry="4" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="300" y="230" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Active Area</text>
  <text x="300" y="244" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">40.80 x 30.60mm</text>

  <!-- Clean face - no front buttons for Pebble design -->
  <text x="300" y="380" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#999" font-style="italic">Clean face — buttons on sides</text>

  <!-- Devotchi logo placeholder -->
  <text x="300" y="420" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#BBB">DEVOTCHI</text>

  <!-- Dimension: width 50mm -->
  <line x1="145" y1="510" x2="455" y2="510" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="145" y1="500" x2="145" y2="520" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="455" y1="500" x2="455" y2="520" stroke="#CC0000" stroke-width="0.5"/>
  <text x="300" y="528" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CC0000">50.0mm</text>

  <!-- Dimension: height 62mm -->
  <line x1="490" y1="95" x2="490" y2="480" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="480" y1="95" x2="500" y2="95" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="480" y1="480" x2="500" y2="480" stroke="#CC0000" stroke-width="0.5"/>
  <text x="510" y="292" text-anchor="start" font-family="sans-serif" font-size="10" fill="#CC0000">62.0mm</text>

  <!-- Corner radius callout -->
  <path d="M145,157 Q145,95 207,95" fill="none" stroke="#CC0000" stroke-width="0.3" stroke-dasharray="2,2"/>
  <line x1="145" y1="126" x2="176" y2="126" stroke="#CC0000" stroke-width="0.3"/>
  <text x="140" y="140" text-anchor="end" font-family="sans-serif" font-size="8" fill="#CC0000">R10mm</text>

  <!-- ============ VIEW 2: RIGHT SIDE VIEW (top-right) ============ -->
  <text x="900" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Right Side View — Button Detail</text>

  <!-- Side profile - rounded rectangle from side -->
  <rect x="855" y="95" width="90" height="385" rx="20" ry="20" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Curved profile lines -->
  <path d="M855,115 Q848,287 855,460" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="3,2"/>
  <path d="M945,115 Q952,287 945,460" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="3,2"/>
  <text x="960" y="300" font-family="sans-serif" font-size="8" fill="#555">Curved</text>
  <text x="960" y="312" font-family="sans-serif" font-size="8" fill="#555">profile</text>

  <!-- 3 side buttons (watch-pusher style) -->
  <rect x="943" y="175" width="18" height="36" rx="4" ry="4" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <rect x="943" y="230" width="18" height="36" rx="4" ry="4" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <rect x="943" y="285" width="18" height="36" rx="4" ry="4" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>

  <text x="970" y="196" font-family="sans-serif" font-size="8" fill="#333">BTN1 (Up)</text>
  <text x="970" y="251" font-family="sans-serif" font-size="8" fill="#333">BTN2 (Select)</text>
  <text x="970" y="306" font-family="sans-serif" font-size="8" fill="#333">BTN3 (Down)</text>

  <!-- Button detail dimensions -->
  <line x1="963" y1="175" x2="963" y2="230" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="975" y="210" font-family="sans-serif" font-size="7" fill="#CC0000">14mm</text>
  <text x="975" y="220" font-family="sans-serif" font-size="7" fill="#CC0000">spacing</text>

  <!-- Wake button (smaller, opposite side) -->
  <rect x="840" y="230" width="16" height="28" rx="3" ry="3" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <text x="832" y="248" text-anchor="end" font-family="sans-serif" font-size="8" fill="#333">Wake</text>

  <!-- USB-C at bottom -->
  <rect x="886" y="478" width="28" height="6" rx="2" fill="white" stroke="black" stroke-width="0.5"/>
  <text x="900" y="498" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">USB-C</text>

  <!-- Screen edge visible from side -->
  <line x1="855" y1="145" x2="855" y2="310" stroke="#4488CC" stroke-width="1.5"/>
  <text x="843" y="230" text-anchor="end" font-family="sans-serif" font-size="8" fill="#4488CC">Screen</text>

  <!-- Dimension: depth 16mm -->
  <line x1="855" y1="520" x2="945" y2="520" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="855" y1="510" x2="855" y2="530" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="945" y1="510" x2="945" y2="530" stroke="#CC0000" stroke-width="0.5"/>
  <text x="900" y="538" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CC0000">16.0mm</text>

  <!-- Dimension: height 62mm -->
  <line x1="820" y1="95" x2="820" y2="480" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="810" y1="95" x2="830" y2="95" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="810" y1="480" x2="830" y2="480" stroke="#CC0000" stroke-width="0.5"/>
  <text x="800" y="292" text-anchor="end" font-family="sans-serif" font-size="10" fill="#CC0000">62.0mm</text>

  <!-- ============ VIEW 3: CROSS-SECTION (bottom-left) ============ -->
  <text x="300" y="555" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Cross-Section (Vertical Cut B-B)</text>

  <!-- Outer shell with rounded profile -->
  <!-- Front wall -->
  <rect x="140" y="585" width="320" height="14" rx="6" fill="url(#hatch3)" stroke="black" stroke-width="0.5"/>
  <!-- Back wall -->
  <rect x="140" y="865" width="320" height="14" rx="6" fill="url(#hatch3)" stroke="black" stroke-width="0.5"/>
  <!-- Left wall -->
  <rect x="140" y="599" width="10" height="266" fill="url(#hatch3)" stroke="black" stroke-width="0.5"/>
  <!-- Right wall -->
  <rect x="450" y="599" width="10" height="266" fill="url(#hatch3)" stroke="black" stroke-width="0.5"/>

  <!-- Display (blue) -->
  <rect x="160" y="604" width="280" height="36" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="300" y="626" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Display 2.0mm</text>

  <!-- FPC ribbon callout -->
  <path d="M440,620 L440,660 L420,660" fill="none" stroke="#888" stroke-width="0.5"/>
  <text x="460" y="624" font-family="sans-serif" font-size="7" fill="#888">FPC ribbon</text>

  <!-- Gap -->
  <rect x="160" y="640" width="280" height="14" fill="white" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>
  <text x="300" y="651" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#999">Air gap 1.0mm</text>

  <!-- PCB (green) -->
  <rect x="160" y="654" width="280" height="28" fill="#90C695" stroke="black" stroke-width="0.5"/>
  <text x="300" y="672" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">PCB 1.6mm (45.0 x 40.0mm)</text>

  <!-- Components on PCB bottom side -->
  <rect x="170" y="682" width="52" height="20" fill="#7AB37E" stroke="black" stroke-width="0.3"/>
  <text x="196" y="696" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#333">ESP32-S3</text>
  <rect x="240" y="682" width="20" height="10" fill="#AAA" stroke="black" stroke-width="0.3"/>
  <text x="250" y="690" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#333">LDO</text>
  <rect x="280" y="682" width="14" height="10" fill="#AAA" stroke="black" stroke-width="0.3"/>
  <text x="287" y="690" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#333">CHG</text>

  <!-- Gap -->
  <rect x="160" y="706" width="280" height="18" fill="white" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>
  <text x="300" y="719" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#999">Gap 1.5mm</text>

  <!-- Battery (gold) -->
  <rect x="175" y="724" width="250" height="84" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
  <text x="300" y="770" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">LiPo Battery 5.0mm</text>
  <text x="300" y="784" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">30 x 35mm, 300-500mAh</text>

  <!-- Vibration motor next to battery -->
  <circle cx="170" cy="790" r="12" fill="#DDD" stroke="black" stroke-width="0.5"/>
  <text x="170" y="793" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#333">Vibe</text>

  <!-- Gap -->
  <rect x="160" y="808" width="280" height="8" fill="white" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>

  <!-- Connector for side buttons (shown as dashed) -->
  <rect x="450" y="630" width="10" height="50" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>
  <text x="470" y="660" font-family="sans-serif" font-size="7" fill="#888">Button</text>
  <text x="470" y="670" font-family="sans-serif" font-size="7" fill="#888">channels</text>

  <!-- Total Z-stack dimension -->
  <line x1="118" y1="585" x2="118" y2="879" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="108" y1="585" x2="128" y2="585" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="108" y1="879" x2="128" y2="879" stroke="#CC0000" stroke-width="0.5"/>
  <text x="105" y="735" text-anchor="end" font-family="sans-serif" font-size="10" fill="#CC0000">15.1mm</text>
  <text x="105" y="750" text-anchor="end" font-family="sans-serif" font-size="9" fill="#CC0000">total Z</text>

  <!-- Wall thickness -->
  <line x1="140" y1="580" x2="150" y2="580" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="145" y="575" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#CC0000">1.5mm</text>

  <!-- ============ VIEW 4: BACK VIEW (bottom-right) ============ -->
  <text x="900" y="555" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Back View</text>

  <!-- Back outline - super rounded -->
  <rect x="745" y="580" width="310" height="300" rx="62" ry="62" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Flat back surface indicator -->
  <rect x="785" y="620" width="230" height="220" rx="30" ry="30" fill="none" stroke="#BBB" stroke-width="0.3" stroke-dasharray="3,3"/>
  <text x="900" y="700" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#999">Flat back surface</text>

  <!-- Optional clip mount point -->
  <rect x="870" y="740" width="60" height="30" rx="4" ry="4" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>
  <circle cx="885" cy="755" r="3" fill="none" stroke="black" stroke-width="0.3"/>
  <circle cx="915" cy="755" r="3" fill="none" stroke="black" stroke-width="0.3"/>
  <text x="900" y="785" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#555">Optional clip mount</text>
  <text x="900" y="796" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#555">(2x M2 threaded inserts)</text>

  <!-- USB-C cutout at bottom -->
  <rect x="886" y="874" width="28" height="8" rx="3" fill="white" stroke="black" stroke-width="0.5"/>
  <text x="900" y="868" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">USB-C</text>
  <text x="900" y="856" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#CC0000">9.34 x 3.66mm</text>

  <!-- Side buttons visible from back (right side) -->
  <rect x="1053" y="640" width="8" height="30" rx="3" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <rect x="1053" y="685" width="8" height="30" rx="3" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <rect x="1053" y="730" width="8" height="30" rx="3" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <text x="1070" y="660" font-family="sans-serif" font-size="7" fill="#333">Buttons</text>

  <!-- Vent holes (optional) -->
  <circle cx="830" cy="650" r="2" fill="white" stroke="black" stroke-width="0.3"/>
  <circle cx="840" cy="650" r="2" fill="white" stroke="black" stroke-width="0.3"/>
  <circle cx="850" cy="650" r="2" fill="white" stroke="black" stroke-width="0.3"/>
  <text x="840" y="640" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#888">Vent</text>
</svg>