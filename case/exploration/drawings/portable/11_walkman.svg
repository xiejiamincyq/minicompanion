<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="sans-serif" font-size="10">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#CC0000" stroke="none"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#CC0000" stroke="none"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="white"/>

  <!-- Grid lines -->
  <line x1="400" y1="0" x2="400" y2="900" stroke="#EEE" stroke-width="0.5"/>
  <line x1="800" y1="0" x2="800" y2="900" stroke="#EEE" stroke-width="0.5"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#EEE" stroke-width="0.5"/>

  <!-- Title -->
  <text x="600" y="24" text-anchor="middle" font-size="14" font-weight="bold">Design 11: Walkman — 100×65×18mm Landscape Cassette Player</text>

  <!-- ========== 1. FRONT VIEW (top-left) ========== -->
  <text x="200" y="55" text-anchor="middle" font-size="11" font-weight="bold">Front View</text>

  <!-- Shell body -->
  <rect x="100" y="75" width="200" height="130" rx="6" ry="6" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Cassette door frame -->
  <rect x="115" y="82" width="170" height="80" rx="3" ry="3" fill="none" stroke="black" stroke-width="0.5"/>
  <rect x="118" y="85" width="164" height="74" rx="2" ry="2" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>

  <!-- Screen inside cassette door -->
  <rect x="138" y="92" width="124" height="62" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="200" y="126" text-anchor="middle" font-size="9" fill="#336">40.80×30.60 active</text>

  <!-- Cassette reel circles (decorative) -->
  <circle cx="150" cy="108" r="8" fill="none" stroke="#999" stroke-width="0.5"/>
  <circle cx="250" cy="108" r="8" fill="none" stroke="#999" stroke-width="0.5"/>

  <!-- Transport buttons below cassette door -->
  <rect x="140" y="172" width="30" height="22" rx="3" ry="3" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
  <text x="155" y="187" text-anchor="middle" font-size="11">⏮</text>

  <rect x="185" y="172" width="30" height="22" rx="3" ry="3" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
  <text x="200" y="187" text-anchor="middle" font-size="11">✓</text>

  <rect x="230" y="172" width="30" height="22" rx="3" ry="3" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
  <text x="245" y="187" text-anchor="middle" font-size="11">⏭</text>

  <!-- Dimension: width -->
  <line x1="100" y1="220" x2="300" y2="220" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="200" y="232" text-anchor="middle" font-size="9" fill="#CC0000">100mm</text>

  <!-- Dimension: height -->
  <line x1="315" y1="75" x2="315" y2="205" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="330" y="145" font-size="9" fill="#CC0000">65mm</text>

  <!-- Button labels -->
  <text x="155" y="202" text-anchor="middle" font-size="9">Prev</text>
  <text x="200" y="202" text-anchor="middle" font-size="9">OK</text>
  <text x="245" y="202" text-anchor="middle" font-size="9">Next</text>

  <!-- ========== 2. SIDE PROFILE (top-center) ========== -->
  <text x="600" y="55" text-anchor="middle" font-size="11" font-weight="bold">Side Profile</text>

  <!-- Main body side -->
  <rect x="560" y="95" width="36" height="130" rx="3" ry="3" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Belt clip protruding from back -->
  <rect x="596" y="110" width="12" height="60" rx="2" ry="2" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
  <rect x="596" y="105" width="14" height="12" rx="1" ry="1" fill="#B0B0B0" stroke="black" stroke-width="0.5"/>

  <!-- Screen edge visible -->
  <rect x="560" y="105" width="3" height="70" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>

  <!-- Button bumps -->
  <circle cx="560" cy="195" r="3" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>

  <!-- Dimension: depth -->
  <line x1="555" y1="240" x2="609" y2="240" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="582" y="252" text-anchor="middle" font-size="9" fill="#CC0000">18mm</text>

  <!-- Dimension: height -->
  <line x1="540" y1="95" x2="540" y2="225" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="530" y="165" font-size="9" fill="#CC0000" text-anchor="end">65mm</text>

  <!-- Belt clip label -->
  <line x1="612" y1="135" x2="645" y2="120" stroke="#666" stroke-width="0.5"/>
  <text x="647" y="123" font-size="9">Belt clip</text>

  <!-- ========== 3. BACK VIEW (top-right) ========== -->
  <text x="1000" y="55" text-anchor="middle" font-size="11" font-weight="bold">Back View</text>

  <!-- Shell back -->
  <rect x="900" y="75" width="200" height="130" rx="6" ry="6" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Belt clip -->
  <rect x="975" y="90" width="50" height="80" rx="3" ry="3" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
  <rect x="980" y="95" width="40" height="70" rx="2" ry="2" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="1000" y="135" text-anchor="middle" font-size="9">Belt Clip</text>

  <!-- Battery door -->
  <rect x="910" y="85" width="55" height="45" rx="2" ry="2" fill="#DDD" stroke="black" stroke-width="0.5"/>
  <text x="937" y="112" text-anchor="middle" font-size="9">Battery</text>
  <text x="937" y="122" text-anchor="middle" font-size="9">Door</text>

  <!-- USB-C port -->
  <rect x="988" y="195" width="24" height="8" rx="2" ry="2" fill="#888" stroke="black" stroke-width="0.5"/>
  <text x="1000" y="215" text-anchor="middle" font-size="9">USB-C</text>

  <!-- Screw holes -->
  <circle cx="915" cy="190" r="3" fill="none" stroke="black" stroke-width="0.5"/>
  <circle cx="1085" cy="190" r="3" fill="none" stroke="black" stroke-width="0.5"/>
  <circle cx="915" cy="85" r="3" fill="none" stroke="black" stroke-width="0.5"/>
  <circle cx="1085" cy="85" r="3" fill="none" stroke="black" stroke-width="0.5"/>

  <!-- ========== 4. TOP-DOWN VIEW (bottom-left) ========== -->
  <text x="200" y="475" text-anchor="middle" font-size="11" font-weight="bold">Top-Down View</text>

  <!-- Shell outline from top -->
  <rect x="100" y="500" width="200" height="72" rx="6" ry="6" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Volume slider on top edge -->
  <rect x="130" y="496" width="40" height="8" rx="2" ry="2" fill="#BBB" stroke="black" stroke-width="0.5"/>
  <rect x="140" y="494" width="10" height="12" rx="2" ry="2" fill="#999" stroke="black" stroke-width="0.5"/>

  <!-- Screen outline from top (dashed — internal) -->
  <rect x="138" y="515" width="124" height="6" fill="#B0D4F1" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>

  <!-- Belt clip from top -->
  <rect x="175" y="572" width="50" height="12" rx="2" ry="2" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>

  <!-- Dimension: width -->
  <line x1="100" y1="600" x2="300" y2="600" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="200" y="612" text-anchor="middle" font-size="9" fill="#CC0000">100mm</text>

  <!-- Dimension: depth -->
  <line x1="315" y1="500" x2="315" y2="572" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="330" y="540" font-size="9" fill="#CC0000">18mm</text>

  <!-- Volume slider label -->
  <line x1="150" y1="494" x2="150" y2="480" stroke="#666" stroke-width="0.5"/>
  <text x="150" y="476" text-anchor="middle" font-size="9">Volume/Wake Slider</text>

  <!-- ========== 5. CROSS-SECTION (bottom-center) ========== -->
  <text x="600" y="475" text-anchor="middle" font-size="11" font-weight="bold">Cross-Section (Center Cut)</text>

  <!-- Outer shell with hatch -->
  <!-- Left wall -->
  <rect x="505" y="500" width="8" height="130" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  <!-- Right wall -->
  <rect x="687" y="500" width="8" height="130" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  <!-- Top wall -->
  <rect x="505" y="500" width="190" height="6" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  <!-- Bottom wall -->
  <rect x="505" y="624" width="190" height="6" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>

  <!-- Z-stack layers inside -->
  <!-- Display module -->
  <rect x="520" y="508" width="160" height="30" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="600" y="527" text-anchor="middle" font-size="9">Display Module (3.2mm)</text>

  <!-- Air gap -->
  <rect x="520" y="538" width="160" height="8" fill="white" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="600" y="545" text-anchor="middle" font-size="7">gap</text>

  <!-- PCB -->
  <rect x="525" y="546" width="150" height="18" fill="#90C695" stroke="black" stroke-width="0.5"/>
  <text x="600" y="559" text-anchor="middle" font-size="9">PCB 45×40×1.6mm</text>

  <!-- Air gap -->
  <rect x="520" y="564" width="160" height="6" fill="white" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Battery -->
  <rect x="530" y="570" width="140" height="48" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
  <text x="600" y="598" text-anchor="middle" font-size="9">LiPo Battery 30×35×5mm</text>

  <!-- Total Z-stack dimension -->
  <line x1="710" y1="508" x2="710" y2="618" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="725" y="567" font-size="9" fill="#CC0000">15.1mm</text>

  <!-- Shell dimension -->
  <line x1="490" y1="500" x2="490" y2="630" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="480" y="570" font-size="9" fill="#CC0000" text-anchor="end">18mm</text>

  <!-- ========== 6. DETAIL: BELT CLIP HINGE (bottom-right) ========== -->
  <text x="1000" y="475" text-anchor="middle" font-size="11" font-weight="bold">Detail: Belt Clip Hinge</text>

  <!-- Enlarged belt clip section -->
  <!-- Shell back wall -->
  <rect x="900" y="510" width="80" height="10" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>

  <!-- Hinge pivot -->
  <circle cx="940" cy="525" r="8" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
  <circle cx="940" cy="525" r="2" fill="#888" stroke="black" stroke-width="0.5"/>

  <!-- Hinge arm (upper, attached to shell) -->
  <rect x="930" y="518" width="30" height="5" rx="1" ry="1" fill="#B0B0B0" stroke="black" stroke-width="0.5"/>

  <!-- Clip body -->
  <path d="M940,530 L1070,530 L1070,545 Q1065,555 1055,555 L940,555 Z" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>

  <!-- Spring detent -->
  <path d="M955,530 Q958,525 961,530" fill="none" stroke="black" stroke-width="0.5"/>
  <path d="M965,530 Q968,525 971,530" fill="none" stroke="black" stroke-width="0.5"/>

  <!-- Clip opening gap -->
  <line x1="1070" y1="530" x2="1070" y2="555" stroke="black" stroke-width="0.5"/>

  <!-- Labels -->
  <line x1="940" y1="525" x2="920" y2="560" stroke="#666" stroke-width="0.5"/>
  <text x="905" y="570" font-size="9" text-anchor="middle">Pivot pin</text>

  <line x1="963" y1="525" x2="980" y2="510" stroke="#666" stroke-width="0.5"/>
  <text x="995" y="508" font-size="9">Spring detent</text>

  <line x1="1060" y1="555" x2="1060" y2="570" stroke="#666" stroke-width="0.5"/>
  <text x="1060" y="580" text-anchor="middle" font-size="9">Clip hook</text>

  <!-- Open angle indicator -->
  <path d="M940,525 L940,500" stroke="#CC0000" stroke-width="0.5" stroke-dasharray="3,2"/>
  <path d="M940,525 L960,508" stroke="#CC0000" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="955" y="500" font-size="9" fill="#CC0000">30°</text>

  <!-- Dimension: clip length -->
  <line x1="940" y1="565" x2="1070" y2="565" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="1005" y="577" text-anchor="middle" font-size="9" fill="#CC0000">~45mm</text>

  <!-- Scale note -->
  <text x="1000" y="605" text-anchor="middle" font-size="9" fill="#666">Scale: 2×</text>

  <!-- Legend -->
  <rect x="870" y="650" width="12" height="12" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="888" y="660" font-size="9">Display</text>
  <rect x="940" y="650" width="12" height="12" fill="#90C695" stroke="black" stroke-width="0.5"/>
  <text x="958" y="660" font-size="9">PCB</text>
  <rect x="990" y="650" width="12" height="12" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
  <text x="1008" y="660" font-size="9">Battery</text>
  <rect x="1060" y="650" width="12" height="12" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  <text x="1078" y="660" font-size="9">Shell wall</text>
</svg>