<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#CC0000" stroke="none"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#CC0000" stroke="none"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="white"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Design 15: Communicator — 65×50×12mm Chevron/Shield Shape</text>

  <!-- ==================== FRONT VIEW (top-left) ==================== -->
  <text x="200" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Front View</text>

  <!-- Chevron/shield shape pointing up: wide at top-middle, narrows to point at bottom -->
  <path d="M200,80 L300,130 L300,280 L260,330 L200,355 L140,330 L100,280 L100,130 Z"
        fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Screen in widest area -->
  <rect x="132" y="120" width="136" height="110" rx="4" ry="4" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="200" y="180" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Screen</text>

  <!-- 3 dot buttons on lower pointed section -->
  <circle cx="175" cy="275" r="8" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
  <circle cx="200" cy="290" r="8" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
  <circle cx="225" cy="275" r="8" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
  <text x="200" y="315" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">3 buttons</text>

  <!-- Chevron accent line -->
  <path d="M200,88 L290,135" fill="none" stroke="#999" stroke-width="0.5"/>
  <path d="M200,88 L110,135" fill="none" stroke="#999" stroke-width="0.5"/>

  <!-- Dimension: width 50mm at widest -->
  <line x1="100" y1="380" x2="300" y2="380" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="200" y="393" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">50mm (widest)</text>

  <!-- Dimension: height 65mm -->
  <line x1="80" y1="80" x2="80" y2="355" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="70" y="220" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000" transform="rotate(-90 70 220)">65mm</text>

  <!-- ==================== SIDE PROFILE (top-center) ==================== -->
  <text x="600" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Side Profile</text>

  <!-- Ultra-thin 12mm profile × 65mm tall -->
  <path d="M578,80 L622,80 L622,330 L610,350 L590,350 L578,330 Z"
        fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Screen surface -->
  <line x1="578" y1="110" x2="578" y2="230" stroke="#4488AA" stroke-width="1"/>
  <text x="565" y="170" text-anchor="end" font-family="sans-serif" font-size="9" fill="#333">Screen</text>

  <!-- USB-C at bottom -->
  <rect x="590" y="345" width="20" height="5" rx="2" ry="2" fill="#666" stroke="black" stroke-width="0.5"/>
  <text x="600" y="365" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">USB-C</text>

  <!-- Dimension: 12mm thickness -->
  <line x1="578" y1="380" x2="622" y2="380" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="600" y="393" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">12mm</text>

  <!-- Dimension: 65mm height -->
  <line x1="560" y1="80" x2="560" y2="350" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="550" y="218" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000" transform="rotate(-90 550 218)">65mm</text>

  <!-- ==================== BACK VIEW (top-right) ==================== -->
  <text x="1000" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Back View</text>

  <!-- Chevron outline (mirrored) -->
  <path d="M1000,80 L1100,130 L1100,280 L1060,330 L1000,355 L940,330 L900,280 L900,130 Z"
        fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Pin clip mount -->
  <rect x="960" y="150" width="80" height="30" rx="3" ry="3" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <text x="1000" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Pin clip</text>

  <!-- Pin bar -->
  <line x1="975" y1="180" x2="1025" y2="180" stroke="black" stroke-width="1.5"/>
  <text x="1000" y="195" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">Spring bar</text>

  <!-- Magnet mount pad -->
  <circle cx="1000" cy="240" r="25" fill="#B0B0B0" stroke="black" stroke-width="0.5"/>
  <circle cx="1000" cy="240" r="15" fill="#A0A0A0" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="1000" y="244" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Magnet</text>
  <text x="1000" y="280" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">mount pad</text>

  <!-- ==================== TOP-DOWN VIEW (bottom-left) ==================== -->
  <text x="200" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Top-Down View</text>

  <!-- Top of chevron: pointed tip visible, 50mm wide × 12mm deep -->
  <path d="M200,475 L280,500 L280,530 L120,530 L120,500 Z"
        fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Pointed tip detail -->
  <text x="200" y="495" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Chevron tip</text>

  <!-- Shell curvature hint -->
  <path d="M140,505 Q200,498 260,505" fill="none" stroke="#999" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="200" y="520" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">Slight dome</text>

  <!-- Dimensions -->
  <line x1="120" y1="550" x2="280" y2="550" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="200" y="563" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">50mm</text>

  <line x1="100" y1="475" x2="100" y2="530" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="90" y="505" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000" transform="rotate(-90 90 505)">12mm</text>

  <!-- ==================== CROSS-SECTION (bottom-center) ==================== -->
  <text x="600" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Cross-Section (Thin Z-Stack)</text>

  <!-- Outer shell cross-section -->
  <rect x="510" y="485" width="180" height="160" rx="4" ry="4" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  <!-- Inner cavity -->
  <rect x="518" y="493" width="164" height="144" rx="2" ry="2" fill="white" stroke="black" stroke-width="0.5"/>

  <!-- Display module -->
  <rect x="525" y="498" width="150" height="28" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="600" y="516" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Display (2.0mm)</text>

  <!-- Gap -->
  <rect x="525" y="526" width="150" height="7" fill="#F8F8F8" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="600" y="533" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#999">Gap</text>

  <!-- PCB -->
  <rect x="525" y="533" width="150" height="22" fill="#90C695" stroke="black" stroke-width="0.5"/>
  <text x="600" y="548" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">PCB (1.6mm)</text>

  <!-- Components -->
  <rect x="525" y="555" width="150" height="24" fill="#F0F0F0" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="600" y="571" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">Components (2.5mm)</text>

  <!-- Slim battery 3.5mm -->
  <rect x="525" y="579" width="150" height="46" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
  <text x="600" y="606" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Slim Battery (3.5mm)</text>

  <!-- Bottom shell -->
  <rect x="525" y="625" width="150" height="8" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>

  <!-- Z-stack dimension -->
  <line x1="700" y1="485" x2="700" y2="645" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="720" y="565" font-family="sans-serif" font-size="9" fill="#CC0000">12mm total</text>

  <!-- Battery callout -->
  <line x1="525" y1="600" x2="505" y2="615" stroke="#CC0000" stroke-width="0.5"/>
  <text x="490" y="625" text-anchor="end" font-family="sans-serif" font-size="8" fill="#CC0000">3.5mm slim LiPo</text>

  <!-- ==================== DETAIL CLOSEUP (bottom-right) ==================== -->
  <text x="1000" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Detail — Pin/Magnet Mount</text>

  <!-- Back panel section (enlarged) -->
  <rect x="910" y="490" width="180" height="100" rx="5" ry="5" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Pin clip mechanism -->
  <text x="960" y="510" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">Pin Clip:</text>

  <!-- Pin housing -->
  <rect x="920" y="520" width="80" height="20" rx="2" ry="2" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <!-- Pin bar (the actual pin) -->
  <line x1="935" y1="540" x2="985" y2="540" stroke="black" stroke-width="1.5"/>
  <!-- Pin clasp -->
  <path d="M935,540 L935,555 L985,555 L985,550" fill="none" stroke="black" stroke-width="0.5"/>
  <!-- Spring -->
  <path d="M940,540 L943,545 L947,535 L951,545 L955,535 L959,545 L963,535 L967,545 L970,540" fill="none" stroke="#888" stroke-width="0.5"/>
  <text x="960" y="570" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">Spring-loaded clasp</text>

  <!-- Magnet mount detail -->
  <text x="1060" y="510" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">Magnet:</text>

  <!-- Magnet recess -->
  <rect x="1030" y="520" width="60" height="25" rx="3" ry="3" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
  <!-- Magnet disc -->
  <circle cx="1060" cy="532" r="10" fill="#808080" stroke="black" stroke-width="0.5"/>
  <text x="1060" y="536" text-anchor="middle" font-family="sans-serif" font-size="7" fill="white">N52</text>
  <text x="1060" y="560" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">∅20mm neodymium</text>

  <!-- Dimension lines -->
  <line x1="1030" y1="575" x2="1090" y2="575" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="1060" y="588" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#CC0000">20mm pad</text>

  <!-- Mount modes note -->
  <text x="1000" y="620" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Dual mount: pin for fabric, magnet for metal</text>
  <text x="1000" y="635" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">Pin folds flush when using magnet mount</text>

  <!-- Cross-section of mount depth -->
  <rect x="920" y="650" width="160" height="40" rx="2" ry="2" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  <rect x="928" y="655" width="144" height="30" fill="white" stroke="black" stroke-width="0.5"/>
  <!-- Magnet recessed in shell -->
  <circle cx="960" cy="670" r="8" fill="#808080" stroke="black" stroke-width="0.5"/>
  <text x="960" y="673" text-anchor="middle" font-family="sans-serif" font-size="7" fill="white">Mag</text>
  <!-- Pin housing recessed -->
  <rect x="1000" y="660" width="50" height="15" rx="2" ry="2" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <text x="1025" y="672" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#333">Pin hinge</text>

  <line x1="905" y1="650" x2="905" y2="690" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="895" y="673" text-anchor="end" font-family="sans-serif" font-size="8" fill="#CC0000">3mm</text>
</svg>