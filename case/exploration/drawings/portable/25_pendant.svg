<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <title>Design 25: Pendant — Technical Illustration</title>

  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#CC0000"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#CC0000"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="white"/>
  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Design 25: Pendant — 45×45×12mm Octagonal</text>

  <!-- ============ VIEW 1: FRONT VIEW (top-left) ============ -->
  <text x="200" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Front View</text>

  <!-- Regular octagon — 45mm across flats, centered at 200,250 -->
  <!-- Octagon vertices: for 45mm across flats, circumradius ~120px scaled -->
  <polygon points="200,95 278,125 308,200 278,278 200,308 122,278 92,200 122,125" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Screen centered, tight bezels -->
  <rect x="140" y="150" width="120" height="100" rx="3" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="200" y="200" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Active Area</text>
  <text x="200" y="212" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">40.80×30.60mm</text>

  <!-- Bail/loop at top vertex -->
  <ellipse cx="200" cy="82" rx="10" ry="14" fill="white" stroke="black" stroke-width="0.5"/>
  <ellipse cx="200" cy="82" rx="5" ry="8" fill="white" stroke="black" stroke-width="0.5"/>
  <text x="225" y="78" font-family="sans-serif" font-size="8" fill="#333">Bail loop</text>

  <!-- 4 tiny buttons along bottom edge -->
  <rect x="148" y="280" width="18" height="8" rx="2" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <rect x="172" y="286" width="18" height="8" rx="2" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <rect x="210" y="286" width="18" height="8" rx="2" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <rect x="234" y="280" width="18" height="8" rx="2" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <text x="200" y="306" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">4 buttons</text>

  <!-- USB-C at bottom vertex area -->
  <rect x="183" y="300" width="34" height="8" rx="2" fill="white" stroke="black" stroke-width="0.5"/>
  <text x="200" y="322" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">USB-C</text>

  <!-- Dimension: 45mm across flats -->
  <line x1="92" y1="200" x2="308" y2="200" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="200" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CC0000">45.0mm (across flats)</text>

  <!-- Dimension: height 45mm -->
  <line x1="330" y1="95" x2="330" y2="308" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="320" y1="95" x2="340" y2="95" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="320" y1="308" x2="340" y2="308" stroke="#CC0000" stroke-width="0.5"/>
  <text x="350" y="205" text-anchor="start" font-family="sans-serif" font-size="10" fill="#CC0000">45.0mm</text>

  <!-- ============ VIEW 2: SIDE PROFILE (top-center) ============ -->
  <text x="560" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Side Profile</text>

  <!-- Thin 12mm with beveled/chamfered edges -->
  <!-- Side is a hexagonal cross-section due to chamfers -->
  <path d="M545,100 L575,100 L580,108 L580,302 L575,310 L545,310 L540,302 L540,108 Z" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Screen edge -->
  <line x1="540" y1="150" x2="540" y2="260" stroke="#4488CC" stroke-width="1.5"/>
  <text x="530" y="205" text-anchor="end" font-family="sans-serif" font-size="8" fill="#4488CC">Screen</text>

  <!-- Chamfer callout -->
  <line x1="545" y1="100" x2="540" y2="108" stroke="black" stroke-width="0.5"/>
  <line x1="520" y1="105" x2="540" y2="105" stroke="#555" stroke-width="0.3"/>
  <text x="515" y="108" text-anchor="end" font-family="sans-serif" font-size="8" fill="#555">Chamfer</text>

  <!-- Bail from side -->
  <path d="M555,100 Q555,75 560,70 Q565,65 560,70 Q555,75 555,100" fill="none" stroke="black" stroke-width="0.5"/>
  <ellipse cx="560" cy="85" rx="3" ry="10" fill="white" stroke="black" stroke-width="0.5"/>
  <text x="575" y="83" font-family="sans-serif" font-size="8" fill="#333">Bail</text>

  <!-- USB-C bottom -->
  <rect x="553" y="307" width="9" height="4" rx="1" fill="white" stroke="black" stroke-width="0.5"/>

  <!-- Dimension: depth 12mm -->
  <line x1="540" y1="330" x2="580" y2="330" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="540" y1="320" x2="540" y2="340" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="580" y1="320" x2="580" y2="340" stroke="#CC0000" stroke-width="0.5"/>
  <text x="560" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CC0000">12.0mm</text>

  <!-- ============ VIEW 3: BACK VIEW (top-right) ============ -->
  <text x="900" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Back View</text>

  <!-- Octagonal back -->
  <polygon points="900,95 978,125 1008,200 978,278 900,308 822,278 792,200 822,125" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Flat back — no battery door, sealed -->
  <text x="900" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555">Flat sealed back</text>

  <!-- Chain attachment bail -->
  <ellipse cx="900" cy="82" rx="10" ry="14" fill="white" stroke="black" stroke-width="0.5"/>
  <ellipse cx="900" cy="82" rx="5" ry="8" fill="white" stroke="black" stroke-width="0.5"/>

  <!-- Chain links -->
  <ellipse cx="900" cy="62" rx="6" ry="4" fill="none" stroke="#999" stroke-width="0.5"/>
  <ellipse cx="900" cy="52" rx="4" ry="6" fill="none" stroke="#999" stroke-width="0.5"/>
  <text x="920" y="55" font-family="sans-serif" font-size="8" fill="#555">Chain</text>

  <!-- Internal layout (hidden lines) -->
  <rect x="855" y="150" width="90" height="80" rx="3" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="3,2"/>
  <text x="900" y="190" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#888">PCB (hidden)</text>

  <rect x="860" y="235" width="80" height="45" rx="3" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="3,2"/>
  <text x="900" y="260" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#888">Battery (hidden)</text>

  <!-- USB-C -->
  <rect x="883" y="302" width="34" height="8" rx="2" fill="white" stroke="black" stroke-width="0.5"/>

  <!-- ============ VIEW 4: TOP-DOWN VIEW (bottom-left) ============ -->
  <text x="200" y="485" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Top-Down View</text>

  <!-- Octagonal top edge — showing beveled profile -->
  <!-- Outer octagon edge -->
  <path d="M140,540 L260,540 L270,545 L270,565 L260,570 L140,570 L130,565 L130,545 Z" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
  <!-- Inner flat top -->
  <rect x="145" y="545" width="110" height="20" fill="#DDD" stroke="black" stroke-width="0.3"/>
  <text x="200" y="558" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#555">Flat top with chamfer</text>

  <!-- Bail/loop at top vertex -->
  <ellipse cx="200" cy="530" rx="12" ry="8" fill="white" stroke="black" stroke-width="0.5"/>
  <text x="200" y="520" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">8mm opening</text>

  <!-- Chamfer visible -->
  <text x="275" y="547" font-family="sans-serif" font-size="7" fill="#555">Chamfer</text>
  <line x1="270" y1="545" x2="260" y2="540" stroke="#555" stroke-width="0.3"/>

  <!-- Dimensions -->
  <line x1="130" y1="590" x2="270" y2="590" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="130" y1="580" x2="130" y2="600" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="270" y1="580" x2="270" y2="600" stroke="#CC0000" stroke-width="0.5"/>
  <text x="200" y="608" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CC0000">45.0mm</text>

  <line x1="290" y1="540" x2="290" y2="570" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="280" y1="540" x2="300" y2="540" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="280" y1="570" x2="300" y2="570" stroke="#CC0000" stroke-width="0.5"/>
  <text x="310" y="558" font-family="sans-serif" font-size="10" fill="#CC0000">12.0mm</text>

  <!-- ============ VIEW 5: CROSS-SECTION (bottom-center) ============ -->
  <text x="600" y="485" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Cross-Section (A-A)</text>

  <!-- Thin Z-stack — 12mm total -->
  <!-- Front wall with chamfer 1.2mm -->
  <path d="M490,515 L500,510 L700,510 L710,515 L710,524 L490,524 Z" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  <text x="720" y="520" font-family="sans-serif" font-size="8" fill="#606060">Front wall 1.2mm (chamfered)</text>

  <!-- Gap -->
  <rect x="490" y="524" width="220" height="4" fill="white" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>

  <!-- Display 2.0mm -->
  <rect x="500" y="528" width="200" height="22" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="600" y="543" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Display (2.0mm)</text>

  <!-- Gap 0.5mm -->
  <rect x="490" y="550" width="220" height="6" fill="#F5F5F5" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>

  <!-- PCB 1.6mm -->
  <rect x="490" y="556" width="220" height="18" fill="#90C695" stroke="black" stroke-width="0.5"/>
  <text x="600" y="569" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">PCB (1.6mm)</text>

  <!-- Gap 0.5mm -->
  <rect x="490" y="574" width="220" height="6" fill="#F5F5F5" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>

  <!-- Battery 4.0mm (slightly thinner for 12mm total) -->
  <rect x="505" y="580" width="190" height="44" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
  <text x="600" y="606" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">LiPo Battery (4.0mm)</text>

  <!-- Gap -->
  <rect x="490" y="624" width="220" height="4" fill="white" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>

  <!-- Back wall with chamfer 1.2mm -->
  <path d="M490,628 L710,628 L710,640 L700,644 L500,644 L490,640 Z" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
  <text x="720" y="639" font-family="sans-serif" font-size="8" fill="#606060">Back wall 1.2mm (chamfered)</text>

  <!-- Total dimension -->
  <line x1="475" y1="510" x2="475" y2="644" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="465" y1="510" x2="485" y2="510" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="465" y1="644" x2="485" y2="644" stroke="#CC0000" stroke-width="0.5"/>
  <text x="460" y="580" text-anchor="end" font-family="sans-serif" font-size="10" fill="#CC0000">12.0mm</text>

  <!-- ============ VIEW 6: DETAIL — Bail Loop + Beveled Edge (bottom-right) ============ -->
  <text x="960" y="485" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Detail — Bail Loop + Bevel Profile</text>

  <!-- Zoomed bail loop -->
  <text x="930" y="515" font-family="sans-serif" font-size="9" font-weight="bold" fill="#333">Bail Loop Detail</text>

  <!-- Octagon vertex section -->
  <path d="M880,570 L920,535 L960,535 L1000,570" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Bail loop -->
  <path d="M920,535 Q920,500 940,490 Q960,480 960,500 Q960,535 960,535" fill="none" stroke="black" stroke-width="1"/>
  <!-- Inner opening -->
  <path d="M928,535 Q928,508 940,500 Q952,492 952,508 Q952,535 952,535" fill="white" stroke="black" stroke-width="0.5"/>

  <!-- Chain going through -->
  <ellipse cx="940" cy="488" rx="8" ry="5" fill="none" stroke="#999" stroke-width="0.8"/>
  <text x="960" y="485" font-family="sans-serif" font-size="8" fill="#555">Chain</text>

  <!-- Dimension: bail opening 8mm -->
  <line x1="928" y1="510" x2="952" y2="510" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="940" y="505" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#CC0000">8mm</text>

  <!-- Reinforcement callout -->
  <line x1="925" y1="530" x2="900" y2="545" stroke="#555" stroke-width="0.3"/>
  <text x="880" y="552" font-family="sans-serif" font-size="8" fill="#555">Reinforced</text>
  <text x="880" y="562" font-family="sans-serif" font-size="8" fill="#555">bail area</text>

  <!-- Beveled edge profile (cross-section of edge) -->
  <text x="940" y="600" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#333">Edge Bevel Profile</text>

  <!-- Zoomed cross-section of chamfered edge -->
  <path d="M900,620 L900,700 L910,710 L970,710 L980,700 L980,620 L970,610 L910,610 Z" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

  <!-- Chamfer lines highlighted -->
  <line x1="900" y1="620" x2="910" y2="610" stroke="#CC0000" stroke-width="0.8"/>
  <line x1="900" y1="700" x2="910" y2="710" stroke="#CC0000" stroke-width="0.8"/>
  <line x1="980" y1="620" x2="970" y2="610" stroke="#CC0000" stroke-width="0.8"/>
  <line x1="980" y1="700" x2="970" y2="710" stroke="#CC0000" stroke-width="0.8"/>

  <!-- Wall hatching -->
  <rect x="902" y="612" width="6" height="96" fill="url(#hatch)" stroke="black" stroke-width="0.3"/>
  <rect x="972" y="612" width="6" height="96" fill="url(#hatch)" stroke="black" stroke-width="0.3"/>

  <!-- Internal layers hint -->
  <rect x="910" y="625" width="60" height="12" fill="#B0D4F1" stroke="black" stroke-width="0.3"/>
  <rect x="910" y="645" width="60" height="10" fill="#90C695" stroke="black" stroke-width="0.3"/>
  <rect x="910" y="665" width="60" height="25" fill="#D4A84B" stroke="black" stroke-width="0.3"/>

  <!-- Chamfer dimension -->
  <line x1="895" y1="700" x2="895" y2="710" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="885" y="708" text-anchor="end" font-family="sans-serif" font-size="7" fill="#CC0000">1.5mm</text>

  <!-- 45° angle callout -->
  <text x="915" y="720" font-family="sans-serif" font-size="8" fill="#CC0000">45° chamfer</text>
</svg>