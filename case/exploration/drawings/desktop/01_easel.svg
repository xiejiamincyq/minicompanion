<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#CC0000"/>
    </marker>
    <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#CC0000"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="white"/>

  <!-- Title -->
  <text x="600" y="885" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">DESIGN 1: DESKTOP EASEL — Devotchi Desktop Case Concept</text>
  <line x1="50" y1="865" x2="1150" y2="865" stroke="#999" stroke-width="0.5"/>

  <!-- ======================== FRONT VIEW (top-left) ======================== -->
  <text x="220" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">FRONT VIEW</text>

  <!-- Slab outline tilted slightly for visual -->
  <rect x="80" y="50" width="280" height="190" rx="6" fill="#E0E0E0" stroke="#333" stroke-width="1"/>

  <!-- Screen window -->
  <rect x="120" y="65" width="200" height="110" rx="2" fill="#B0D4F1" stroke="#333" stroke-width="0.75"/>
  <text x="220" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#336">TFT LCD 40.8×30.6 active</text>
  <text x="220" y="138" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#336">51.8×36.2mm module</text>

  <!-- LED hole -->
  <circle cx="330" cy="72" r="3" fill="#FFD700" stroke="#333" stroke-width="0.5"/>
  <text x="342" y="75" font-family="sans-serif" font-size="7" fill="#666">LED 2mm</text>

  <!-- Buttons -->
  <circle cx="160" cy="210" r="8" fill="none" stroke="#333" stroke-width="0.75"/>
  <circle cx="200" cy="210" r="8" fill="none" stroke="#333" stroke-width="0.75"/>
  <circle cx="240" cy="210" r="8" fill="none" stroke="#333" stroke-width="0.75"/>
  <text x="200" y="232" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">3× buttons (5mm holes, 14mm spacing)</text>

  <!-- Dimension: width -->
  <line x1="80" y1="260" x2="360" y2="260" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="220" y="273" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">130mm</text>

  <!-- Dimension: height -->
  <line x1="380" y1="50" x2="380" y2="240" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="395" y="150" font-family="sans-serif" font-size="9" fill="#CC0000" transform="rotate(90,395,150)">85mm</text>

  <!-- ======================== SIDE PROFILE (top-right) ======================== -->
  <text x="780" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">SIDE PROFILE</text>

  <!-- Stand base -->
  <polygon points="620,330 870,330 870,320 620,320" fill="#D0D0D0" stroke="#333" stroke-width="0.75"/>
  <text x="745" y="345" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">rubber feet</text>

  <!-- Stand triangle -->
  <polygon points="660,320 850,320 850,140" fill="#E0E0E0" stroke="#333" stroke-width="1"/>

  <!-- Slab (tilted ~65° in groove) -->
  <polygon points="720,135 735,135 790,310 775,310" fill="#C8C8C8" stroke="#333" stroke-width="1"/>
  <!-- Screen inside slab -->
  <polygon points="723,155 733,155 770,270 760,270" fill="#B0D4F1" stroke="#4A7" stroke-width="0.5"/>

  <!-- 65° angle arc -->
  <path d="M 790,310 A 40,40 0 0,1 770,275" fill="none" stroke="#CC0000" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="800" y="295" font-family="sans-serif" font-size="9" fill="#CC0000">65°</text>

  <!-- Dimension: slab thickness -->
  <line x1="720" y1="125" x2="735" y2="125" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="728" y="118" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#CC0000">14mm</text>

  <!-- Dimension: stand height -->
  <line x1="890" y1="140" x2="890" y2="330" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="910" y="240" font-family="sans-serif" font-size="9" fill="#CC0000">~70mm</text>

  <!-- Dimension: base depth -->
  <line x1="620" y1="350" x2="870" y2="350" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="745" y="363" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">60mm base depth</text>

  <!-- Label -->
  <text x="745" y="380" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">Stand: 110mm wide (into page)</text>

  <!-- ======================== CROSS-SECTION (bottom-left) ======================== -->
  <text x="250" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">CROSS-SECTION (through slab center)</text>

  <!-- Cross-section box outline -->
  <rect x="60" y="430" width="380" height="180" fill="none" stroke="#333" stroke-width="0.5" stroke-dasharray="4,2"/>

  <!-- Front wall -->
  <rect x="80" y="460" width="30" height="120" fill="url(#hatch)" stroke="#606060" stroke-width="1"/>
  <text x="95" y="535" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#606060" transform="rotate(-90,95,535)">Front wall 2mm</text>

  <!-- Screen module -->
  <rect x="115" y="470" width="65" height="100" fill="#B0D4F1" stroke="#4682B4" stroke-width="0.75"/>
  <text x="148" y="520" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#336">Screen</text>
  <text x="148" y="530" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#336">4.5mm</text>

  <!-- Air gap -->
  <rect x="185" y="480" width="45" height="80" fill="#FFF8E0" stroke="#CCC" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="208" y="525" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">3mm gap</text>

  <!-- PCB -->
  <rect x="235" y="475" width="25" height="90" fill="#90C695" stroke="#2E7D32" stroke-width="0.75"/>
  <text x="248" y="520" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#1B5E20" transform="rotate(-90,248,520)">PCB 1.6mm</text>

  <!-- ESP32 chip on PCB -->
  <rect x="260" y="500" width="12" height="20" fill="#66BB6A" stroke="#2E7D32" stroke-width="0.5"/>
  <text x="266" y="513" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#1B5E20">ESP32</text>

  <!-- Back wall -->
  <rect x="280" y="460" width="30" height="120" fill="url(#hatch)" stroke="#606060" stroke-width="1"/>
  <text x="295" y="535" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#606060" transform="rotate(-90,295,535)">Back wall 2mm</text>

  <!-- Dimension lines for depth stack -->
  <line x1="80" y1="445" x2="110" y2="445" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="95" y="440" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#CC0000">2</text>

  <line x1="115" y1="445" x2="180" y2="445" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="148" y="440" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#CC0000">4.5</text>

  <line x1="185" y1="445" x2="230" y2="445" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="208" y="440" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#CC0000">3.0</text>

  <line x1="235" y1="445" x2="260" y2="445" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="248" y="440" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#CC0000">1.6</text>

  <line x1="280" y1="445" x2="310" y2="445" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="295" y="440" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#CC0000">2</text>

  <!-- Total depth -->
  <line x1="80" y1="600" x2="310" y2="600" stroke="#CC0000" stroke-width="0.75" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="195" y="615" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">14mm total depth</text>

  <!-- Labels -->
  <text x="95" y="640" font-family="sans-serif" font-size="8" fill="#666">← Front face (screen window)</text>
  <text x="250" y="640" font-family="sans-serif" font-size="8" fill="#666">Back face →</text>

  <!-- ======================== EXPLODED VIEW (bottom-right) ======================== -->
  <text x="830" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">EXPLODED COMPONENT VIEW</text>

  <!-- Front shell -->
  <rect x="700" y="440" width="260" height="40" rx="4" fill="#E0E0E0" stroke="#333" stroke-width="0.75"/>
  <rect x="740" y="447" width="160" height="26" rx="2" fill="none" stroke="#333" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="830" y="465" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Front Shell</text>
  <text x="920" y="455" font-family="sans-serif" font-size="7" fill="#666">screen window</text>

  <!-- Arrow -->
  <line x1="830" y1="485" x2="830" y2="505" stroke="#666" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Screen module -->
  <rect x="730" y="510" width="200" height="35" rx="2" fill="#B0D4F1" stroke="#4682B4" stroke-width="0.75"/>
  <text x="830" y="532" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#336">TFT LCD Module (51.8×36.2×4.5mm)</text>

  <!-- Arrow -->
  <line x1="830" y1="550" x2="830" y2="570" stroke="#666" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- PCB -->
  <rect x="740" y="575" width="180" height="35" rx="1" fill="#90C695" stroke="#2E7D32" stroke-width="0.75"/>
  <rect x="850" y="580" width="40" height="12" rx="1" fill="#66BB6A" stroke="#2E7D32" stroke-width="0.5"/>
  <text x="870" y="589" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#1B5E20">ESP32</text>
  <text x="810" y="597" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#1B5E20">PCB (45×40×1.6mm)</text>
  <!-- Button switches on PCB -->
  <circle cx="755" cy="600" r="3" fill="#FF8888" stroke="#CC0000" stroke-width="0.5"/>
  <circle cx="768" cy="600" r="3" fill="#FF8888" stroke="#CC0000" stroke-width="0.5"/>
  <circle cx="781" cy="600" r="3" fill="#FF8888" stroke="#CC0000" stroke-width="0.5"/>
  <text x="768" y="610" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#CC0000">buttons</text>

  <!-- USB-C on PCB edge -->
  <rect x="825" y="608" width="16" height="6" rx="1" fill="#C0C0C0" stroke="#666" stroke-width="0.5"/>
  <text x="833" y="622" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#666">USB-C</text>

  <!-- Arrow -->
  <line x1="830" y1="615" x2="830" y2="635" stroke="#666" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Back shell -->
  <rect x="700" y="640" width="260" height="40" rx="4" fill="#E0E0E0" stroke="#333" stroke-width="0.75"/>
  <text x="830" y="665" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Back Shell</text>
  <!-- Standoff bosses -->
  <circle cx="720" cy="655" r="5" fill="none" stroke="#333" stroke-width="0.5"/>
  <circle cx="720" cy="655" r="2" fill="#333"/>
  <circle cx="940" cy="655" r="5" fill="none" stroke="#333" stroke-width="0.5"/>
  <circle cx="940" cy="655" r="2" fill="#333"/>
  <circle cx="720" cy="672" r="5" fill="none" stroke="#333" stroke-width="0.5"/>
  <circle cx="720" cy="672" r="2" fill="#333"/>
  <circle cx="940" cy="672" r="5" fill="none" stroke="#333" stroke-width="0.5"/>
  <circle cx="940" cy="672" r="2" fill="#333"/>
  <text x="830" y="700" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#666">4× M2 standoff bosses (5mm OD)</text>

  <!-- Arrow to stand -->
  <line x1="830" y1="685" x2="830" y2="710" stroke="#666" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Stand -->
  <polygon points="730,720 930,720 930,750 870,750 830,770 790,750 730,750" fill="#D8D8D8" stroke="#333" stroke-width="0.75"/>
  <text x="830" y="742" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Easel Stand (separate piece)</text>
  <text x="830" y="788" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#666">Groove holds slab • 110mm wide • 4× rubber feet</text>

  <!-- Legend -->
  <rect x="60" y="700" width="12" height="12" fill="#B0D4F1" stroke="#333" stroke-width="0.5"/>
  <text x="78" y="710" font-family="sans-serif" font-size="8" fill="#333">Screen module</text>
  <rect x="60" y="718" width="12" height="12" fill="#90C695" stroke="#333" stroke-width="0.5"/>
  <text x="78" y="728" font-family="sans-serif" font-size="8" fill="#333">PCB</text>
  <rect x="60" y="736" width="12" height="12" fill="#E0E0E0" stroke="#333" stroke-width="0.5"/>
  <text x="78" y="746" font-family="sans-serif" font-size="8" fill="#333">Shell (case)</text>
  <rect x="60" y="754" width="12" height="12" fill="url(#hatch)" stroke="#333" stroke-width="0.5"/>
  <text x="78" y="764" font-family="sans-serif" font-size="8" fill="#333">Wall section (cross-cut)</text>
  <circle cx="66" cy="780" r="5" fill="#FF8888" stroke="#CC0000" stroke-width="0.5"/>
  <text x="78" y="783" font-family="sans-serif" font-size="8" fill="#333">Tactile buttons</text>
</svg>
