<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <title>Design 7: Zippo/Flip-Lid - Technical Illustration</title>

  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#CC0000"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#CC0000"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#606060"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#909090" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="white"/>

  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">Design 7: Zippo/Flip-Lid — 65mm x 45mm x 18mm</text>

  <!-- ==================== VIEW 1: Closed Front View (top-left) ==================== -->
  <g transform="translate(20, 50)">
    <text x="250" y="15" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">Closed Front View</text>

    <!-- Body (lower portion) -->
    <rect x="120" y="185" width="260" height="230" rx="6" ry="6" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

    <!-- Lid (upper portion, sitting on body) -->
    <rect x="115" y="35" width="270" height="155" rx="8" ry="8" fill="#D5D5D5" stroke="black" stroke-width="0.5"/>

    <!-- Lid seam line -->
    <line x1="115" y1="185" x2="385" y2="185" stroke="black" stroke-width="0.8"/>

    <!-- Decorative lid face - engraved rectangle -->
    <rect x="155" y="60" width="190" height="105" rx="3" ry="3" fill="none" stroke="black" stroke-width="0.3"/>
    <rect x="165" y="70" width="170" height="85" rx="2" ry="2" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="4,2"/>
    <!-- Decorative emblem -->
    <circle cx="250" cy="112" r="25" fill="none" stroke="black" stroke-width="0.4"/>
    <text x="250" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">DEVOTCHI</text>

    <!-- Lid thumb notch -->
    <ellipse cx="250" cy="180" rx="18" ry="4" fill="#C0C0C0" stroke="black" stroke-width="0.3"/>

    <!-- Buttons visible below lid line -->
    <rect x="145" y="330" width="55" height="28" rx="3" ry="3" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <rect x="222" y="330" width="55" height="28" rx="3" ry="3" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <rect x="300" y="330" width="55" height="28" rx="3" ry="3" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <text x="172" y="348" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">1</text>
    <text x="250" y="348" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">2</text>
    <text x="327" y="348" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">3</text>

    <!-- LED indicator -->
    <circle cx="250" cy="395" r="3" fill="#44FF44" stroke="black" stroke-width="0.3"/>
    <text x="260" y="398" font-family="sans-serif" font-size="8" fill="#666">LED</text>

    <!-- Dimension: width -->
    <line x1="115" y1="430" x2="385" y2="430" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="115" y1="420" x2="115" y2="435" stroke="#CC0000" stroke-width="0.3"/>
    <line x1="385" y1="420" x2="385" y2="435" stroke="#CC0000" stroke-width="0.3"/>
    <text x="250" y="445" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CC0000">45mm</text>

    <!-- Dimension: height -->
    <line x1="405" y1="35" x2="405" y2="415" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="385" y1="35" x2="412" y2="35" stroke="#CC0000" stroke-width="0.3"/>
    <line x1="385" y1="415" x2="412" y2="415" stroke="#CC0000" stroke-width="0.3"/>
    <text x="420" y="228" text-anchor="start" font-family="sans-serif" font-size="10" fill="#CC0000">65mm</text>
  </g>

  <!-- ==================== VIEW 2: Open View (top-right) ==================== -->
  <g transform="translate(600, 50)">
    <text x="280" y="15" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">Open View (lid flipped 180deg back)</text>

    <!-- Lid flipped behind body (shown as outline behind) -->
    <rect x="130" y="215" width="270" height="155" rx="8" ry="8" fill="#ECECEC" stroke="black" stroke-width="0.5" stroke-dasharray="4,2"/>
    <text x="265" y="295" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#999">Lid (flipped behind)</text>

    <!-- Hinge point -->
    <circle cx="265" cy="60" r="5" fill="#AAA" stroke="black" stroke-width="0.5"/>
    <text x="280" y="55" font-family="sans-serif" font-size="9" fill="#666">Hinge</text>

    <!-- Body -->
    <rect x="135" y="55" width="260" height="230" rx="6" ry="6" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

    <!-- Screen revealed -->
    <rect x="150" y="70" width="230" height="150" rx="3" ry="3" fill="#888" stroke="black" stroke-width="0.5"/>
    <rect x="158" y="78" width="214" height="134" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="265" y="150" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#336">Active Display</text>
    <text x="265" y="165" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#336">40.80 x 30.60mm</text>

    <!-- 3 buttons below screen -->
    <rect x="155" y="235" width="55" height="25" rx="3" ry="3" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <rect x="237" y="235" width="55" height="25" rx="3" ry="3" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <rect x="320" y="235" width="55" height="25" rx="3" ry="3" fill="#C0C0C0" stroke="black" stroke-width="0.5"/>
    <text x="182" y="252" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">BTN 1</text>
    <text x="265" y="252" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">BTN 2</text>
    <text x="347" y="252" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">BTN 3</text>

    <!-- Button spacing -->
    <line x1="182" y1="270" x2="265" y2="270" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="223" y="282" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CC0000">14mm</text>

    <!-- USB-C at bottom -->
    <rect x="238" y="282" width="54" height="5" rx="2" ry="2" fill="white" stroke="black" stroke-width="0.5"/>
    <text x="265" y="298" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">USB-C</text>

    <!-- Hinge connection arc -->
    <path d="M140,55 Q130,30 140,5 Q150,-15 265,-15 Q380,-15 390,5 Q400,30 390,55" fill="none" stroke="#999" stroke-width="0.4" stroke-dasharray="3,2"/>
    <text x="265" y="-5" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">Lid swing path</text>
  </g>

  <!-- ==================== VIEW 3: Side View Open (bottom-left) ==================== -->
  <g transform="translate(20, 500)">
    <text x="270" y="15" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">Side View (open position)</text>

    <!-- Body side -->
    <rect x="200" y="60" width="100" height="280" rx="4" ry="4" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

    <!-- Screen visible on front face -->
    <rect x="195" y="85" width="8" height="155" fill="#B0D4F1" stroke="black" stroke-width="0.4"/>
    <text x="185" y="165" text-anchor="end" font-family="sans-serif" font-size="9" fill="#336">Screen</text>

    <!-- Hinge at top -->
    <circle cx="200" cy="65" r="6" fill="#AAA" stroke="black" stroke-width="0.5"/>
    <text x="180" y="55" text-anchor="end" font-family="sans-serif" font-size="9" fill="#666">Hinge</text>

    <!-- Lid flipped back (180deg) -->
    <rect x="200" y="60" width="100" height="5" rx="2" ry="2" fill="#D5D5D5" stroke="black" stroke-width="0.5"/>
    <!-- Lid extends behind body -->
    <rect x="295" y="60" width="8" height="200" rx="2" ry="2" fill="#D5D5D5" stroke="black" stroke-width="0.5"/>
    <text x="315" y="160" text-anchor="start" font-family="sans-serif" font-size="9" fill="#666">Lid (behind)</text>

    <!-- Hinge arc showing rotation -->
    <path d="M200,55 Q165,55 165,90 Q165,130 200,130" fill="none" stroke="#CC0000" stroke-width="0.4" stroke-dasharray="3,2"/>
    <text x="150" y="95" text-anchor="end" font-family="sans-serif" font-size="9" fill="#CC0000">180deg</text>

    <!-- Buttons on front -->
    <rect x="192" y="260" width="6" height="22" rx="1" ry="1" fill="#C0C0C0" stroke="black" stroke-width="0.4"/>

    <!-- USB-C at bottom -->
    <rect x="230" y="340" width="40" height="5" rx="2" ry="2" fill="white" stroke="black" stroke-width="0.5"/>
    <text x="250" y="355" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">USB-C</text>

    <!-- Dimension: body depth 18mm -->
    <line x1="200" y1="360" x2="300" y2="360" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="250" y="375" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CC0000">18mm</text>

    <!-- Dimension: body height 65mm -->
    <line x1="165" y1="60" x2="165" y2="340" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="160" y1="60" x2="170" y2="60" stroke="#CC0000" stroke-width="0.3"/>
    <line x1="160" y1="340" x2="170" y2="340" stroke="#CC0000" stroke-width="0.3"/>
    <text x="155" y="205" text-anchor="end" font-family="sans-serif" font-size="10" fill="#CC0000">65mm</text>

    <!-- Wake button on side -->
    <rect x="300" y="95" width="5" height="20" rx="1" ry="1" fill="#C8C8C8" stroke="black" stroke-width="0.4"/>
    <text x="312" y="108" font-family="sans-serif" font-size="9" fill="#666">Wake</text>
  </g>

  <!-- ==================== VIEW 4: Cross-Section closed (bottom-right) ==================== -->
  <g transform="translate(600, 500)">
    <text x="280" y="15" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">Cross-Section (lid closed)</text>

    <!-- Outer shell walls -->
    <!-- Left wall -->
    <rect x="130" y="40" width="9" height="340" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Right wall -->
    <rect x="411" y="40" width="9" height="340" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Bottom wall -->
    <rect x="130" y="371" width="290" height="9" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>

    <!-- Lid shell (top) -->
    <rect x="125" y="40" width="300" height="9" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Lid interior gap (air above screen for protection) -->
    <rect x="139" y="49" width="272" height="25" fill="#F8F8F8" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>
    <text x="275" y="65" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">Air gap (screen protection)</text>

    <!-- Lid bottom/body top wall -->
    <rect x="130" y="74" width="290" height="6" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <text x="440" y="77" font-family="sans-serif" font-size="8" fill="#666">Lid/body seam</text>

    <!-- Z-stack below lid -->
    <!-- Display -->
    <rect x="139" y="90" width="272" height="22" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="275" y="105" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Display module</text>

    <!-- Spacer -->
    <rect x="139" y="112" width="272" height="8" fill="white" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>

    <!-- PCB -->
    <rect x="139" y="120" width="272" height="12" fill="#90C695" stroke="black" stroke-width="0.5"/>
    <text x="275" y="130" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">PCB (1.6mm)</text>

    <!-- ESP32 -->
    <rect x="180" y="132" width="80" height="16" fill="#70A675" stroke="black" stroke-width="0.5"/>
    <text x="220" y="143" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">ESP32-S3</text>

    <!-- Gap -->
    <rect x="139" y="148" width="272" height="6" fill="white" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>

    <!-- Battery -->
    <rect x="139" y="154" width="272" height="40" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
    <text x="275" y="178" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">LiPo Battery</text>

    <!-- Dimension: total height with lid -->
    <line x1="445" y1="40" x2="445" y2="380" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="458" y="215" text-anchor="start" font-family="sans-serif" font-size="10" fill="#CC0000">18mm total</text>

    <!-- Dimension: lid thickness -->
    <line x1="110" y1="40" x2="110" y2="80" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="100" y="63" text-anchor="end" font-family="sans-serif" font-size="9" fill="#CC0000">~5mm lid</text>

    <!-- Legend -->
    <rect x="140" y="280" width="12" height="8" fill="#B0D4F1" stroke="black" stroke-width="0.3"/>
    <text x="158" y="288" font-family="sans-serif" font-size="9">Display</text>
    <rect x="140" y="294" width="12" height="8" fill="#90C695" stroke="black" stroke-width="0.3"/>
    <text x="158" y="302" font-family="sans-serif" font-size="9">PCB</text>
    <rect x="140" y="308" width="12" height="8" fill="#D4A84B" stroke="black" stroke-width="0.3"/>
    <text x="158" y="316" font-family="sans-serif" font-size="9">Battery</text>
    <rect x="140" y="322" width="12" height="8" fill="url(#hatch)" stroke="black" stroke-width="0.3"/>
    <text x="158" y="330" font-family="sans-serif" font-size="9">Shell wall</text>
  </g>
</svg>