<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#CC0000"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#CC0000"/>
    </marker>
    <pattern id="hatch4" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="white"/>

  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Design 4: Clamshell — Folding Protective Enclosure (Open: 120mm x 60mm)</text>

  <!-- ============ VIEW 1: OPEN VIEW (top-left) ============ -->
  <text x="280" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Open View (Front)</text>

  <!-- Upper half (screen half) -->
  <rect x="120" y="80" width="320" height="210" rx="10" ry="10" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
  <text x="280" y="98" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#888">Upper Half — Screen</text>

  <!-- Screen bezel -->
  <rect x="162" y="108" width="236" height="162" rx="4" ry="4" fill="none" stroke="black" stroke-width="0.5"/>
  <!-- Active display -->
  <rect x="172" y="118" width="216" height="142" rx="2" ry="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
  <text x="280" y="192" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Active Area</text>
  <text x="280" y="206" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">40.80 x 30.60mm</text>

  <!-- Hinge line -->
  <line x1="120" y1="290" x2="440" y2="290" stroke="black" stroke-width="1.0"/>
  <line x1="120" y1="292" x2="440" y2="292" stroke="black" stroke-width="0.3"/>
  <line x1="120" y1="296" x2="440" y2="296" stroke="black" stroke-width="0.3"/>
  <line x1="120" y1="298" x2="440" y2="298" stroke="black" stroke-width="1.0"/>
  <text x="470" y="296" font-family="sans-serif" font-size="9" fill="#333">Piano hinge</text>

  <!-- Lower half (buttons/electronics) -->
  <rect x="120" y="298" width="320" height="210" rx="10" ry="10" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
  <text x="280" y="320" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#888">Lower Half — Controls</text>

  <!-- 3 main buttons -->
  <rect x="180" y="370" width="50" height="22" rx="4" ry="4" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <rect x="255" y="370" width="50" height="22" rx="4" ry="4" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <rect x="330" y="370" width="50" height="22" rx="4" ry="4" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <text x="205" y="405" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#333">BTN1</text>
  <text x="280" y="405" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#333">BTN2</text>
  <text x="355" y="405" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#333">BTN3</text>

  <!-- Wake button -->
  <rect x="260" y="430" width="40" height="14" rx="3" fill="#C8C8C8" stroke="black" stroke-width="0.5"/>
  <text x="280" y="458" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#333">Wake</text>

  <!-- Status LED -->
  <circle cx="280" cy="340" r="4" fill="#4CAF50" stroke="black" stroke-width="0.3"/>
  <text x="295" y="344" font-family="sans-serif" font-size="7" fill="#333">LED</text>

  <!-- USB-C at bottom -->
  <rect x="266" y="504" width="28" height="6" rx="2" fill="white" stroke="black" stroke-width="0.5"/>
  <text x="280" y="520" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">USB-C</text>

  <!-- Dimension: width 60mm -->
  <line x1="120" y1="540" x2="440" y2="540" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="120" y1="530" x2="120" y2="550" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="440" y1="530" x2="440" y2="550" stroke="#CC0000" stroke-width="0.5"/>
  <text x="280" y="556" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CC0000">60.0mm</text>

  <!-- Dimension: total open height 120mm -->
  <line x1="90" y1="80" x2="90" y2="508" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="80" y1="80" x2="100" y2="80" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="80" y1="508" x2="100" y2="508" stroke="#CC0000" stroke-width="0.5"/>
  <text x="70" y="298" text-anchor="end" font-family="sans-serif" font-size="10" fill="#CC0000">120mm</text>
  <text x="70" y="312" text-anchor="end" font-family="sans-serif" font-size="9" fill="#CC0000">open</text>

  <!-- Dimension: each half ~55mm -->
  <line x1="475" y1="80" x2="475" y2="290" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="488" y="188" font-family="sans-serif" font-size="9" fill="#CC0000">~55mm</text>

  <!-- Button spacing -->
  <line x1="205" y1="398" x2="280" y2="398" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="242" y="415" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#CC0000">14mm</text>

  <!-- ============ VIEW 2: CLOSED SIDE VIEW (top-right) ============ -->
  <text x="880" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Closed Side View</text>

  <!-- Closed profile - two halves stacked -->
  <!-- Upper shell (screen cover) -->
  <rect x="770" y="140" width="220" height="50" rx="8" ry="8" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
  <text x="880" y="169" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#555">Screen half (cover)</text>

  <!-- Hinge at left side -->
  <circle cx="770" cy="190" r="10" fill="#CCC" stroke="black" stroke-width="0.5"/>
  <circle cx="770" cy="190" r="3" fill="#999" stroke="black" stroke-width="0.3"/>
  <text x="740" y="194" text-anchor="end" font-family="sans-serif" font-size="8" fill="#333">Hinge</text>

  <!-- Lower shell (electronics) -->
  <rect x="770" y="190" width="220" height="60" rx="8" ry="8" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
  <text x="880" y="224" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#555">Electronics half</text>

  <!-- Components visible as dashed lines inside -->
  <rect x="790" y="200" width="80" height="30" fill="none" stroke="#90C695" stroke-width="0.3" stroke-dasharray="2,2"/>
  <text x="830" y="218" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#90C695">PCB</text>
  <rect x="880" y="205" width="90" height="25" fill="none" stroke="#D4A84B" stroke-width="0.3" stroke-dasharray="2,2"/>
  <text x="925" y="220" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#D4A84B">Battery</text>

  <!-- USB-C on bottom -->
  <rect x="870" y="248" width="20" height="5" rx="1" fill="white" stroke="black" stroke-width="0.5"/>
  <text x="880" y="264" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#333">USB-C</text>

  <!-- Magnetic latch on right -->
  <circle cx="988" cy="190" r="5" fill="#999" stroke="black" stroke-width="0.3"/>
  <text x="1002" y="193" font-family="sans-serif" font-size="7" fill="#555">Mag latch</text>

  <!-- Dimension: closed width ~65mm -->
  <line x1="770" y1="290" x2="990" y2="290" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="770" y1="280" x2="770" y2="300" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="990" y1="280" x2="990" y2="300" stroke="#CC0000" stroke-width="0.5"/>
  <text x="880" y="306" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CC0000">~65mm (closed length)</text>

  <!-- Dimension: closed height ~20mm -->
  <line x1="1020" y1="140" x2="1020" y2="250" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="1010" y1="140" x2="1030" y2="140" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="1010" y1="250" x2="1030" y2="250" stroke="#CC0000" stroke-width="0.5"/>
  <text x="1040" y="200" text-anchor="start" font-family="sans-serif" font-size="10" fill="#CC0000">~20mm</text>

  <!-- Dimension: upper half thickness -->
  <line x1="1050" y1="140" x2="1050" y2="190" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="1068" y="170" font-family="sans-serif" font-size="8" fill="#CC0000">~8mm</text>

  <!-- Dimension: lower half thickness -->
  <line x1="1050" y1="190" x2="1050" y2="250" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="1068" y="224" font-family="sans-serif" font-size="8" fill="#CC0000">~12mm</text>

  <!-- ============ VIEW 3: HINGE DETAIL (bottom-left) ============ -->
  <text x="280" y="590" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Hinge Detail (Close-Up)</text>

  <!-- Magnified hinge cross-section -->
  <!-- Upper shell end -->
  <path d="M100,640 L360,640 L360,700 Q360,720 340,720 L100,720 Z" fill="url(#hatch4)" stroke="black" stroke-width="0.5"/>
  <text x="230" y="665" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Upper shell</text>

  <!-- Lower shell end -->
  <path d="M100,740 L340,740 Q360,740 360,760 L360,820 L100,820 Z" fill="url(#hatch4)" stroke="black" stroke-width="0.5"/>
  <text x="230" y="785" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Lower shell</text>

  <!-- Hinge pin -->
  <circle cx="380" cy="730" r="22" fill="#DDD" stroke="black" stroke-width="0.5"/>
  <circle cx="380" cy="730" r="5" fill="#999" stroke="black" stroke-width="0.5"/>
  <text x="380" y="734" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#333">Pin</text>

  <!-- Hinge barrel upper -->
  <path d="M360,700 Q360,708 370,708 Q402,708 402,730" fill="none" stroke="black" stroke-width="0.5"/>
  <!-- Hinge barrel lower -->
  <path d="M402,730 Q402,752 370,752 Q360,752 360,760" fill="none" stroke="black" stroke-width="0.5"/>

  <!-- FPC cable routing -->
  <path d="M340,710 Q350,710 350,720 L350,740 Q350,750 340,750" fill="none" stroke="#FF8800" stroke-width="1.5"/>
  <text x="325" y="734" text-anchor="end" font-family="sans-serif" font-size="8" fill="#FF8800">FPC cable</text>
  <text x="325" y="746" text-anchor="end" font-family="sans-serif" font-size="7" fill="#FF8800">(display ribbon)</text>

  <!-- FPC cable path through hinge -->
  <path d="M350,720 Q365,720 372,725" fill="none" stroke="#FF8800" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="410" y="715" font-family="sans-serif" font-size="7" fill="#FF8800">FPC routes</text>
  <text x="410" y="726" font-family="sans-serif" font-size="7" fill="#FF8800">through hollow</text>
  <text x="410" y="737" font-family="sans-serif" font-size="7" fill="#FF8800">hinge barrel</text>

  <!-- Hinge pin diameter -->
  <line x1="380" y1="708" x2="380" y2="752" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="395" y="770" font-family="sans-serif" font-size="8" fill="#CC0000">Hinge OD: 4.5mm</text>

  <!-- Detail callout circle -->
  <circle cx="280" cy="730" r="115" fill="none" stroke="black" stroke-width="0.3" stroke-dasharray="4,3"/>
  <text x="160" y="860" font-family="sans-serif" font-size="8" fill="#555">Detail view 4:1 scale</text>

  <!-- Max bend angle note -->
  <path d="M420,680 A50,50 0 0,1 420,780" fill="none" stroke="#CC0000" stroke-width="0.5"/>
  <text x="450" y="780" font-family="sans-serif" font-size="8" fill="#CC0000">180 deg</text>
  <text x="450" y="792" font-family="sans-serif" font-size="8" fill="#CC0000">opening</text>

  <!-- ============ VIEW 4: CROSS-SECTION LOWER HALF (bottom-right) ============ -->
  <text x="880" y="590" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Cross-Section — Lower Half (Electronics)</text>

  <!-- Outer shell -->
  <!-- Top wall -->
  <rect x="680" y="625" width="400" height="12" fill="url(#hatch4)" stroke="black" stroke-width="0.5"/>
  <!-- Bottom wall -->
  <rect x="680" y="855" width="400" height="12" fill="url(#hatch4)" stroke="black" stroke-width="0.5"/>
  <!-- Left wall -->
  <rect x="680" y="637" width="10" height="218" fill="url(#hatch4)" stroke="black" stroke-width="0.5"/>
  <!-- Right wall -->
  <rect x="1070" y="637" width="10" height="218" fill="url(#hatch4)" stroke="black" stroke-width="0.5"/>

  <!-- PCB -->
  <rect x="700" y="645" width="360" height="28" fill="#90C695" stroke="black" stroke-width="0.5"/>
  <text x="880" y="663" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">PCB 1.6mm (45.0 x 40.0mm)</text>

  <!-- ESP32 on PCB top -->
  <rect x="715" y="637" width="56" height="8" fill="#7AB37E" stroke="black" stroke-width="0.3"/>
  <text x="743" y="635" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#333">ESP32-S3-MINI</text>

  <!-- Other components on PCB top -->
  <rect x="800" y="639" width="18" height="6" fill="#AAA" stroke="black" stroke-width="0.2"/>
  <rect x="830" y="639" width="12" height="6" fill="#AAA" stroke="black" stroke-width="0.2"/>
  <rect x="860" y="639" width="18" height="6" fill="#AAA" stroke="black" stroke-width="0.2"/>

  <!-- FPC connector on PCB -->
  <rect x="1020" y="637" width="30" height="8" fill="#FF8800" stroke="black" stroke-width="0.3"/>
  <text x="1035" y="632" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#FF8800">FPC conn</text>

  <!-- Gap -->
  <rect x="700" y="673" width="360" height="14" fill="white" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>

  <!-- Button mechanism (through-hole from top) -->
  <rect x="740" y="625" width="16" height="62" fill="#DDD" stroke="black" stroke-width="0.3"/>
  <rect x="800" y="625" width="16" height="62" fill="#DDD" stroke="black" stroke-width="0.3"/>
  <rect x="860" y="625" width="16" height="62" fill="#DDD" stroke="black" stroke-width="0.3"/>
  <text x="748" y="618" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#333">BTN</text>
  <text x="808" y="618" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#333">BTN</text>
  <text x="868" y="618" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#333">BTN</text>

  <!-- Battery -->
  <rect x="720" y="695" width="300" height="100" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
  <text x="870" y="750" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">LiPo Battery 5.0mm</text>
  <text x="870" y="766" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">30 x 35mm</text>

  <!-- Vibration motor -->
  <circle cx="710" cy="820" r="14" fill="#DDD" stroke="black" stroke-width="0.5"/>
  <text x="710" y="823" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#333">Vibe 6mm</text>

  <!-- USB-C connector through bottom wall -->
  <rect x="860" y="850" width="30" height="18" rx="2" fill="white" stroke="black" stroke-width="0.5"/>
  <text x="875" y="862" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#333">USB-C</text>

  <!-- Gap before bottom wall -->
  <rect x="700" y="800" width="360" height="10" fill="white" stroke="black" stroke-width="0.3" stroke-dasharray="2,2"/>

  <!-- Dimension: lower half thickness ~12mm -->
  <line x1="660" y1="625" x2="660" y2="867" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="650" y1="625" x2="670" y2="625" stroke="#CC0000" stroke-width="0.5"/>
  <line x1="650" y1="867" x2="670" y2="867" stroke="#CC0000" stroke-width="0.5"/>
  <text x="640" y="750" text-anchor="end" font-family="sans-serif" font-size="10" fill="#CC0000">~12mm</text>

  <!-- Wall thickness -->
  <line x1="680" y1="878" x2="690" y2="878" stroke="#CC0000" stroke-width="0.4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="685" y="893" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#CC0000">1.5mm</text>
</svg>