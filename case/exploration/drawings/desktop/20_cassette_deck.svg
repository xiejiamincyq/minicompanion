<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#CC0000" stroke="none"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#CC0000" stroke="none"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#606060" stroke-width="0.8"/>
    </pattern>
    <!-- Brushed aluminum texture -->
    <pattern id="brushed" patternUnits="userSpaceOnUse" width="2" height="200" patternTransform="rotate(0)">
      <line x1="0" y1="0" x2="0" y2="200" stroke="#D8D8D8" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="white"/>

  <!-- Title -->
  <text x="600" y="28" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Design 20: Cassette Deck — 170×100×40mm Landscape Hi-Fi Desktop Case</text>

  <!-- Grid labels -->
  <text x="200" y="58" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">FRONT VIEW</text>
  <text x="600" y="58" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">SIDE PROFILE</text>
  <text x="1000" y="58" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">BACK VIEW</text>
  <text x="200" y="478" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">TOP-DOWN VIEW</text>
  <text x="600" y="478" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">CROSS-SECTION</text>
  <text x="1000" y="478" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">DETAIL — Cassette Door + Buttons</text>

  <!-- Grid dividers -->
  <line x1="400" y1="40" x2="400" y2="450" stroke="#CCC" stroke-width="0.5"/>
  <line x1="800" y1="40" x2="800" y2="450" stroke="#CCC" stroke-width="0.5"/>
  <line x1="400" y1="460" x2="400" y2="890" stroke="#CCC" stroke-width="0.5"/>
  <line x1="800" y1="460" x2="800" y2="890" stroke="#CCC" stroke-width="0.5"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#CCC" stroke-width="0.5"/>

  <!-- ============ FRONT VIEW (top-left) ============ -->
  <g transform="translate(200,240)">
    <!-- Main body — brushed aluminum faceplate -->
    <rect x="-150" y="-50" width="300" height="100" rx="3" fill="url(#brushed)" stroke="black" stroke-width="0.5"/>
    <rect x="-150" y="-50" width="300" height="100" rx="3" fill="#E8E4E0" fill-opacity="0.5" stroke="black" stroke-width="0.5"/>

    <!-- Screen in VU meter position (upper portion) -->
    <rect x="-65" y="-42" width="130" height="40" rx="2" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="0" y="-18" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#336">5.0" SSD1963 — VU Meter Position</text>

    <!-- VU meter scale markings above screen -->
    <line x1="-60" y1="-40" x2="-60" y2="-44" stroke="#888" stroke-width="0.3"/>
    <line x1="-30" y1="-40" x2="-30" y2="-44" stroke="#888" stroke-width="0.3"/>
    <line x1="0" y1="-40" x2="0" y2="-44" stroke="#888" stroke-width="0.3"/>
    <line x1="30" y1="-40" x2="30" y2="-44" stroke="#888" stroke-width="0.3"/>
    <line x1="60" y1="-40" x2="60" y2="-44" stroke="#888" stroke-width="0.3"/>

    <!-- LED indicators (left of screen) -->
    <circle cx="-90" cy="-35" r="3" fill="#44CC44" stroke="black" stroke-width="0.3"/>
    <circle cx="-90" cy="-25" r="3" fill="#CC4444" stroke="black" stroke-width="0.3"/>
    <circle cx="-90" cy="-15" r="3" fill="#CCCC44" stroke="black" stroke-width="0.3"/>
    <text x="-110" y="-32" font-family="sans-serif" font-size="7" text-anchor="end" fill="#555">PWR</text>
    <text x="-110" y="-22" font-family="sans-serif" font-size="7" text-anchor="end" fill="#555">ERR</text>
    <text x="-110" y="-12" font-family="sans-serif" font-size="7" text-anchor="end" fill="#555">ACT</text>

    <!-- Cassette door below screen -->
    <rect x="-55" y="5" width="110" height="35" rx="2" fill="#C8C4C0" stroke="black" stroke-width="0.5"/>
    <!-- Cassette window -->
    <rect x="-40" y="10" width="80" height="24" rx="1" fill="#333" stroke="black" stroke-width="0.5" fill-opacity="0.3"/>
    <!-- Tape reels -->
    <circle cx="-15" cy="22" r="8" fill="none" stroke="#666" stroke-width="0.5"/>
    <circle cx="15" cy="22" r="8" fill="none" stroke="#666" stroke-width="0.5"/>
    <circle cx="-15" cy="22" r="3" fill="#888" stroke="black" stroke-width="0.3"/>
    <circle cx="15" cy="22" r="3" fill="#888" stroke="black" stroke-width="0.3"/>
    <text x="0" y="50" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#555">Cassette door</text>

    <!-- 3 transport buttons (bottom right) -->
    <rect x="80" y="10" width="18" height="12" rx="2" fill="#999" stroke="black" stroke-width="0.5"/>
    <rect x="102" y="10" width="18" height="12" rx="2" fill="#999" stroke="black" stroke-width="0.5"/>
    <rect x="124" y="10" width="18" height="12" rx="2" fill="#999" stroke="black" stroke-width="0.5"/>
    <!-- Button symbols -->
    <polygon points="86,13 86,19 91,16" fill="white" stroke="none"/>
    <rect x="106" y="13" width="3" height="6" fill="white" stroke="none"/>
    <rect x="112" y="13" width="3" height="6" fill="white" stroke="none"/>
    <rect x="128" y="13" width="10" height="6" fill="white" stroke="none"/>
    <text x="120" y="34" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#555">Transport</text>

    <!-- Dimension: width 170mm -->
    <line x1="-150" y1="-68" x2="150" y2="-68" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="-150" y1="-62" x2="-150" y2="-75" stroke="#CC0000" stroke-width="0.5"/>
    <line x1="150" y1="-62" x2="150" y2="-75" stroke="#CC0000" stroke-width="0.5"/>
    <text x="0" y="-73" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#CC0000">170mm</text>

    <!-- Dimension: height 100mm -->
    <line x1="165" y1="-50" x2="165" y2="50" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="158" y1="-50" x2="172" y2="-50" stroke="#CC0000" stroke-width="0.5"/>
    <line x1="158" y1="50" x2="172" y2="50" stroke="#CC0000" stroke-width="0.5"/>
    <text x="178" y="3" font-family="sans-serif" font-size="9" fill="#CC0000">100mm</text>
  </g>

  <!-- ============ SIDE PROFILE (top-center) ============ -->
  <g transform="translate(600,240)">
    <!-- Low 40mm rack profile -->
    <rect x="-30" y="-50" width="60" height="100" rx="2" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

    <!-- Front face detail -->
    <rect x="-30" y="-46" width="3" height="92" fill="#D0CCC8" stroke="black" stroke-width="0.3"/>
    <text x="-40" y="0" font-family="sans-serif" font-size="8" fill="#888">Front</text>

    <!-- Back -->
    <text x="40" y="0" font-family="sans-serif" font-size="8" fill="#888">Back</text>

    <!-- Feet -->
    <rect x="-25" y="50" width="8" height="4" rx="1" fill="#666" stroke="black" stroke-width="0.3"/>
    <rect x="17" y="50" width="8" height="4" rx="1" fill="#666" stroke="black" stroke-width="0.3"/>

    <!-- Dimension: depth 40mm -->
    <line x1="-30" y1="70" x2="30" y2="70" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="-30" y1="63" x2="-30" y2="77" stroke="#CC0000" stroke-width="0.5"/>
    <line x1="30" y1="63" x2="30" y2="77" stroke="#CC0000" stroke-width="0.5"/>
    <text x="0" y="83" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#CC0000">40mm depth</text>

    <!-- Screen visible edge -->
    <line x1="-28" y1="-40" x2="-28" y2="-5" stroke="#4488CC" stroke-width="1"/>
    <text x="-28" y="-45" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#336">Screen</text>

    <!-- Vent slots on top -->
    <line x1="-15" y1="-50" x2="-15" y2="-48" stroke="#999" stroke-width="0.5"/>
    <line x1="-5" y1="-50" x2="-5" y2="-48" stroke="#999" stroke-width="0.5"/>
    <line x1="5" y1="-50" x2="5" y2="-48" stroke="#999" stroke-width="0.5"/>
    <line x1="15" y1="-50" x2="15" y2="-48" stroke="#999" stroke-width="0.5"/>
  </g>

  <!-- ============ BACK VIEW (top-right) ============ -->
  <g transform="translate(1000,240)">
    <!-- Back panel -->
    <rect x="-150" y="-50" width="300" height="100" rx="3" fill="#D8D8D8" stroke="black" stroke-width="0.5"/>

    <!-- USB-C -->
    <rect x="-10" y="20" width="20" height="7" rx="3" fill="#555" stroke="black" stroke-width="0.5"/>
    <text x="0" y="38" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#555">USB-C 8.94×3.26mm</text>

    <!-- Ventilation slots (rows) -->
    <g>
      <line x1="-100" y1="-35" x2="-60" y2="-35" stroke="#999" stroke-width="0.8"/>
      <line x1="-100" y1="-30" x2="-60" y2="-30" stroke="#999" stroke-width="0.8"/>
      <line x1="-100" y1="-25" x2="-60" y2="-25" stroke="#999" stroke-width="0.8"/>
      <line x1="-100" y1="-20" x2="-60" y2="-20" stroke="#999" stroke-width="0.8"/>
      <line x1="-100" y1="-15" x2="-60" y2="-15" stroke="#999" stroke-width="0.8"/>
      <text x="-80" y="-40" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#888">Vent slots</text>
    </g>
    <g>
      <line x1="60" y1="-35" x2="100" y2="-35" stroke="#999" stroke-width="0.8"/>
      <line x1="60" y1="-30" x2="100" y2="-30" stroke="#999" stroke-width="0.8"/>
      <line x1="60" y1="-25" x2="100" y2="-25" stroke="#999" stroke-width="0.8"/>
      <line x1="60" y1="-20" x2="100" y2="-20" stroke="#999" stroke-width="0.8"/>
      <line x1="60" y1="-15" x2="100" y2="-15" stroke="#999" stroke-width="0.8"/>
      <text x="80" y="-40" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#888">Vent slots</text>
    </g>

    <!-- Label area -->
    <rect x="-40" y="-40" width="80" height="30" rx="1" fill="none" stroke="#BBB" stroke-width="0.5"/>
    <text x="0" y="-22" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#999">Product label</text>

    <!-- Feet (bottom edge) -->
    <rect x="-130" y="46" width="12" height="4" rx="1" fill="#666" stroke="black" stroke-width="0.3"/>
    <rect x="-10" y="46" width="12" height="4" rx="1" fill="#666" stroke="black" stroke-width="0.3"/>
    <rect x="118" y="46" width="12" height="4" rx="1" fill="#666" stroke="black" stroke-width="0.3"/>
  </g>

  <!-- ============ TOP-DOWN VIEW (bottom-left) ============ -->
  <g transform="translate(200,680)">
    <!-- Top surface — clean with vent slots -->
    <rect x="-140" y="-40" width="280" height="60" rx="3" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

    <!-- Vent slot rows -->
    <line x1="-80" y1="-20" x2="-80" y2="0" stroke="#CCC" stroke-width="1"/>
    <line x1="-70" y1="-20" x2="-70" y2="0" stroke="#CCC" stroke-width="1"/>
    <line x1="-60" y1="-20" x2="-60" y2="0" stroke="#CCC" stroke-width="1"/>
    <line x1="-50" y1="-20" x2="-50" y2="0" stroke="#CCC" stroke-width="1"/>
    <line x1="-40" y1="-20" x2="-40" y2="0" stroke="#CCC" stroke-width="1"/>
    <line x1="40" y1="-20" x2="40" y2="0" stroke="#CCC" stroke-width="1"/>
    <line x1="50" y1="-20" x2="50" y2="0" stroke="#CCC" stroke-width="1"/>
    <line x1="60" y1="-20" x2="60" y2="0" stroke="#CCC" stroke-width="1"/>
    <line x1="70" y1="-20" x2="70" y2="0" stroke="#CCC" stroke-width="1"/>
    <line x1="80" y1="-20" x2="80" y2="0" stroke="#CCC" stroke-width="1"/>

    <text x="0" y="-5" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#888">Clean top surface</text>

    <!-- Front edge label -->
    <text x="-140" y="-45" font-family="sans-serif" font-size="8" fill="#888">Front</text>
    <text x="-140" y="32" font-family="sans-serif" font-size="8" fill="#888">Back</text>

    <!-- Dimensions -->
    <line x1="-140" y1="50" x2="140" y2="50" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="0" y="63" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#CC0000">170mm</text>

    <line x1="155" y1="-40" x2="155" y2="20" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="168" y="-8" font-family="sans-serif" font-size="9" fill="#CC0000">40mm</text>
  </g>

  <!-- ============ CROSS-SECTION (bottom-center) ============ -->
  <g transform="translate(600,680)">
    <!-- Horizontal cut through center -->
    <!-- Outer shell -->
    <rect x="-140" y="-50" width="280" height="100" rx="3" fill="url(#hatch)" stroke="black" stroke-width="0.5"/>
    <!-- Inner cavity -->
    <rect x="-136" y="-46" width="272" height="92" rx="2" fill="white" stroke="black" stroke-width="0.5"/>

    <!-- Screen -->
    <rect x="-130" y="-42" width="130" height="40" rx="1" fill="#B0D4F1" stroke="black" stroke-width="0.5"/>
    <text x="-65" y="-18" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#336">Screen</text>

    <!-- PCB -->
    <rect x="-130" y="5" width="250" height="4" fill="#90C695" stroke="black" stroke-width="0.5"/>
    <text x="30" y="3" font-family="sans-serif" font-size="8" fill="#4A7A4E">PCB 110×65mm</text>

    <!-- Speaker behind grille -->
    <circle cx="60" cy="-20" r="18" fill="#D4A84B" stroke="black" stroke-width="0.5"/>
    <text x="60" y="-17" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#8B7030">28mm Spkr</text>

    <!-- Speaker grille lines -->
    <line x1="60" y1="-38" x2="60" y2="-2" stroke="black" stroke-width="0.3"/>
    <line x1="48" y1="-36" x2="48" y2="-4" stroke="black" stroke-width="0.3"/>
    <line x1="72" y1="-36" x2="72" y2="-4" stroke="black" stroke-width="0.3"/>

    <!-- Buttons -->
    <rect x="95" y="15" width="8" height="10" rx="1" fill="#888" stroke="black" stroke-width="0.5"/>
    <rect x="108" y="15" width="8" height="10" rx="1" fill="#888" stroke="black" stroke-width="0.5"/>
    <rect x="121" y="15" width="8" height="10" rx="1" fill="#888" stroke="black" stroke-width="0.5"/>
    <text x="112" y="38" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#555">Buttons</text>

    <!-- Wall thickness -->
    <line x1="-140" y1="-50" x2="-140" y2="-46" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="-155" y="-46" font-family="sans-serif" font-size="8" fill="#CC0000">2mm</text>

    <text x="0" y="55" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#555">Horizontal cut showing internal layout</text>
  </g>

  <!-- ============ DETAIL — Cassette Door + Buttons (bottom-right) ============ -->
  <g transform="translate(1000,680)">
    <!-- Cassette door detail (enlarged) -->
    <text x="-40" y="-130" font-family="sans-serif" font-size="10" font-weight="bold" fill="#555">Cassette Door Hinge:</text>

    <!-- Door housing -->
    <rect x="-100" y="-115" width="140" height="70" rx="2" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>

    <!-- Door (shown partially open) -->
    <rect x="-90" y="-110" width="120" height="55" rx="2" fill="#C8C4C0" stroke="black" stroke-width="0.5"/>
    <g transform="rotate(-30,-90,-55)">
      <rect x="-90" y="-110" width="120" height="55" rx="2" fill="#D0CCC8" stroke="black" stroke-width="0.5" opacity="0.5"/>
      <text x="-30" y="-80" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#888">Door (open)</text>
    </g>

    <!-- Hinge at bottom -->
    <circle cx="-90" cy="-55" r="3" fill="#999" stroke="black" stroke-width="0.5"/>
    <circle cx="30" cy="-55" r="3" fill="#999" stroke="black" stroke-width="0.5"/>
    <text x="-30" y="-40" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#555">Bottom hinge — opens downward</text>

    <!-- USB-C revealed behind door -->
    <rect x="-20" y="-80" width="16" height="5" rx="2" fill="#555" stroke="black" stroke-width="0.5"/>
    <text x="-12" y="-83" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#555">USB-C hidden behind door</text>

    <!-- Transport button recess detail -->
    <text x="80" y="-130" font-family="sans-serif" font-size="10" font-weight="bold" fill="#555">Button:</text>

    <!-- Enlarged single button -->
    <rect x="55" y="-115" width="50" height="40" rx="2" fill="#E0E0E0" stroke="black" stroke-width="0.5"/>
    <!-- Button recess -->
    <rect x="63" y="-108" width="34" height="26" rx="3" fill="#D0D0D0" stroke="black" stroke-width="0.5"/>
    <!-- Button cap -->
    <rect x="67" y="-104" width="26" height="18" rx="2" fill="#999" stroke="black" stroke-width="0.5"/>
    <!-- Play symbol -->
    <polygon points="76,-100 76,-90 84,-95" fill="white" stroke="none"/>

    <!-- Recess depth -->
    <line x1="55" y1="-108" x2="55" y2="-100" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="40" y="-102" font-family="sans-serif" font-size="8" fill="#CC0000">1.5mm</text>
    <text x="40" y="-93" font-family="sans-serif" font-size="8" fill="#CC0000">recess</text>

    <!-- Button size -->
    <line x1="67" y1="-70" x2="93" y2="-70" stroke="#CC0000" stroke-width="0.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="80" y="-62" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#CC0000">6mm cap</text>
  </g>
</svg>